[package]
name = "clade-dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

description = "TRIOS Clade Web Dashboard - real-time Sovereign + Canary health monitoring"

[dependencies]
chrono = "0.4"
