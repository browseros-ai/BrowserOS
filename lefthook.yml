commit-msg:
  commands:
    conventional:
      run: >-
        msg=$(head -1 {1}); echo $msg | grep -E '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?: .+' >/dev/null || { echo Commit-message-must-follow-Conventional-Commits-format; exit 1; }

pre-commit:
  commands:
    biome-check:
      root: "packages/browseros-agent/"
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    file-length:
      root: "packages/browseros-agent/"
      glob: "*.{ts,tsx}"
      exclude: "*.{test,spec,d}.ts|*.{test,spec}.tsx|**/__tests__/**|**/tests/**|**/*.generated.*"
      run: >-
        for file in {staged_files}; do [ -f $file ] || continue; lines=$(wc -l < $file | tr -d ' '); if [ $lines -gt 400 ]; then echo Warning-$file-has-$lines-lines-threshold-400; echo Consider-splitting-this-file-if-it-has-multiple-responsibilities; fi; done

pre-push:
  commands:
    branch-name:
      run: >-
        branch=$(git rev-parse --abbrev-ref HEAD); [ $branch = main ] || [ $branch = master ] || echo $branch | grep -E '^(feat|fix|bugfix|hotfix|release|docs|refactor|test|chore|experiment)/[a-z0-9-]+$' >/dev/null || { echo Warning-Branch-name-does-not-match-recommended-format; }
