        tabId:
          type: integer
          format: int64
        reads:
          type: string
          description: '`block` refuses the agent''s page reads too; `allow` refuses only writes. Defaults to `[takeover] block_reads`.'
          x-extensible-enum: [block, allow]
        ttlSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 3600
          description: The lock releases itself after this long; capped by `[takeover] max_minutes`.
    Lock:
      type: object
      required: [id, reads, settled, createdAt, expiresAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        tabId:
          type: integer
          format: int64
        reads:
          type: string
          x-extensible-enum: [block, allow]
        settled:
          type: boolean
          description: Whether the session's in-flight writes finished within 2 s of locking.
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        releasedAt:
          type: integer
          format: int64
          description: Present once released, by the host or by the TTL.
    Fit:
