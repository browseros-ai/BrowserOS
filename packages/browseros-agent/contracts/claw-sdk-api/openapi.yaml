openapi: 3.0.3
info:
  title: BrowserOS claw-sdk API
  version: 1.0.0
  description: |
    The host-facing API of hosted BrowserOS Neo (claw-sdk): run and operation records,
    screenshots, the live view, the VNC display and owner takeover. Takeover is offered as small
    stable parts (locks, fits, the typed-value sweep, plus `/private` and `/display`) and one
    thin flow over them (`/v1/takeovers`); a host may compose its own flow from the parts.

    It is served on Neo's host listener, never on the agent's MCP port. That is a Unix socket by
    default (`[host_api] socket` in `neo.toml`), with a TCP bind only when `[host_api] tcp` is
    set. The same listener serves sdk-extensions' host API under `/host/v1`. Every request
    needs `Authorization: Bearer <token>` (`[host_api] token_file`); on the socket the peer's
    uid is checked too. Tokens are never accepted in query strings.

    Ids: a run id is a UUIDv7 Neo creates for every run and returns in the result's
    `_meta["com.browseros.neo/run"].id`; an operation id is `<runId>.<seq>`, where `seq` counts the
    run's operations in start order; a session id is the handle `run` returns in
    `_meta["com.browseros.neo/session"]`. A host may also send its own optional `requestId` with a
    run (`_meta["com.browseros.neo/run"] = {requestId?, hostData?}`): runs can then be looked up
    by it, and a repeat of it in the same session never runs again.

    Delivery keeps three answers apart so a client never repeats a write blindly: `not_sent`
    (no side effect was attempted), `done` (Neo has a definite answer) and `unknown` (sent,
    never confirmed).

    Compatibility: changes within `/v1` are additive. New response fields and new values of an
    extensible enum (`x-extensible-enum`) can appear at any time, so clients must ignore fields
    and values they do not know. Fields are never removed or renamed within `/v1`.
servers:
  - url: http://localhost
    description: >-
      Over the Unix socket named by `[host_api] socket` (the Host header is ignored), or over
      TCP at `[host_api] tcp` when that is set.
security:
  - bearer: []
paths:
  /v1/sessions:
    get:
      operationId: listSessions
      summary: Sessions, most recently active first.
      parameters:
        - name: live
          in: query
          description: Only live (`true`) or only ended (`false`) sessions.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: One session with its runs (without operations), pages, privacy and takeover.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{sessionId}/trace:
    get:
      operationId: getSessionTrace
      summary: The session with its runs and every operation, redacted and with privacy applied.
      description: |
        `tail` keeps only the last N operations; runs whose operations were all cut are still
        listed. `screenshots` inlines images: `none`, `all`, or `last:N` (N from 1 to 50).
        Operations after the session's `privateSince` never carry a screenshot, and `visuals`
        then says why.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: tail
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
        - name: screenshots
          in: query
          schema:
            type: string
            default: none
      responses:
        '200':
          description: The trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTrace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{sessionId}/private:
    post:
      operationId: makeSessionPrivate
      summary: Make the session private now. Durable, and it cannot be undone.
      description: |
        Returns once the flag is committed: from then on no screenshot or frame of the session
        is captured or served. Secrets to mask in text go to `POST /host/v1/secrets` instead.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakePrivateRequest'
      responses:
        '200':
          description: The session's privacy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privacy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/runs:
    get:
      operationId: listRuns
      summary: Runs, newest first. `requestId` finds the run a host request produced.
      parameters:
        - name: session
          in: query
          schema:
            type: string
        - name: requestId
          in: query
          description: The host's own id it sent with the run, if it sent one.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            x-extensible-enum: [running, ok, error, cancelled, timeout, interrupted]
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/runs/{runId}:
    get:
      operationId: getRun
      summary: One run with every operation in start order.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: wait
          in: query
          description: >-
            Seconds to hold the request until the run is `complete`. The response is 200 either
            way; check `complete`.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 60
            default: 0
        - name: include
          in: query
          description: '`screenshots` inlines each operation''s screenshot as base64 JPEG.'
          schema:
            type: string
            x-extensible-enum: [screenshots]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/operations/{operationId}:
    get:
      operationId: getOperation
      summary: One operation.
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/operations/{operationId}/screenshot:
    get:
      operationId: getOperationScreenshot
      summary: The page after the operation, as JPEG.
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Withheld'
  /v1/events:
    get:
      operationId: streamEvents
      summary: Server-sent events, for one session or for all.
      description: |
        `text/event-stream`; each event's `data` is one `Event`. Event ids are `<boot>-<n>`:
        send the last one back as `Last-Event-ID` to resume within the same Neo process. After a
        restart, read the state endpoints again.
      parameters:
        - name: session
          in: query
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sessions/{sessionId}/screencast:
    get:
      operationId: getScreencast
      summary: A live MJPEG view of the session's current tab, or of `tab`.
      description: |
        `multipart/x-mixed-replace`; each part carries `Content-Type: image/jpeg`,
        `Content-Length`, `X-Tab-Id`, `X-Url` and `X-Frame-At` (Unix epoch ms, the browser's
        capture time). Without `tab` the stream follows the tab the session's latest operation
        targeted. It ends when the session ends, the pinned tab closes, or the session becomes
        private. Capture runs only while someone watches; viewers of one tab and quality share
        one capture.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Tab'
      responses:
        '200':
          description: The frame stream.
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotLive'
  /v1/sessions/{sessionId}/video:
    get:
      operationId: getVideo
      summary: A live AV1 video (fragmented MP4) of one tab of the session.
      description: |
        The initialization segment first, then one keyframe-led fragment about every 2 seconds,
        for Media Source Extensions or WebCodecs. It stays on `tab`, or on the session's current
        tab when the request starts, and ends when that tab closes, the session ends, or the
        session becomes private. A client that falls behind skips whole fragments.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Tab'
      responses:
        '200':
          description: The video stream.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotLive'
  /v1/display:
    get:
      operationId: openDisplay
      summary: Neo's whole screen as RFB over WebSocket (subprotocol `binary`, noVNC-compatible).
      description: |
        `view` drops every input message. `control` forwards input. Its first input event makes
        every live session private before the event is forwarded, and every session that starts
        while it is open is private from the start. Private-field values are collected for
        masking while it is open and when it closes. View displays pause while a control
        display has forwarded input. `follow` keeps that session's current page in front of the
        screen while no owner has control. `release` ties a control display to a takeover:
        releasing the takeover closes it.
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            x-extensible-enum: [view, control]
        - name: follow
          in: query
          schema:
            type: string
        - name: release
          in: query
          description: A takeover id. Releasing that takeover closes this display.
          schema:
            type: string
      responses:
        '101':
          description: Switching protocols.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/locks:
    post:
      operationId: createLock
      summary: Lock the agent out of a session, a tab, or both. A takeover part.
      description: |
        While the lock is held, the agent's operations in that session, and its operations on
        that tab from any session, fail with `host / owner_has_control` and delivery `not_sent`.
        Writes are always refused; with `reads: block` (the default, from
        `[takeover] block_reads`), operations that target a page there are refused too.
        Operations with no page and no write still run. Taking a lock waits up to 2 s for the
        locked session's in-flight writes; `settled` says whether they finished. Every lock has a
        TTL, so a host that dies cannot lock a session forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        '200':
          description: The lock, held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/locks/{lockId}:
    get:
      operationId: getLock
      summary: One lock.
      parameters:
        - $ref: '#/components/parameters/LockId'
      responses:
        '200':
          description: The lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: releaseLock
      summary: Release a lock. Idempotent.
      parameters:
        - $ref: '#/components/parameters/LockId'
      responses:
        '200':
          description: The lock, released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tabs/{tabId}/fit:
    post:
      operationId: fitTab
      summary: Fit a tab to a viewer's screen. A takeover part.
      description: |
        Brings the tab to the front, sizes Neo's screen to the viewer, and sets the tab to
        mobile (a screen 600 px wide or less: touch, fullscreen) or desktop at that size. The
        first fit of a tab records its viewport mode, window state, zoom and screen size, and
        returns a new fit; while that fit is active, fitting the tab again refits it and returns
        the same fit. While a mobile fit is active, pages the tab opens are pulled into it.
      parameters:
        - $ref: '#/components/parameters/TabId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewerSize'
      responses:
        '200':
          description: The fit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/fits/{fitId}:
    get:
      operationId: getFit
      summary: One fit, with the geometry the owner's page needs. Never values, labels or text.
      parameters:
        - $ref: '#/components/parameters/FitId'
      responses:
        '200':
          description: The fit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/fits/{fitId}/navigate:
    post:
      operationId: navigateFit
      summary: The owner's browser bar, on the fitted tab. A lock does not refuse it.
      parameters:
        - $ref: '#/components/parameters/FitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateRequest'
      responses:
        '200':
          description: Done, or a notice for the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/fits/{fitId}/restore:
    post:
      operationId: restoreFit
      summary: Put the tab back exactly as the fit found it. Idempotent.
      description: |
        Resets zoom and restores the recorded viewport mode and window state. Neo's screen goes
        back to its configured size unless another fit is active.
      parameters:
        - $ref: '#/components/parameters/FitId'
      responses:
        '200':
          description: The fit, restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tabs/{tabId}/sweep:
    post:
      operationId: sweepTab
      summary: Read the tab's sensitive fields into the known secrets list. A takeover part.
      description: |
        One pass over every frame of the tab: each value in a password, card or code field is
        added to the known secrets list (masked everywhere from then on) with the session's
        scope. The final catch for what the owner typed; values are never returned.
      parameters:
        - $ref: '#/components/parameters/TabId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SweepRequest'
      responses:
        '200':
          description: How many values were added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/takeovers:
    post:
      operationId: startTakeover
      summary: The v1 takeover flow, a thin composition of the parts. Start it when the owner opens the link.
      description: |
        In order: make the session private, lock the session and the tab (with the TTL), fit the
        tab to `viewer` when given. The answer names the parts it holds and the display path to
        open. A host may compose its own flow from the parts instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeoverRequest'
      responses:
        '200':
          description: The takeover, active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Takeover'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/takeovers/{takeoverId}:
    get:
      operationId: getTakeover
      summary: One takeover. `wait` holds the request until its state differs from `state`.
      parameters:
        - $ref: '#/components/parameters/TakeoverId'
        - name: wait
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 60
            default: 0
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The takeover.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Takeover'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/takeovers/{takeoverId}/release:
    post:
      operationId: releaseTakeover
      summary: Give the browser back. Idempotent; returns once the agent's lock is lifted.
      description: |
        In order: close the takeover's display, sweep the tab, restore the fit, release the
        lock. The lock's TTL or the tab closing releases it too.
      parameters:
        - $ref: '#/components/parameters/TakeoverId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: The takeover, released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Takeover'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operationId
      in: path
      required: true
      description: '`<runId>.<seq>`.'
      schema:
        type: string
    TakeoverId:
      name: takeoverId
      in: path
      required: true
      schema:
        type: string
    LockId:
      name: lockId
      in: path
      required: true
      schema:
        type: string
    FitId:
      name: fitId
      in: path
      required: true
      schema:
        type: string
    TabId:
      name: tabId
      in: path
      required: true
      description: The browser's tab id (`PageRef.tabId`).
      schema:
        type: integer
        format: int64
    Since:
      name: since
      in: query
      description: At or after this time (Unix epoch ms).
      schema:
        type: integer
        format: int64
        minimum: 0
    Until:
      name: until
      in: query
      description: At or before this time (Unix epoch ms).
      schema:
        type: integer
        format: int64
        minimum: 0
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` from the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    Quality:
      name: quality
      in: query
      description: >-
        `low` is 640×400 at up to 4 frames per second (10 for `/video`); `high` is 1280×800 at
        up to 10 (15 for `/video`). Frames keep the tab's aspect ratio.
      schema:
        type: string
        x-extensible-enum: [low, high]
        default: high
    Tab:
      name: tab
      in: query
      description: A browser tab id the session has open. Without it, the current tab.
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: A parameter or body is invalid (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No token, a wrong token, or a peer uid outside the socket's group (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        Nothing has this id (`not_found`): a session, run, operation, lock, fit, takeover or
        tab. Or retention deleted it (`expired`), or `tab` is not a tab the session has open
        (`tab_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Withheld:
      description: The image is withheld because the session was private (`withheld`), or it expired (`expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotLive:
      description: >-
        Nothing to watch: the session ended (`session_not_live`), has no open tab yet
        (`no_open_tab`), or is private (`session_private`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        A part was already given back: the fit was restored (`fit_restored`), the lock released
        (`lock_released`), or the takeover released (`takeover_released`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: >-
        Neo could not commit a privacy change (`privacy_unavailable`), so nothing was done, or
        the display is not running (`display_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OperationError:
      type: object
      required: [owner, code, message, retryable]
      properties:
        owner:
          type: string
          description: >-
            Whose behavior must change to fix it: `neo` (browser, OS or Neo itself), `script`
            (the agent's own code: a syntax error, `invalid_input`, `strict_mode_violation`,
            `no_match`, `method_unavailable`), `website` (what the page did) or `host` (the
            host's rules, services or owner, including `owner_has_control`).
          x-extensible-enum: [neo, script, website, host]
        code:
          type: string
          description: Stable snake_case, e.g. `owner_has_control`, `strict_mode_violation`, `target_closed`.
        hostCode:
          type: string
          description: The host's own code when `code` is `host_error`, e.g. `needs_owner`.
        message:
          type: string
        retryable:
          type: boolean
          description: True only when delivery is `not_sent` or the operation is a read.
        operationId:
          type: string
          description: On a run's error, the operation it came from.
    PageRef:
      type: object
      properties:
        pageId:
          type: integer
          format: int32
        tabId:
          type: integer
          format: int64
        url:
          type: string
        title:
          type: string
    Privacy:
      type: object
      required: [private]
      properties:
        private:
          type: boolean
        since:
          type: integer
          format: int64
          description: Unix epoch ms; no pixel at or after this time is captured.
        reason:
          type: string
          x-extensible-enum: [secret_input, takeover, display_input, host]
    MakePrivateRequest:
      type: object
      properties:
        reason:
          type: string
          x-extensible-enum: [host]
          default: host
    SessionSummary:
      type: object
      required: [id, status, startedAt, runCount, privacy]
      properties:
        id:
          type: string
        client:
          type: string
          description: The MCP client's `clientInfo.name`.
        status:
          type: string
          x-extensible-enum: [live, ended]
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
        runCount:
          type: integer
          format: int64
        privacy:
          $ref: '#/components/schemas/Privacy'
    Session:
      type: object
      required: [id, status, startedAt, runCount, privacy, pages, runs]
      properties:
        id:
          type: string
        client:
          type: string
        status:
          type: string
          x-extensible-enum: [live, ended]
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
        runCount:
          type: integer
          format: int64
        privacy:
          $ref: '#/components/schemas/Privacy'
        currentPage:
          $ref: '#/components/schemas/PageRef'
        pages:
          type: array
          description: The session's open pages, current first.
          items:
            $ref: '#/components/schemas/PageRef'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        takeover:
          $ref: '#/components/schemas/Takeover'
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
    SessionTrace:
      type: object
      required: [session, runs, operations, truncated, visuals]
      properties:
        session:
          $ref: '#/components/schemas/SessionSummary'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        truncated:
          type: boolean
          description: True when `tail` cut older operations.
        visuals:
          type: string
          x-extensible-enum: [available, withheld_private_input]
    RunSummary:
      type: object
      required: [id, sessionId, status, startedAt, operationCount, complete]
      properties:
        id:
          type: string
        sessionId:
          type: string
        status:
          type: string
          description: '`interrupted`: Neo stopped (crashed or restarted) before the run ended.'
          x-extensible-enum: [running, ok, error, cancelled, timeout, interrupted]
        effects:
          type: string
          description: >-
            `none`: no write was sent. `done`: every write that was sent got a definite answer.
            `unknown`: at least one write was sent and never confirmed; check the page before
            repeating anything. Absent while the run is `running`: Neo reports what the dispatcher
            decided and never guesses an answer before the run ends.
          x-extensible-enum: [none, done, unknown]
        error:
          $ref: '#/components/schemas/OperationError'
        requestId:
          type: string
          description: The host's own id it sent with the run (`_meta["com.browseros.neo/run"].requestId`), if any.
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
        operationCount:
          type: integer
          format: int64
        complete:
          type: boolean
          description: Ended, and its screenshot work finished; a re-read returns the same data.
        traceGaps:
          type: integer
          format: int64
          description: Operation events Neo dropped under disk pressure; zero or absent normally.
    Run:
      type: object
      required: [id, sessionId, status, startedAt, operationCount, complete, operations]
      properties:
        id:
          type: string
        sessionId:
          type: string
        status:
          type: string
          x-extensible-enum: [running, ok, error, cancelled, timeout, interrupted]
        effects:
          type: string
          description: As on `RunSummary`; absent while the run is `running`.
          x-extensible-enum: [none, done, unknown]
        error:
          $ref: '#/components/schemas/OperationError'
        requestId:
          type: string
          description: The host's own id it sent with the run (`_meta["com.browseros.neo/run"].requestId`), if any.
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
        operationCount:
          type: integer
          format: int64
        complete:
          type: boolean
        traceGaps:
          type: integer
          format: int64
        hostData:
          type: object
          description: The host data the run was started with (`_meta["com.browseros.neo/run"].hostData`), if any; masked.
        code:
          type: string
          description: >-
            The script, masked. Stored when the run ends, so it is absent while the run is
            `running`, and when `codeWithheld` is set.
        codeWithheld:
          type: string
          description: >-
            `sensitive_input`: an operation typed into a password, card or code field, so the code
            may hold that value. `unavailable`: Neo stopped before the run ended, so its code was
            never stored.
          x-extensible-enum: [sensitive_input, unavailable]
        result:
          description: The script's return value, masked and bounded.
        resultTruncated:
          type: boolean
        unknown:
          type: array
          description: Write operations that were sent and never confirmed.
          items:
            $ref: '#/components/schemas/UnknownOperation'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
    UnknownOperation:
      type: object
      required: [operationId, name]
      properties:
        operationId:
          type: string
        name:
          type: string
    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        nextCursor:
          type: string
    Operation:
      type: object
      required: [id, runId, name, kind, effect, startedAt, hasScreenshot]
      properties:
        id:
          type: string
        runId:
          type: string
        parentId:
          type: string
          description: The operation this one ran inside; absent for the agent's own calls.
        name:
          type: string
          description: e.g. `page.goto`, `locator.click`, `zuzu.auth.fill`, `host.call`, `host.protectedFill`.
        kind:
          type: string
          x-extensible-enum: [builtin, defined, next, host_call, protected]
        attempt:
          type: integer
          format: int32
          description: For `next`, which call of `next()` this was, from 1.
        effect:
          type: string
          x-extensible-enum: [read, write]
        page:
          $ref: '#/components/schemas/PageRef'
        args:
          description: >-
            Safe arguments: masked, secret fields `[redacted]`, bounded. Page and locator
            handles appear as their branded JSON, e.g. `{"$neo":"locator","page":3,"selector":"…"}`.
        argsTruncated:
          type: boolean
        result:
          description: Safe result, masked and bounded.
        resultTruncated:
          type: boolean
        outcome:
          type: string
          description: Absent while the operation runs.
          x-extensible-enum: [ok, error, cancelled]
        delivery:
          type: string
          description: >-
            `not_sent`: no side effect was attempted. `done`: Neo has a definite answer.
            `unknown`: sent and never confirmed; never repeat it blindly. Absent while the operation
            runs: delivery is what the dispatcher decided when it ended, never a guess.
          x-extensible-enum: [not_sent, done, unknown]
        error:
          $ref: '#/components/schemas/OperationError'
        startedAt:
          type: integer
          format: int64
        sentAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        hasScreenshot:
          type: boolean
        screenshot:
          $ref: '#/components/schemas/Screenshot'
    Screenshot:
      type: object
      required: [contentType, data]
      properties:
        contentType:
          type: string
          x-extensible-enum: [image/jpeg]
        data:
          type: string
          description: The image bytes, base64 with the standard alphabet and padding.
    LockRequest:
      type: object
