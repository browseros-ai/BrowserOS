BadRequest:
  description: Invalid request input.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
Forbidden:
  description: The browser origin is not allowed to write recordings.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
NotFound:
  description: Resource not found.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
Conflict:
  description: Resource is not in the required state.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
Gone:
  description: Resource no longer accepts writes.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
PayloadTooLarge:
  description: UTF-8 encoded request body exceeds the advertised ingest ceiling.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
InternalError:
  description: Internal server error.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
PlanForbidden:
  description: forbidden, when the request comes from a browser origin other than the app.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
PlanNotFound:
  description: >-
    billing_unavailable when this build has no billing gateway, or not_found when the
    checkout or computer is unknown.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
PlanRateLimited:
  description: too_many_tries or rate_limited.
  content:
    application/json:
      schema:
        $ref: ./schemas/plan.yaml#/PlanRateLimitedError
BillingUnreachable:
  description: billing_unreachable, when the billing gateway is down or this computer is offline.
  content:
    application/json:
      schema:
        $ref: ./schemas/common.yaml#/ApiError
