invitation:
  get:
    operationId: getFeedbackInvitation
    description: >-
      Whether this installation should be shown a feedback call invitation.
      At most three rounds are offered, with a 72-hour wait after each dismissal.
      A booking-link click permanently stops invitations.
    parameters:
      - name: supportsRounds
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Opts into repeat invitation rounds. Otherwise only round 1 is offered.
    responses:
      '200':
        description: The invitation decision for this installation.
        content:
          application/json:
            schema:
              $ref: ../schemas/feedback.yaml#/FeedbackInvitation
      '400':
        $ref: ../responses.yaml#/BadRequest
      '500':
        $ref: ../responses.yaml#/InternalError
  post:
    operationId: recordFeedbackInvite
    description: >-
      Records what happened to the offered round. Showing keeps the round open;
      dismissing starts the wait before the next round. Clicking permanently
      stops invitations, including when reported for an older round. Older-round
      shown and dismissed outcomes do not change a newer round. The booking-link
      click is the terminal proxy; there is no booking confirmation integration.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/feedback.yaml#/RecordFeedbackInviteRequest
    responses:
      '200':
        description: The invitation decision after recording the outcome.
        content:
          application/json:
            schema:
              $ref: ../schemas/feedback.yaml#/FeedbackInvitation
      '400':
        $ref: ../responses.yaml#/BadRequest
      '500':
        $ref: ../responses.yaml#/InternalError
