collection:
  get:
    operationId: listSessions
    description: An explicit `status=live` query returns the complete connected-session snapshot and omits `nextCursor`. Cursor and limit govern historical queries.
    parameters:
      - name: profileId
        in: query
        schema:
          type: string
      - name: slug
        in: query
        schema:
          type: string
      - name: status
        in: query
        description: Use `live` to request a complete current snapshot with live browser state.
        schema:
          $ref: ../schemas/sessions.yaml#/SessionStatus
      - name: needsAttention
        in: query
        description: Only tasks that failed or were stopped. Applied before pagination, so pages stay full.
        schema:
          type: boolean
          default: false
      - name: site
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: cursor
        in: query
        description: Historical pagination cursor; ignored for the complete live snapshot.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: limit
        in: query
        description: Historical page size; ignored for the complete live snapshot.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
    responses:
      '200':
        description: A complete connected-session snapshot for `status=live`; otherwise a cursor-paginated historical result.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessions.yaml#/SessionList
      '400':
        $ref: ../responses.yaml#/BadRequest
      '500':
        $ref: ../responses.yaml#/InternalError
detail:
  get:
    operationId: getSession
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: A session and its ordered dispatches.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessions.yaml#/SessionDetail
      '404':
        $ref: ../responses.yaml#/NotFound
      '500':
        $ref: ../responses.yaml#/InternalError
cancel:
  post:
    operationId: cancelSession
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: The session is terminally cancelled and reports how many active browser dispatches were interrupted.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessions.yaml#/CancelSessionResponse
      '404':
        $ref: ../responses.yaml#/NotFound
      '409':
        $ref: ../responses.yaml#/Conflict
      '500':
        $ref: ../responses.yaml#/InternalError
skillDraft:
  get:
    operationId: getSkillDraft
    description: Where making a skill from this finished task stands, shared by every view of the task.
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: The draft's state, with the draft once it is ready.
        content:
          application/json:
            schema:
              $ref: ../schemas/skills.yaml#/SkillDraftStatus
      '404':
        $ref: ../responses.yaml#/NotFound
      '500':
        $ref: ../responses.yaml#/InternalError
  post:
    operationId: draftSkillFromSession
    description: >-
      Write a skill draft from this finished task through the decisions worker. Nothing is saved.
      A draft already written, or one being written, is returned instead of a new one.
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: The draft, or why it could not be written.
        content:
          application/json:
            schema:
              $ref: ../schemas/skills.yaml#/SkillDraftStatus
      '403':
        description: not_entitled, when the plan does not include skill drafts.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      '404':
        $ref: ../responses.yaml#/NotFound
      '422':
        description: not_finished, when the task did not finish.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
      '500':
        $ref: ../responses.yaml#/InternalError
resolveHelp:
  post:
    operationId: resolveHelp
    description: Hand control back to a waiting agent after a human has taken over its page.
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../schemas/sessions.yaml#/ResolveHelpRequest
    responses:
      '200':
        description: The waiting agent was signalled to resume, or no pending request was found.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessions.yaml#/ResolveHelpResponse
      '400':
        $ref: ../responses.yaml#/BadRequest
      '500':
        $ref: ../responses.yaml#/InternalError
preview:
  get:
    operationId: getSessionPreview
    parameters:
      - $ref: ../parameters.yaml#/SessionId
      - name: browserTabId
        in: query
        description: Capture this currently session-owned browser tab. Omitted follows the most recently active owned tab; an unavailable or unowned tab returns 404.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: refresh
        in: query
        description: Ignored client cache-busting token for preview URLs.
        schema:
          type: integer
          format: int64
          minimum: 0
    responses:
      '200':
        description: Fresh viewport JPEG from the selected currently owned browser tab, or the most recently active owned tab when no selection is supplied.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../responses.yaml#/BadRequest
      '404':
        description: The session does not resolve to a currently owned live browser tab preview.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
            example:
              code: preview_not_found
              message: session preview not found
      '500':
        $ref: ../responses.yaml#/InternalError
screenshots:
  get:
    operationId: listSessionScreenshots
    parameters:
      - $ref: ../parameters.yaml#/SessionId
    responses:
      '200':
        description: Screenshot metadata ordered oldest to newest by capture time and screenshot ID.
        content:
          application/json:
            schema:
              $ref: ../schemas/sessions.yaml#/SessionScreenshotList
      '404':
        $ref: ../responses.yaml#/NotFound
      '500':
        $ref: ../responses.yaml#/InternalError
screenshot:
  get:
    operationId: getSessionScreenshot
    parameters:
      - $ref: ../parameters.yaml#/SessionId
      - $ref: ../parameters.yaml#/ScreenshotId
    responses:
      '200':
        description: Immutable session-owned screenshot JPEG.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      '400':
        $ref: ../responses.yaml#/BadRequest
      '404':
        description: The screenshot is unknown or is not owned by this session.
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
            example:
              code: screenshot_not_found
              message: session screenshot not found
      '500':
        $ref: ../responses.yaml#/InternalError
helpEvents:
  get:
    operationId: streamHelpEvents
    description: >-
      Server-Sent Events. Sends an event named `help` at once and then whenever
      the open help requests change (one is opened, handed back, cancelled,
      consumed by the agent, or reaches its time limit). Each event's data is
      `{"version": <number>}` and carries no request details: read
      `GET /api/v1/sessions?status=live` for the requests themselves.
    responses:
      '200':
        description: A stream of `help` events until the client disconnects.
        content:
          text/event-stream:
            schema:
              type: string
