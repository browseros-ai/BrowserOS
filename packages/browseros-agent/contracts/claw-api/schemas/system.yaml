HealthResponse:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      type: string
      enum: [ok]
      description: >-
        Reports only that this process is serving. It stays `ok` while the browser
        link is down, because the supervisor restarts the server on a non-200 and a
        restart cannot restore a link the operating system tore down. Read `browser`
        for whether agent tools can actually run.
    browser:
      $ref: '#/BrowserLink'
BrowserLink:
  type: object
  additionalProperties: false
  required: [connected, downForMs, lastError]
  description: The server's live connection to the browser it drives.
  properties:
    connected:
      type: boolean
    downForMs:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: Milliseconds since the link was lost, while the server reconnects. Absent when connected.
    lastError:
      type: string
      nullable: true
      description: Why the link was last lost, when known.
ShutdownResponse:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status:
      type: string
      enum: [ok]
SystemInfo:
  type: object
  additionalProperties: false
  required: [product, version, url]
  properties:
    product:
      type: string
    version:
      type: string
    url:
      type: string
      format: uri
    capabilities:
      $ref: '#/SystemCapabilities'
    schema:
      $ref: '#/SchemaStatus'
SchemaStatus:
  type: object
  additionalProperties: false
  required: [databaseAhead, unknownMigrations]
  description: >-
    How the data this server opened compares to the schema this build knows. When the
    database was migrated by a newer BrowserOS neo, the server runs read-forward on the
    columns it understands and reports the migrations it does not have, so the app can
    prompt the user to update BrowserOS neo to match its data.
  properties:
    databaseAhead:
      type: boolean
      description: True when the database carries applied migrations this build does not contain.
    unknownMigrations:
      type: array
      items:
        type: string
      description: Names of the applied migrations this build does not know. Empty unless databaseAhead is true.
SystemCapabilities:
  type: object
  additionalProperties: false
  properties:
    recordingIngestVersion:
      type: integer
      format: int32
      enum: [2]
      description: Version 2 is session-neutral and keys each stream by Chrome document identity.
    recordingIngestMaxBytes:
      type: integer
      format: int64
      minimum: 1
      description: Maximum UTF-8 encoded request-body bytes accepted by canonical recording ingest.

SystemDiagnostics:
  type: object
  additionalProperties: false
  required: [version, os, osVersion]
  properties:
    version:
      type: string
    os:
      type: string
    osVersion:
      type: string
      nullable: true
      description: User-facing OS release; unavailable when it cannot be determined.
