FeedbackInviteOutcome:
  type: string
  enum: [shown, clicked, dismissed]
  description: >-
    shown records an invitation round reaching the screen; clicked records
    booking interest without closing the round; dismissed closes the round.
    Reloading the card does not start another round.
FeedbackInvitation:
  type: object
  additionalProperties: false
  required: [eligible]
  properties:
    eligible:
      type: boolean
      description: >-
        Whether this installation should be offered a feedback call right now.
        False is returned for every refusal without saying which one applied.
    bookUrl:
      type: string
      format: uri
      description: Where the invitation points. Present only when eligible.
    round:
      type: integer
      format: int32
      minimum: 1
      maximum: 3
      description: The offered invitation round. Older servers may omit it.
RecordFeedbackInviteRequest:
  type: object
  additionalProperties: false
  required: [outcome]
  properties:
    outcome:
      $ref: '#/FeedbackInviteOutcome'
    round:
      type: integer
      format: int32
      minimum: 1
      maximum: 3
      description: The round shown to the reader. Omission targets round 1 only.
