TelemetryState:
  type: object
  additionalProperties: false
  required: [distinctId, enabled, consent]
  properties:
    distinctId:
      type: string
    enabled:
      type: boolean
    consent:
      type: boolean
UpdateTelemetryRequest:
  type: object
  additionalProperties: false
  required: [consent]
  properties:
    consent:
      type: boolean
AgentSettings:
  type: object
  additionalProperties: false
  required: [humanHelpEnabled]
  properties:
    humanHelpEnabled:
      type: boolean
UpdateAgentSettingsRequest:
  type: object
  additionalProperties: false
  required: [humanHelpEnabled]
  properties:
    humanHelpEnabled:
      type: boolean
