PlanStatus:
  type: string
  enum: [none, active, ending, paymentFailed, unpaid]
  description: >-
    none: this computer has no plan. active: paid and renewing. ending: cancelled, ultrafast lasts
    until endsAt. paymentFailed: a payment failed and ultrafast lasts until graceUntil. unpaid: still
    billed but past the grace period, or paused, so features is empty while the key, the
    portal and cancel keep working.
Plan:
  type: object
  additionalProperties: false
  required:
    [available, plan, planName, features, status, periodEnd, endsAt, graceUntil, onKey, checkedAt, stale]
  description: >-
    This computer's plan, read from the last verified licence. Reading it never reaches the
    billing gateway.
  properties:
    available:
      type: boolean
      description: False when this build has no billing gateway, in which case every other plan route answers 404 billing_unavailable. Also false while ultrafast is not on sale on this computer and it has no licence; then pricing and checkout answer 404 billing_unavailable and the other routes work as usual.
    plan:
      type: string
      nullable: true
      description: The plan id, such as "ultrafast". Null when status is none.
    planName:
      type: string
      nullable: true
      description: The plan's display name from the pricing list, such as "ultrafast".
    features:
      type: array
      description: Feature flags the plan turns on. Empty when status is none or unpaid.
      items:
        type: string
    status:
      $ref: '#/PlanStatus'
    periodEnd:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: End of the current billing period, in epoch milliseconds.
    endsAt:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: When a cancelled plan stops, in epoch milliseconds. Set only while status is ending.
    graceUntil:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: When the grace period after a failed payment ends, in epoch milliseconds. Set only while status is paymentFailed.
    onKey:
      type: boolean
      description: Whether this computer is on a licence key. The key itself is never returned.
    checkedAt:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: The last successful refresh from the billing gateway, in epoch milliseconds.
    stale:
      type: boolean
      description: True when the last refresh failed and the saved licence is still valid.
PriceInterval:
  type: string
  enum: [day, week, month, year]
PlanPrice:
  type: object
  additionalProperties: false
  required: [interval, intervalCount, amount, currency]
  properties:
    interval:
      $ref: '#/PriceInterval'
    intervalCount:
      type: integer
      format: int32
      minimum: 1
      description: How many intervals one billing period lasts.
    amount:
      type: integer
      format: int64
      minimum: 0
      description: The price per period in the currency's smallest unit, such as cents.
    currency:
      type: string
      minLength: 1
      description: Lower-case ISO 4217 code, such as "usd".
PricedPlan:
  type: object
  additionalProperties: false
  required: [plan, name, description, features, prices]
  properties:
    plan:
      type: string
      minLength: 1
    name:
      type: string
    description:
      type: string
      nullable: true
    features:
      type: array
      items:
        type: string
    prices:
      type: array
      items:
        $ref: '#/PlanPrice'
PlanPricing:
  type: object
  additionalProperties: false
  required: [plans]
  properties:
    plans:
      type: array
      items:
        $ref: '#/PricedPlan'
StartPlanCheckoutRequest:
  type: object
  additionalProperties: false
  required: [plan, interval]
  properties:
    plan:
      type: string
      minLength: 1
    interval:
      $ref: '#/PriceInterval'
    intervalCount:
      type: integer
      format: int32
      minimum: 1
      description: Defaults to 1.
PlanCheckout:
  type: object
  additionalProperties: false
  required: [checkoutId, url]
  properties:
    checkoutId:
      type: string
      minLength: 1
      description: The checkout's UUID, for polling its status.
    url:
      type: string
      format: uri
      description: The hosted payment page to open in a new tab.
PlanCheckoutPhase:
  type: string
  enum: [open, complete, expired]
PlanCheckoutStatus:
  type: object
  additionalProperties: false
  required: [status, plan]
  description: A checkout's progress. The licence key is never included; it is sent by email only.
  properties:
    status:
      $ref: '#/PlanCheckoutPhase'
    plan:
      allOf:
        - $ref: '#/Plan'
      nullable: true
      description: This computer's plan once the checkout is complete and its licence is saved. Null until then.
PlanComputer:
  type: object
  additionalProperties: false
  required: [installId, label, platform, lastSeenAt, activatedAt, thisComputer]
  properties:
    installId:
      type: string
      minLength: 1
      description: The computer's install UUID.
    label:
      type: string
      nullable: true
      description: The computer's name. It starts as the computer's own name and can be renamed from any computer on the key.
    platform:
      type: string
      description: The operating system, such as "macos", "windows" or "linux".
    lastSeenAt:
      type: integer
      format: int64
      minimum: 0
      description: When the computer last reached the billing gateway, in epoch milliseconds.
    activatedAt:
      type: integer
      format: int64
      minimum: 0
      description: When the computer joined the key, in epoch milliseconds.
    thisComputer:
      type: boolean
PlanKey:
  type: object
  additionalProperties: false
  required: [hint, cap, computers]
  description: The licence key this computer is on. Only its first group is returned, never the key.
  properties:
    hint:
      type: string
      pattern: '^[0-9A-Z]{5}$'
      description: The key's first group, such as "7K2QM" for a key that starts NEO-7K2QM. It cannot be used as a key.
    cap:
      type: integer
      format: int32
      minimum: 1
      description: How many computers the key can be on at once.
    computers:
      type: array
      items:
        $ref: '#/PlanComputer'
ActivatePlanKeyRequest:
  type: object
  additionalProperties: false
  required: [key]
  properties:
    key:
      type: string
      minLength: 1
      maxLength: 80
      description: The licence key from the email. Write only. It is passed to the billing gateway and never stored or returned.
    replace:
      type: string
      minLength: 1
      description: When the key is full, the install UUID of the computer this one takes the place of.
RenamePlanComputerRequest:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 40
      description: The new name, trimmed. Empty after trimming is refused.
PlanKeyChange:
  type: object
  additionalProperties: false
  required: [plan, key]
  description: The result of activating, removing or resetting a key. A reset emails the new key and never returns it.
  properties:
    plan:
      $ref: '#/Plan'
    key:
      allOf:
        - $ref: '#/PlanKey'
      nullable: true
      description: The key this computer is on afterwards. Null when this computer removed itself.
PlanKeyFullError:
  type: object
  additionalProperties: false
  required: [code, message]
  description: >-
    A conflict from activating a key. key_full carries computers, the computers already on the
    key, so the request can be sent again with one to replace. already_subscribed carries none.
  properties:
    code:
      type: string
    message:
      type: string
    requestId:
      type: string
    computers:
      type: array
      description: Present only when code is key_full.
      items:
        $ref: '#/PlanComputer'
PlanRateLimitedError:
  type: object
  additionalProperties: false
  required: [code, message]
  description: A too_many_tries or rate_limited error.
  properties:
    code:
      type: string
    message:
      type: string
    requestId:
      type: string
    retryAfterSeconds:
      type: integer
      format: int32
      minimum: 0
      description: How long to wait before trying again, when known.
CancelPlanRequest:
  type: object
  additionalProperties: false
  properties:
    feedback:
      type: string
      maxLength: 1000
      description: Why the person is cancelling, if they said. Never logged.
PlanPortalFlow:
  type: string
  enum: [billing, updateCard]
PlanPortalRequest:
  type: object
  additionalProperties: false
  required: [flow]
  properties:
    flow:
      $ref: '#/PlanPortalFlow'
PlanPortal:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:
      type: string
      format: uri
      description: The billing portal page to open in a new tab.
PlanSavings:
  type: object
  additionalProperties: false
  required: [totals, tasks, latest]
  description: >-
    What ultrafast has done on this computer, from the task history: every
    task where ultrafast did work (a skill that ran without the agent, or a
    pursue that finished or handed back).
  properties:
    totals:
      allOf:
        - $ref: ./sessions.yaml#/SessionUltrafastRun
      description: >-
        Time, pages read and tokens saved, summed across those tasks. Time
        includes every pursue; pages and tokens count only where neo counted
        them, so pursue runs from before that add time alone.
    tasks:
      type: integer
      format: int64
      minimum: 0
      description: How many tasks ultrafast did work in.
    latest:
      type: array
      maxItems: 3
      description: >-
        The newest of those tasks, newest first, each with what neo measured
        (`ultrafast`) and what it did with pursue (`pursue`) where recorded.
      items:
        $ref: ./sessions.yaml#/SessionSummary
    meter:
      allOf:
        - $ref: '#/PlanSavingsMeter'
      description: >-
        Present only once ultrafast has been on for this computer: what the
        Home meter shows since then.
PlanSavingsMeter:
  type: object
  additionalProperties: false
  required: [since, tokensSaved, runTimes, periods]
  description: >-
    The Home meter for an ultrafast customer, counted from the day this
    computer got ultrafast.
  properties:
    since:
      type: integer
      format: int64
      minimum: 0
      description: >-
        When this computer got ultrafast, in epoch milliseconds: the first time
        it was on here, or the first ultrafast run if that came earlier.
    tokensSaved:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: >-
        Estimated tokens neo kept off the agent since then: page descriptions
        instead of screenshots, plus the page text neo read itself during
        ultrafast runs. The two are measured differently, so this is an
        estimate.
    runTimes:
      type: array
      maxItems: 1000
      description: >-
        When each ultrafast task of the last 7 days last ran, in epoch
        milliseconds, newest first, for a by-day chart in local time.
      items:
        type: integer
        format: int64
        minimum: 0
    neoStepShare:
      type: integer
      format: int32
      minimum: 0
      maximum: 100
      description: >-
        In tasks that used pursue, the average share of browser steps neo took
        itself, as a whole percent. Absent until such a task recorded a step.
    fastestRunMs:
      type: integer
      format: int64
      minimum: 0
      description: >-
        The shortest single ultrafast run: a skill that finished without the
        agent, or a pursue that finished or handed back. Absent before the
        first one.
    periods:
      allOf:
        - $ref: '#/PlanSavingsPeriods'
      description: The meter's Details, for each period it can show.
PlanSavingsPeriods:
  type: object
  additionalProperties: false
  required: [since, last30Days, last7Days]
  description: >-
    The Details numbers since this computer got ultrafast, and for the last
    30 and 7 days. A task counts in a period when its last ultrafast run
    started in it; neo's own saving, time saved and tasks finished follow the
    cockpit's windows.
  properties:
    since:
      allOf:
        - $ref: '#/PlanSavingsPeriod'
      description: >-
        Since this computer got ultrafast. Its tokensSaved is the meter's
        tokensSaved.
    last30Days:
      $ref: '#/PlanSavingsPeriod'
    last7Days:
      $ref: '#/PlanSavingsPeriod'
PlanSavingsPeriod:
  type: object
  additionalProperties: false
  required:
    [tokensSaved, runs, pagesRead, durationMs, siteTasks, siteTasksFinished, topSites, timeSavedMs, tasksFinished, runTimes]
  description: What ultrafast and neo did in one period.
  properties:
    tokensSaved:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: >-
        neo's page-description saving from sessions that ended in the period,
        plus the page text neo read itself in the period's ultrafast tasks.
    runs:
      type: integer
      format: int64
      minimum: 0
      description: Ultrafast tasks in the period.
    pagesRead:
      type: integer
      format: int64
      minimum: 0
      description: Pages neo read itself in those tasks.
    durationMs:
      type: integer
      format: int64
      minimum: 0
      description: Time neo's ultrafast runs took in those tasks.
    fastestRunMs:
      type: integer
      format: int64
      minimum: 0
      description: The shortest single run in the period. Absent without one.
    neoStepShare:
      type: integer
      format: int32
      minimum: 0
      maximum: 100
      description: >-
        In the period's tasks that used pursue, the average share of browser
        steps neo took. Absent without one.
    siteTasks:
      type: integer
      format: int64
      minimum: 0
      description: The period's tasks that used pursue.
    siteTasksFinished:
      type: integer
      format: int64
      minimum: 0
      description: Of those, the ones pursue finished without handing back.
    topSites:
      type: array
      maxItems: 3
      description: Sites with the most ultrafast tasks in the period, most first.
      items:
        $ref: '#/PlanSavingsSite'
    timeSavedMs:
      type: integer
      format: int64
      minimum: 0
      description: Time saved by every task that ended in the period.
    tasksFinished:
      type: integer
      format: int64
      minimum: 0
      description: Tasks that ended in the period.
    runTimes:
      type: array
      maxItems: 10000
      description: >-
        When each of the period's ultrafast tasks last ran, in epoch
        milliseconds, newest first, for a chart by local day or week.
      items:
        type: integer
        format: int64
        minimum: 0
PlanSavingsSite:
  type: object
  additionalProperties: false
  required: [site, runs]
  properties:
    site:
      type: string
      description: The site, as the task list shows it.
    runs:
      type: integer
      format: int64
      minimum: 1
      description: Ultrafast tasks on that site in the period.
