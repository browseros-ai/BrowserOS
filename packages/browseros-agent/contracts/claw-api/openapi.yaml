openapi: 3.0.3
info:
  title: BrowserClaw API
  version: 1.0.0
  description: Implementation-neutral REST contract shared by BrowserClaw clients and servers.
servers:
  - url: http://127.0.0.1:9200
paths:
  /system/health:
    $ref: ./paths/system.yaml#/health
  /system/shutdown:
    $ref: ./paths/system.yaml#/shutdown
  /api/v1/system:
    $ref: ./paths/system.yaml#/info
  /api/v1/cockpit/stats:
    $ref: ./paths/cockpit.yaml#/stats
  /api/v1/settings/telemetry:
    $ref: ./paths/settings.yaml#/telemetry
  /api/v1/sessions:
    $ref: ./paths/sessions.yaml#/collection
  /api/v1/sessions/{sessionId}:
    $ref: ./paths/sessions.yaml#/detail
  /api/v1/sessions/{sessionId}/cancel:
    $ref: ./paths/sessions.yaml#/cancel
  /api/v1/sessions/{sessionId}/recording:
    $ref: ./paths/recordings.yaml#/metadata
  /api/v1/sessions/{sessionId}/recording/events:
    $ref: ./paths/recordings.yaml#/events
  /api/v1/recordings/events:
    $ref: ./paths/recordings.yaml#/ingest
  /api/v1/sessions/{sessionId}/preview:
    $ref: ./paths/sessions.yaml#/preview
  /api/v1/sessions/{sessionId}/screenshots:
    $ref: ./paths/sessions.yaml#/screenshots
  /api/v1/sessions/{sessionId}/screenshots/{screenshotId}:
    $ref: ./paths/sessions.yaml#/screenshot
  /api/v1/connections:
    $ref: ./paths/connections.yaml#/collection
  /api/v1/connections/{harness}:
    $ref: ./paths/connections.yaml#/harness
  /api/v1/audit/storage:
    $ref: ./paths/audit.yaml#/storage
  /api/v1/audit/retention:
    $ref: ./paths/audit.yaml#/retention
  /api/v1/audit/cleanup:
    $ref: ./paths/audit.yaml#/cleanup
  /api/v1/skills:
    $ref: ./paths/skills.yaml#/collection
  /api/v1/skills/{name}:
    $ref: ./paths/skills.yaml#/item
  /api/v1/skills/{name}/runs:
    $ref: ./paths/skills.yaml#/runs
  /api/v1/directory:
    $ref: ./paths/skills.yaml#/directory
  /api/v1/directory/{name}:
    $ref: ./paths/skills.yaml#/directoryItem
  /api/v1/directory/{name}/add:
    $ref: ./paths/skills.yaml#/directoryAdd
