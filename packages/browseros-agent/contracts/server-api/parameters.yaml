ConversationId:
  name: conversationId
  in: path
  required: true
  schema:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|0{8}-0{4}-0{4}-0{4}-0{12}|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
AgentId:
  name: agentId
  in: path
  required: true
  schema:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|0{8}-0{4}-0{4}-0{4}-0{12}|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
ProviderId:
  name: providerId
  in: path
  required: true
  schema:
    type: string
    minLength: 1
JobId:
  name: jobId
  in: path
  required: true
  schema:
    type: string
    minLength: 1
RunId:
  name: runId
  in: path
  required: true
  schema:
    type: string
    minLength: 1
TabId:
  name: tabId
  in: path
  required: true
  schema:
    type: string
    description: Coerced using Number(); must be a non-negative integer.
OAuthProvider:
  name: provider
  in: path
  required: true
  schema:
    type: string
    description: start/token accept chatgpt-pro, github-copilot, qwen-code; other values return 400.
      status/delete accept any string.
McpAgentId:
  name: id
  in: path
  required: true
  schema:
    type: string
