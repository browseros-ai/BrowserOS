collection:
  get:
    operationId: listProviders
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/ProviderList
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
detail:
  get:
    operationId: getProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/PublicProviderResponse
      "400":
        $ref: ../responses.yaml#/ValidationError
      "403":
        $ref: ../responses.yaml#/Forbidden
      "404":
        $ref: ../responses.yaml#/NotFound
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
    parameters:
      - $ref: ../parameters.yaml#/ProviderId
  put:
    operationId: upsertProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/ProviderResponse
      "400":
        $ref: ../responses.yaml#/ValidationError
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Upsert forces kind=llm; PUT returns the full row including credentials. Requires a
      loopback trusted-app request; mutations require an allowed Origin header.
    parameters:
      - $ref: ../parameters.yaml#/ProviderId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/providers.yaml#/UpsertProviderRequest
  delete:
    operationId: deleteProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/SuccessResponse
      "400":
        $ref: ../responses.yaml#/ValidationError
      "403":
        $ref: ../responses.yaml#/Forbidden
      "404":
        $ref: ../responses.yaml#/NotFound
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
    parameters:
      - $ref: ../parameters.yaml#/ProviderId
default:
  get:
    operationId: getDefaultProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/DefaultProviderResponse
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
  put:
    operationId: setDefaultProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/DefaultProviderResponse
      "400":
        $ref: ../responses.yaml#/ValidationError
      "403":
        $ref: ../responses.yaml#/Forbidden
      "404":
        $ref: ../responses.yaml#/NotFound
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/providers.yaml#/SetDefaultProviderRequest
test:
  post:
    operationId: testProvider
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/TestProviderResponse
      "400":
        description: Validation failure or failed provider test, including responseTime.
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/TestProviderBadRequest
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/providers.yaml#/TestProviderRequest
refine:
  post:
    operationId: refinePrompt
    tags:
      - providers
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/RefinePromptResponse
      "400":
        description: Validation failure or provider/model failure.
        content:
          application/json:
            schema:
              $ref: ../schemas/providers.yaml#/RefinePromptBadRequest
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Requires a loopback trusted-app request; mutations require an allowed Origin header.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/providers.yaml#/RefinePromptRequest
