health:
  get:
    operationId: getHealth
    tags:
      - system
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/system.yaml#/HealthResponse
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
healthAlias:
  get:
    operationId: getHealthAlias
    tags:
      - system
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/system.yaml#/HealthResponse
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
