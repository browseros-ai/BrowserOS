shutdown:
  post:
    operationId: shutdownSystem
    tags:
      - system
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../schemas/system.yaml#/ShutdownResponse
      "403":
        $ref: ../responses.yaml#/Forbidden
      "500":
        $ref: ../responses.yaml#/InternalError
    description: Returns 200, schedules shutdown, then exits with status 0. Body ignored; compat alias
      retained for shipped Chromium.
shutdownAlias:
  post:
    operationId: shutdownAlias
    tags:
      - system
    responses:
      "200":
