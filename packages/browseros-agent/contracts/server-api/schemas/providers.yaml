    - sessionToken
UpsertProviderRequest:
  type: object
  additionalProperties: true
  properties:
    baseUrl:
      type: string
      nullable: true
    apiKey:
      type: string
      nullable: true
    accessKeyId:
      type: string
      nullable: true
    secretAccessKey:
      type: string
      nullable: true
    sessionToken:
      type: string
      nullable: true
    resourceName:
      type: string
      nullable: true
    region:
      type: string
      nullable: true
    reasoningEffort:
      type: string
      nullable: true
    reasoningSummary:
      type: string
      nullable: true
    type:
      type: string
      minLength: 1
    name:
      type: string
      minLength: 1
    modelId:
      type: string
      minLength: 1
    contextWindow:
      type: number
    supportsImages:
      type: boolean
    temperature:
      type: number
    createdAt:
      type: number
    headers:
      allOf:
        - $ref: "#/LlmHeaders"
      type: object
      nullable: true
  description: Unknown keys are stripped. Missing or empty credentials preserve existing values; null
    clears. kind is forced to llm.
  required:
    - type
    - name
    - modelId
    - contextWindow
ProviderList:
  type: object
  additionalProperties: false
  properties:
    providers:
      type: array
      items:
        $ref: "#/PublicProvider"
  required:
    - providers
PublicProviderResponse:
  type: object
  additionalProperties: false
  properties:
    provider:
      $ref: "#/PublicProvider"
  required:
    - provider
DefaultProviderResponse:
  type: object
  additionalProperties: false
  properties:
    provider:
      type: object
      allOf:
        - $ref: "#/PublicProvider"
      nullable: true
  required:
    - provider
ProviderResponse:
  type: object
  additionalProperties: false
  properties:
    provider:
      $ref: "#/Provider"
  required:
    - provider
SetDefaultProviderRequest:
  type: object
  additionalProperties: true
  properties:
    providerId:
      type: string
      minLength: 1
  required:
    - providerId
