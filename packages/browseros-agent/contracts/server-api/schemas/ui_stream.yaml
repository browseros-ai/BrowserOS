    (including the empty string). Data is arbitrary JSON; id and transient are optional.
    The pattern is the wire constraint; generated TypeScript retains the template literal
    so data parts cannot obscure narrowing of fixed chunk types. Rust DTOs use String.
  type: object
  additionalProperties: true
  properties:
    type:
      type: string
      pattern: '^data-'
      x-typescript-type: '`data-${string}`'
    id:
      type: string
    data: {}
    transient:
      type: boolean
  required:
    - type
    - data
