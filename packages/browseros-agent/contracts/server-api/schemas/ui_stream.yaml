UiMessageChunk:
  oneOf:
    - $ref: "#/UiStartChunk"
    - $ref: "#/UiStartStepChunk"
    - $ref: "#/UiFinishStepChunk"
    - $ref: "#/UiFinishChunk"
    - $ref: "#/UiAbortChunk"
    - $ref: "#/UiErrorChunk"
    - $ref: "#/UiTextStartChunk"
    - $ref: "#/UiTextDeltaChunk"
    - $ref: "#/UiTextEndChunk"
    - $ref: "#/UiReasoningStartChunk"
    - $ref: "#/UiReasoningDeltaChunk"
    - $ref: "#/UiReasoningEndChunk"
    - $ref: "#/UiToolInputStartChunk"
    - $ref: "#/UiToolInputDeltaChunk"
    - $ref: "#/UiToolInputAvailableChunk"
    - $ref: "#/UiToolInputErrorChunk"
    - $ref: "#/UiToolOutputAvailableChunk"
    - $ref: "#/UiToolOutputErrorChunk"
    - $ref: "#/UiSourceUrlChunk"
    - $ref: "#/UiFileChunk"
  discriminator:
    propertyName: type
    mapping:
      start: "#/UiStartChunk"
      start-step: "#/UiStartStepChunk"
      finish-step: "#/UiFinishStepChunk"
      finish: "#/UiFinishChunk"
      abort: "#/UiAbortChunk"
      error: "#/UiErrorChunk"
      text-start: "#/UiTextStartChunk"
      text-delta: "#/UiTextDeltaChunk"
      text-end: "#/UiTextEndChunk"
      reasoning-start: "#/UiReasoningStartChunk"
      reasoning-delta: "#/UiReasoningDeltaChunk"
      reasoning-end: "#/UiReasoningEndChunk"
      tool-input-start: "#/UiToolInputStartChunk"
      tool-input-delta: "#/UiToolInputDeltaChunk"
      tool-input-available: "#/UiToolInputAvailableChunk"
      tool-input-error: "#/UiToolInputErrorChunk"
      tool-output-available: "#/UiToolOutputAvailableChunk"
      tool-output-error: "#/UiToolOutputErrorChunk"
      source-url: "#/UiSourceUrlChunk"
      file: "#/UiFileChunk"
  description: AI SDK v7 UI message stream v1 JSON payloads. Each SSE data frame contains one chunk;
    [DONE] is a framing sentinel, never a chunk. Metadata remains open.
