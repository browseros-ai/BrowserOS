openapi: 3.0.3
info:
  title: BrowserOS server compatibility API
  version: 1.0.0
  description: Existing apps/server wire format, without a version prefix. Preserves nullable columns,
    request defaults, per-route error dialects, and AI SDK v7 streaming. All routes pass a
    trusted-Origin guard; protected routes additionally check loopback peer/Host/Referer and require
    an app Origin on mutations. CORS preflight allows GET/POST/DELETE/OPTIONS (the current server
    omits PUT). Unmatched routes and trailing slashes return plain-text 404; HEAD inherits GET.
    OAuth wildcard fallback returns 503 when OAuth is unavailable. The separate PKCE callback
    listener on port 1455 is outside this contract.
