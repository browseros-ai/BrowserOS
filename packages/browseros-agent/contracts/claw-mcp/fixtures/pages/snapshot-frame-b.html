<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snapshot frame B</title>
    <style>
      #frame-b-cursor {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="frame-b-action" type="button">Frame B action ready</button>
    <div
      id="frame-b-cursor"
      role="group"
      aria-label="Frame B cursor ready"
    >
      Frame B cursor ready
    </div>
    <script>
      document
        .getElementById('frame-b-action')
        .addEventListener('click', () => {
          document.getElementById('frame-b-action').textContent =
            'Frame B action clicked'
        })
      const deepOrigin = new URLSearchParams(location.search).get('deepOrigin')
      if (deepOrigin) {
        window.addEventListener('message', (event) => {
          if (
            event.data?.fixture === 'snapshot-frame-tree' &&
            event.data.ready === 'deep'
          ) {
            parent.postMessage(event.data, '*')
          }
        })
        const frame = document.createElement('iframe')
        frame.id = 'frame-deep'
        frame.title = 'Snapshot frame deep'
        frame.width = '360'
        frame.height = '160'
        frame.src = `${deepOrigin}/snapshot-frame-deep.html`
        document.body.appendChild(frame)
      }
      parent.postMessage(
        { fixture: 'snapshot-frame-tree', ready: 'frame-b' },
        '*',
      )
    </script>
  </body>
</html>
