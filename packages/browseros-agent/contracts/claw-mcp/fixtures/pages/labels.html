<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Labels fixture</title>
  </head>
  <body>
    <form>
      <label for="email">Email address</label>
      <input id="email" type="email" />
      <label>Wrapped name <input id="wrapped" /></label>
      <label for="pointer" style="cursor: pointer">Pointer label</label>
      <input id="pointer" />
      <!-- A styled checkbox: the input is hidden, so its label is the only thing to click. -->
      <input type="checkbox" id="remember" style="display: none" />
      <label for="remember">Remember me</label>
    </form>
  </body>
</html>
