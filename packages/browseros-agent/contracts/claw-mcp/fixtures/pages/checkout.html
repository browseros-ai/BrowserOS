<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout fixture</title>
  </head>
  <body>
    <h1>Checkout fixture</h1>
    <form id="card-form" action="/paid">
      <label>Name on card <input id="cc-name" autocomplete="cc-name" /></label>
      <label>Card number <input id="cc-number" autocomplete="cc-number" /></label>
      <label>Month <input id="cc-month" autocomplete="cc-exp-month" /></label>
      <label>Year <input id="cc-year" autocomplete="cc-exp-year" /></label>
      <label>CVC <input id="cc-csc" autocomplete="cc-csc" /></label>
      <button type="submit">Pay</button>
    </form>
  </body>
</html>
