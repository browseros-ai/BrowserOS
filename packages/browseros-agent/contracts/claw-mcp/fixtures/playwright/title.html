<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Corpus title</title></head>
<body>
<h1>Title</h1>
<button type="button" id="rename">Rename</button>
<script>
  document.getElementById('rename').addEventListener('click', () => {
    document.title = 'Renamed';
  });
</script>
</body>
</html>
