<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Corpus frame inner</title></head>
<body>
<button type="button" id="frame-button">Frame button</button>
<p id="frame-status">frame idle</p>
<script>
  document.getElementById('frame-button').addEventListener('click', () => {
    document.getElementById('frame-status').textContent = 'frame clicked';
  });
</script>
</body>
</html>
