[workspace]
# Shared crates stay at the top level; neo-sdk groups the runtime and its two JS halves.
# Enumerating these roots keeps the grouping directory from becoming a Cargo member itself.
members = [
    "crates/browseros-*",
    "crates/claw-api",
    "crates/hosted-api",
    "crates/harness-integrations",
    "crates/neo-sdk/neo-*",
    "apps/claw-server",
]
# These are Bun packages whose committed bundles the Rust runtime embeds.
exclude = [
    "crates/neo-sdk/neo-quickjs-injected",
    "crates/neo-sdk/neo-playwright-injected",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/browseros-ai/BrowserOS"

[workspace.dependencies]
neo-capture = { path = "crates/neo-sdk/neo-capture" }
neo-service = { path = "crates/neo-sdk/neo-service" }
harness-integrations = { path = "crates/harness-integrations" }
browseros-cdp = { path = "crates/browseros-cdp" }
browseros-core = { path = "crates/browseros-core" }
browseros-decide = { path = "crates/browseros-decide" }
browseros-mcp = { path = "crates/browseros-mcp" }
claw-api = { path = "crates/claw-api" }
hosted-api = { path = "crates/hosted-api" }
neo-runtime-spec = { path = "crates/neo-sdk/neo-runtime-spec" }
neo-trace = { path = "crates/neo-sdk/neo-trace" }

tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the generated hosted-api models, which use `serde_with::rust::double_option` on
# free-form JSON fields.
serde_with = { version = "3.24", default-features = false, features = ["std"] }
serde_repr = "0.1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.10"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
toml_edit = "0.22"
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
axum = "0.8"
http = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
posthog-rs = { version = "0.21", default-features = false, features = ["async-client"] }
# Deliberately minimal. The default feature set installs a panic hook and a tracing
# integration that would capture far more than the one event we build by hand, which
# would defeat the redaction this feature exists to guarantee.
# A real JS scanner for the run-failure fingerprint. Regex-versus-division is
# context dependent, so a hand-rolled lexer gets it wrong and a wrong lexer in a
# redaction path leaks. Scanner rather than parser: the fingerprint needs token
# kinds, not structure, and a scanner degrades far better on unparseable input.
ress = "0.11"
sentry = { version = "0.46", default-features = false, features = ["reqwest", "rustls"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
socket2 = "0.6"
url = "2"
base64 = "0.22"
bytes = "1"
imagesize = "0.15"
# PNG and JPEG only: the `run` tool downscales returned screenshots into MCP image blocks.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-util = { version = "0.7", features = ["rt"] }
regex = "1"
# The page JavaScript guards (`tests/page_js_guard.rs`) read Rust literals as the compiler does.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.118", features = ["full"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
serde_path_to_error = "0.1"
rquickjs = { version = "0.12.1", default-features = false, features = ["std", "futures", "parallel"] }
clap = { version = "4.5", features = ["derive"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
ulid = "1.2"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3.14"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[profile.dev]
# Dependencies are never stepped into, so their DWARF is pure disk cost: a strip
# probe put debug info at 81% of the largest dependency rlib. Workspace crates
# keep line tables so panics and backtraces still resolve to file and line.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimized, decoding and scaling a full-page screenshot takes seconds; the `run` tool does it
# on every returned image, in tests and dev servers too.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
