[package]
name = "server-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "browseros-server-rs"
path = "src/main.rs"

[dependencies]
browseros-agent.workspace = true
harness-integrations.workspace = true
server-api.workspace = true
ui-message-stream.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
# OAuth PKCE uses OS randomness and URL-safe encoding; SHA-256 is shared with db below.
base64.workspace = true
rand.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest.workspace = true
regex.workspace = true
serde.workspace = true
# Preserve JS object insertion order in HTTP/chat payloads, raw customConfig strings, and
# nested Zod issue strings; reordering keys changes those string-valued wire fields.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url.workspace = true
uuid.workspace = true

# db (P2): the shared browseros.sqlite, drizzle catch-up hashes, Rust-owned migration ledger.
sea-orm.workspace = true
sea-orm-migration.workspace = true
sha2.workspace = true

# P13: process telemetry uses the same SDKs as claw, with build-time public keys.
posthog-rs.workspace = true
sentry.workspace = true
time.workspace = true

[dev-dependencies]
# P14: rmcp test server standing in for loopback /mcp in tests/browseros_engine.rs.
rmcp.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
