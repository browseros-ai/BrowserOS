[package]
name = "claw-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "claw_cli"
path = "src/lib.rs"

[[bin]]
name = "browseros"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
# Model types only. `rmcp::model` is ungated, so this adds no feature to the
# workspace build; taking `client` would unify it onto claw-server too, for a
# transport this crate has to hand-write anyway (rmcp 3.2's client config has
# no initial-session-id field, and tab ownership is keyed to the connection).
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
