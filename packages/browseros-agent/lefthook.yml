commit-msg:
  commands:
    conventional:
      run: bash scripts/lefthook/conventional-commit.sh {1}

pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    file-length:
      glob: "*.{ts,tsx}"
      exclude: "*.{test,spec,d}.ts|*.{test,spec}.tsx|**/__tests__/**|**/tests/**|**/*.generated.*"
      run: bash scripts/lefthook/file-length.sh {staged_files}

pre-push:
  commands:
    branch-name:
      run: bash scripts/lefthook/branch-name.sh
