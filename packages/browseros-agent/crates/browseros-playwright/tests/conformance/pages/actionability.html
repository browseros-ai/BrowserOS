<!doctype html><html><head><meta charset="utf-8"><title>Actionability</title><script src="events.js"></script>
<style>
  #overlay { position: fixed; inset: 0 0 auto 0; height: 220px; background: rgba(0,0,0,.3); }
  #moving { position: relative; animation: slide 300ms linear 2; }
  @keyframes slide { from { left: 0 } to { left: 200px } }
  header { position: sticky; top: 0; height: 60px; background: #eee; }
  .spacer { height: 1400px; }
</style></head>
<body>
<!-- Each element becomes actionable `?after=<ms>` (default 500) after load:
       #appear    hidden, then shown
       #enable    disabled, then enabled
       #moving    animating for 600 ms, then still
       #covered   under #overlay, which is then removed
     and #under-sticky sits below a sticky header once the page scrolls. -->
<header>Sticky header</header>
<button id="appear" style="display:none">Appear</button>
<button id="enable" disabled>Enable</button>
<button id="moving">Moving</button>
<button id="covered">Covered</button>
<div id="overlay"></div>
<div class="spacer"></div>
<button id="under-sticky">Under sticky</button>
<div class="spacer"></div>
<script>
  const after = Number(new URLSearchParams(location.search).get('after') ?? 500)
  addEventListener('load', () => setTimeout(() => {
    document.getElementById('appear').style.display = ''
    document.getElementById('enable').disabled = false
    document.getElementById('overlay').remove()
  }, after))
</script>
</body></html>
