<!doctype html><html><head><meta charset="utf-8"><title>Popups</title><script src="events.js"></script></head>
<body>
<!-- Every way a page opens a page. Each needs a user gesture: on BrowserOS the popup blocker
     refuses a window.open without one, so a case clicks these through harness.pageEval. -->
<button id="tab" onclick="window.open('child.html?name=Tab')">window.open tab</button>
<button id="noopener" onclick="window.open('child.html?name=Noopener', '_blank', 'noopener')">window.open noopener</button>
<button id="window" onclick="window.open('child.html?name=Window', 'w1', 'width=400,height=300')">window.open with features</button>
<a id="blank" href="child.html?name=Blank" target="_blank">target=_blank link</a>
<a id="blank-noopener" href="child.html?name=BlankNoopener" target="_blank" rel="noopener">target=_blank rel=noopener</a>
</body></html>
