<!doctype html><html><head><meta charset="utf-8"><title>Editable</title><script src="events.js"></script></head>
<body>
<!-- Every kind of editable target: inputs of several types, a textarea, contenteditable roots
     (plain, nested, plaintext-only), a readonly and a disabled input. -->
<label>Name <input id="name" value="Ada"></label>
<label>Notes <textarea id="notes">First line
Second line</textarea></label>
<div id="rich" contenteditable="true" aria-label="Rich editor"><p>Rich <b>bold</b> text</p></div>
<div id="plain" contenteditable="plaintext-only" aria-label="Plain editor">Plain text</div>
<div contenteditable="true" aria-label="Outer editor">Outer <span id="nested">nested span</span></div>
<label>Readonly <input id="readonly" value="fixed" readonly></label>
<label>Disabled <input id="disabled" value="off" disabled></label>
<label>Birthday <input id="date" type="date" value="2026-11-05"></label>
<label>Upload <input id="file" type="file"></label>
<label>Agree <input id="agree" type="checkbox"></label>
<label>Volume <input id="volume" type="range" min="0" max="10" value="3"></label>
</body></html>
