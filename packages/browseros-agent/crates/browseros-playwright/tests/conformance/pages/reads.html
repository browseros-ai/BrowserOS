<!doctype html><html><head><meta charset="utf-8"><title>Reads</title><script src="events.js"></script></head>
<body>
<!-- Reads: roles, names, labels, text and whitespace, hidden elements, and open and closed
     shadow roots. `?late=<ms>` adds #late after <ms>, for reads that wait. -->
<h1>Reads</h1>
<nav aria-label="Main"><a href="child.html">Child link</a></nav>
<button id="save">Save</button>
<button id="cancel" aria-label="Cancel order">Cancel</button>
<ul id="fruits"><li>Apple</li><li>  Banana  </li><li>Cherry <b>pie</b></li></ul>
<label>Email <input id="email" value="ada@example.com"></label>
<label for="age">Age</label><input id="age" type="number" value="36">
<p id="hidden" hidden>Hidden text</p>
<p id="invisible" style="visibility:hidden">Invisible text</p>
<p data-testid="greeting">Hello,   <span>world</span>!</p>
<p title="Tooltip">Titled paragraph</p>
<img alt="Logo picture" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<input placeholder="Search here">
<div id="host"></div>
<div id="closed-host"></div>
<script>
  document.getElementById('host').attachShadow({ mode: 'open' }).innerHTML =
    '<button>Shadow button</button><p class="in-shadow">Shadow text</p>'
  document.getElementById('closed-host').attachShadow({ mode: 'closed' }).innerHTML =
    '<button>Closed button</button>'
  const late = new URLSearchParams(location.search).get('late')
  if (late !== null) setTimeout(() => {
    const p = document.createElement('p')
    p.id = 'late'
    p.textContent = 'Late text'
    document.body.append(p)
  }, Number(late))
</script>
</body></html>
