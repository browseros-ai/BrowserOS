- case: locator-misc-2.should-scroll-zero-sized-element-into-view
  path: /returned/L73/y
  kind: finding
  route: R8 pointer actions
  reason: "Both runners scroll the zero-height element into view and its lazy content
    loads (L72 is the same); they stop at different offsets. Neo scrolls with the element's own
    scrollIntoViewIfNeeded(true) in the sealed world (probe/act.ts scroll), upstream with CDP's
    DOM.scrollIntoViewIfNeeded on the node, which leaves it at the viewport's bottom edge (779).
    The offsets are measured; that the two scroll calls cause the difference is inferred."
  p: 779
  n: 693
- case: locator-query.should-allow-some-but-not-all-nested-framelocators
  path: /returned/L267
  kind: finding
  route: R4 resolver
  reason: "Upstream refuses a frame locator nested in or() or and() when it queries
    (\"Frame locators are not allowed inside composite locators\"). Neo's resolver runs the
    composite selector in one frame, where the nested frame chunk matches nothing, so the
    assertion polls until its timeout and reports element(s) not found."
  p: |
    expect(locator).toHaveText(expected) failed

    Locator: locator('iframe').contentFrame().locator('div').or(locator('#iframe').contentFrame().locator('span'))
    Expected: "world"
    Error: Frame locators are not allowed inside composite locators, while querying "locator('iframe').contentFrame().locator('div').or(locator('#iframe').contentFrame().locator('span'))"
  n: |
    expect(locator).toHaveText(expected) failed

    Locator: locator('iframe').contentFrame().locator('div').or(locator('#iframe').contentFrame().locator('span'))
    Expected: "world"
    Timeout: <n>ms
    Error: element(s) not found
