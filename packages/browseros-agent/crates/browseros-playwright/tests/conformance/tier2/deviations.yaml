- case: selectors-role.errors
  path: /returned/L526
  kind: finding
  route: J2 probe, R4 resolver
  reason: "Upstream's message names the error class: 'page.$: InvalidSelectorError: Error while
    parsing selector ...'. Neo's drops 'InvalidSelectorError: ' while it keeps 'Error: ' for the
    engine's plain errors (the other lines of this case match). The probe classifies the error
    as a selector error (probe/index.ts classify), and the name is lost on the way to the
    message."
  p: "page.$: InvalidSelectorError: Error while parsing selector `checkbox[checked~=true]` -
