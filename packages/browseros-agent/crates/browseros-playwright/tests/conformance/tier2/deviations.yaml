- case: page-click.should-click-the-button-when-window-innerwidth-is-corrupted
  path: /returned
  kind: finding
  route: page.evaluate privacy milestone (page/evaluate_guard.rs)
  reason: "The test's page.evaluate returns what Object.defineProperty(window, ...) returns,
    the window itself. Upstream's serializer turns a window into a reference; Neo's evaluate
    returns by value through CDP (page/evaluate_guard.rs), which refuses an object graph that deep,
    so the evaluate throws before the click runs."
  p:
    L881: Clicked
  n:
    threw:
      message: "page.evaluate: Cannot serialize result: object reference chain is too long."
      name: Error
- case: page-click.should-issue-clicks-in-parallel-in-page-and-popup
  path: /returned/threw/message
  kind: finding
  route: page.evaluate privacy milestone (page/evaluate_guard.rs)
  reason: "Upstream evaluates with a user gesture, so window.open from page.evaluate opens a
    popup. Neo's evaluate calls Runtime.callFunctionOn without userGesture (page/evaluate_guard.rs),
    so the browser's popup blocker drops it: measured, window.open returned null and no popup
    event came, while the same call through a user-gesture eval opened one. Upstream then times
    out clicking in the background popup on BrowserOS, which Neo never reaches."
  p: "locator.click: Timeout <n>ms exceeded."
  n: 'page.waitForEvent: Timeout <n>ms exceeded while waiting for event "popup"'
