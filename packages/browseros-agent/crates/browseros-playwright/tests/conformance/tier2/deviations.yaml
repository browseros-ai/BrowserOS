# Tier 2's known differences between Runner P (real Playwright 1.64.1) and Runner N (Neo), in
# the same format as ../deviations.yaml: one entry per case and JSON pointer into the normalized
# outcome, with both runners' values, a kind (decided or finding), a route for a finding, and
# a reason. A lifted case's outcome is { "L<line>": <what upstream's expect on that line
# received>, ..., "threw": <the test's own failure> }, so a pointer names the upstream line.
#
# The cases are generated (tier2/convert.mjs), so an entry is fixed by changing Neo or the
# converter, never the case, and is deleted in the commit that closes it.
- case: locator-element-handle.should-query-existing-element-smoke
  path: /returned
  kind: finding
  route: J4 prelude, R10c
  reason: Upstream passes an ElementHandle argument to page.evaluate as its element
    (page.evaluate(e => e.textContent, handle)), a pattern upstream's own tests use often. Neo's
    prelude refuses any handle in an evaluate argument (prelude/options.ts) with this hint, and
    no decision records the refusal. R10c resolves handles to main-world nodes for
    elementHandle.evaluate, the step an argument needs too.
  p:
    L27: A
  n:
    threw:
      message: "page.evaluate: Neo passes evaluate arguments as JSON, without handles; run the
        function on the element itself with locator.evaluate(fn) or elementHandle.evaluate(fn)"
      name: Error
