  path: /returned/ai/returned
  kind: decided
  reason: "D14 and sdk-privacy: the sealed world reads password, card and one-time-code values
    masked (\"••••\", \"•••• 1111\"), and the snapshot's sweep masks the code where the page
    echoes it as text (\"[private]\"). Upstream prints every value raw."
  p: |-
    - generic [active] [ref=e1]:
      - generic [ref=e2]:
        - text: User
        - textbox "User" [ref=e3]: ada
      - generic [ref=e4]:
