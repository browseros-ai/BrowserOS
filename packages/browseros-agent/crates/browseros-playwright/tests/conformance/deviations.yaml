        - text: Card number
        - textbox "Card number" [ref=e7]: "4111111111111111"
      - generic [ref=e8]:
        - text: Code
        - textbox "Code" [ref=e9]: "482913"
      - paragraph [ref=e10]: Confirm your code 482913
  n: |-
