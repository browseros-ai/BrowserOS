- case: nest-f6-unreadable-frame
  path: /returned/withinFourSeconds
  kind: decided
  reason: "decisions.md (per-frame budget, measured 2.006 s by R6) and D22 F6: Neo returns once
    the hung frame's own 2 s budget runs out. Upstream waits on the hung frame until the call's
