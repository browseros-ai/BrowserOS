- case: nest-f6-unreadable-frame
  path: /returned/withinFourSeconds
  kind: decided
  reason: "decisions.md (per-frame budget, measured 2.006 s by R6) and D22 F6: Neo returns once
    the hung frame's own 2 s budget runs out. Upstream waits on the hung frame until the call's
    whole timeout (8 s here)."
  p: false
  n: true
- case: nest-f7-navigated-frame
  path: /returned/navigated/A1/threw/message
  kind: decided
  reason: "decisions.md (build start): a new frame seq for every committed document. a1 navigated,
    so its old ref fails at once (element_detached). Upstream keeps a child frame's seq across
    navigations and waits for the old ref in the new document until the timeout."
  p: "locator.textContent: Timeout <n>ms exceeded."
  n: "locator.textContent: f1e1 is not on the page any more; take a new snapshot"
- case: nest-f7-navigated-frame
  path: /returned/navigated/A1/threw/name
  kind: decided
  reason: "decisions.md (build start): a new frame seq for every committed document. a1 navigated,
    so its old ref fails at once (element_detached). Upstream keeps a child frame's seq across
    navigations and waits for the old ref in the new document until the timeout."
  p: TimeoutError
  n: Error
- case: nest-f7-navigated-frame
  path: /returned/navigated/B2/threw/message
  kind: decided
  reason: 'decisions.md (build start): a new frame seq for every committed document, so a ref into
    a frame that navigated or detached fails at once as website / element_detached and never
    acts in another document. Upstream says "Invalid frame in aria-ref selector" for a frame
    that is gone; Neo says the ref is not on the page any more and asks for a new snapshot.'
  p: 'locator.textContent: Invalid frame in aria-ref selector "aria-ref=f2e1"'
  n: "locator.textContent: f2e1 is not on the page any more; take a new snapshot"
