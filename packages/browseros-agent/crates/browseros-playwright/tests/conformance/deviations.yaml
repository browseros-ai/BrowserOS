- case: popups
  path: /returned/kinds/window
  kind: decided
  reason: "decisions.md (reviewed P and I): window.open with window features opens a popup window
    on BrowserOS neo 0.52.1.1, even hosted, which Neo cannot drive, so waitForEvent('popup')
    fails neo / unsupported with a hint. Upstream drives the window as a page."
  p:
    returned:
      closed: true
      listed: true
      listedAfterClose: false
      opener: page
      url: http://127.0.0.1:<port>/child.html?name=Window
  n:
