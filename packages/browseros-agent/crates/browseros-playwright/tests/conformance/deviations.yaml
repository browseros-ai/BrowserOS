- case: popups
  path: /returned/kinds/window
  kind: decided
  reason: "decisions.md (reviewed P and I): window.open with window features opens a popup window
    on BrowserOS neo 0.52.1.1, even hosted, which Neo cannot drive, so waitForEvent('popup')
    fails neo / unsupported with a hint. Upstream drives the window as a page."
  p:
    returned:
      closed: true
      listed: true
      listedAfterClose: false
      opener: page
      url: http://127.0.0.1:<port>/child.html?name=Window
  n:
    threw:
      message: "page.waitForEvent: the popup (http://127.0.0.1:<port>/child.html?name=Window) opened
        as a separate window, which Neo cannot drive; Neo drives popups that open as tabs"
      name: Error
- case: snapshot-ai
  path: /returned/unknownRef/threw/message
  kind: finding
  route: R4 resolver, J2 probe
  reason: For e999, a number this document never minted, Neo says it "is not on the page any
    more", the wording for a removed element. The probe's ref counter can tell a number above it
    (never printed) from a removed element, and say it is not a ref on this page.
  p: "locator.textContent: Timeout <n>ms exceeded."
  n: "locator.textContent: e21 is not on the page any more; take a new snapshot"
- case: snapshot-ai
  path: /returned/unknownRef/threw/name
  kind: decided
  reason: "Strict refs (D3, frames_live's never-printed refs test): a ref the page never printed
    fails at once. Upstream's aria-ref engine finds nothing and waits until the timeout."
  p: TimeoutError
  n: Error
- case: snapshot-locator
  path: /returned/missingAi/threw/message
  kind: decided
  reason: 'decisions.md (R6 snapshots): locator.ariaSnapshot waits for its element in both modes,
    as every other locator op does, so a missing element is a TimeoutError. Upstream 1.64.1
    fails at once in ai mode ("does not match any element") and waits only in the default mode.'
  p: 'locator.ariaSnapshot: Selector "#never" does not match any element'
  n: "locator.ariaSnapshot: Timeout <n>ms exceeded."
- case: snapshot-locator
  path: /returned/missingAi/threw/name
  kind: decided
  reason: 'decisions.md (R6 snapshots): locator.ariaSnapshot waits for its element in both modes,
    as every other locator op does, so a missing element is a TimeoutError. Upstream 1.64.1
    fails at once in ai mode ("does not match any element") and waits only in the default mode.'
  p: Error
  n: TimeoutError
- case: snapshot-ref-lifetime
  path: /returned/afterDefaultSnapshot
  kind: decided
  reason: "decisions.md (build start): the same accumulating ref map. Upstream drops the ai refs
    when a default-mode page snapshot runs."
  p:
    threw:
      message: "locator.textContent: Timeout <n>ms exceeded."
      name: TimeoutError
  n:
    returned: Save
- case: snapshot-ref-lifetime
  path: /returned/afterLocatorSnapshot
  kind: decided
  reason: "decisions.md (build start): Neo's aria-ref engine keeps a per-document map that
    accumulates across snapshots. Upstream's built-in engine knows only the frame's latest
    snapshot, so a locator's own snapshot drops the page snapshot's refs in that frame."
  p:
    threw:
      message: "locator.textContent: Timeout <n>ms exceeded."
      name: TimeoutError
  n:
    returned: Cancel
- case: snapshot-sensitive
  path: /returned/echo/returned
  kind: decided
  reason: "D14 and sdk-privacy: every string a read returns is masked with its frame's sweep
    (Codex reads review finding 1), so a one-time code the page echoes in ordinary text reads
    \"[private]\" through textContent. Upstream returns the page's text raw."
  p: Confirm your code 482913
  n: Confirm your code [private]

