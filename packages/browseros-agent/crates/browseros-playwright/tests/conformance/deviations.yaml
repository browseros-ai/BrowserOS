- case: wait-for-load-state
  path: /returned/badState/threw/message
  kind: finding
  route: J4 prelude
  reason: "Upstream's client checks the state before its API wrapper, so the message has no
    \"page.waitForLoadState: \" prefix. Neo's prelude adds it. Cosmetic."
  p: "state: expected one of (load|domcontentloaded|networkidle|commit)"
  n: "page.waitForLoadState: state: expected one of (load|domcontentloaded|networkidle|commit)"
- case: nest-f6-unreadable-frame
  path: /returned/frameD
  kind: decided
  reason: "decisions.md (per-frame budget) and D22 F6: a frame that misses its 2 s budget is a
    partial entry, printed as a \"# partial: <url> not read (<reason>)\" line under its iframe.
    Upstream prints the hung frame's iframe empty and says nothing."
  p: "  - iframe [ref=e1]"
  n: >2-
      - iframe [ref=e1]
        # partial: http://hang.localtest.me:<port>/nest/hang.html?hang not read (timeout after <n>ms)
