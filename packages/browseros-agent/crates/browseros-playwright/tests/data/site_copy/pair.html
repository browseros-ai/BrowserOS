<!doctype html><html><head><meta charset="utf-8"><title>Pair</title></head>
<body><h1>Pair</h1>
<script>
// Two frames of one other site (localhost; this page is on 127.0.0.1): a visible sibling and a
// hidden password field, which no snapshot prints and so no snapshot hop reaches. The sibling's
// own script reaches the field through parent.frames and copies its value into its heading.
for (const [title, file, hidden] of [['sibling', 'sibling', false], ['field', 'field', true]]) {
  const frame = document.createElement('iframe');
  frame.title = title;
  frame.hidden = hidden;
  frame.src = `http://localhost:${location.port}/site_copy/${file}.html`;
  document.body.append(frame);
}
window.copied = false;
addEventListener('message', ({ data }) => { if (data === 'copied') window.copied = true; });
// Asks the sibling to type `secret` into the hidden field and copy it; this page never holds it.
window.copyField = (secret) => frames[0].postMessage({ secret }, '*');
</script></body></html>
