<!doctype html><html><head><meta charset="utf-8"><title>Top</title></head>
<body><h1 class="who">Top</h1><p class="who">nobody</p><input id="echo" aria-label="Echo"><div id="host"></div>
<script>
// The page holds no sensitive field of its own. A frame of its site does, embedded one of three
// ways (the query string):
//   inproc  a same-origin child: this page's process and CDP session
//   oopif   under a cross-site bridge on localhost, so on a session of its own
//   shadow  the same, with the bridge's iframe inside a closed shadow root, which the page's
//           window.length leaves out
const mode = location.search.slice(1);
const frame = document.createElement('iframe');
frame.title = 'outer';
frame.src = mode === 'inproc'
  ? '/site_copy/field.html'
  : `http://localhost:${location.port}/site_copy/bridge.html`;
(mode === 'shadow' ? document.getElementById('host').attachShadow({ mode: 'closed' }) : document.body)
  .append(frame);
// The same-site field, as this page's own script reaches it through frames.
window.field = () =>
  (mode === 'inproc' ? frame.contentWindow : frame.contentWindow.frames[0]).document.querySelector('input');
// What a careless page does: copies the typed value into its own document.
window.copyField = () => {
  const value = field().value;
  const [heading, line] = document.querySelectorAll('.who');
  heading.textContent = 'Signed in with ' + value;
  heading.dataset.who = value;
  line.textContent = value;
  document.getElementById('echo').value = value;
  document.title = value;
  return value.length;
};
</script></body></html>
