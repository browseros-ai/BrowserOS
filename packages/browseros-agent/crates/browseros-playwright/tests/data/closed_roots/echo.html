<!doctype html><html><head><meta charset="utf-8"><title>Closed root echo</title></head>
<body><div id="host"></div><div id="late"></div><div id="deep"></div>
<p class="echo" id="echo" data-echo="">Typed </p>
<script>
// sdk-privacy's leak test, scenario `echoes`: the page's password field sits in a closed shadow
// root, which only this script can reach, and the page copies what the field holds into the top
// document's text and an attribute, as a careless page does.
const echo = (field) => () => {
  const line = document.getElementById('echo');
  line.textContent = 'Typed ' + field.value;
  line.dataset.echo = field.value;
};
const closedField = (host) => {
  const root = host.attachShadow({ mode: 'closed' });
  root.innerHTML = '<label>Password <input type="password"></label>';
  const field = root.querySelector('input');
  field.addEventListener('input', echo(field));
  return field;
};
// What autofill does: set the value, then fire input and change. A page's own events are not
// composed, so neither leaves the closed root.
const plant = (field, value) => {
  field.value = value;
  field.dispatchEvent(new Event('input', { bubbles: true }));
  field.dispatchEvent(new Event('change', { bubbles: true }));
  return true;
};
// This root exists at load, before Neo first touches the page.
const field = closedField(document.getElementById('host'));
// Hosts the page took out of the document. Kept, as a page keeps a component it may show
// again, so a test's reads do not depend on when the browser collects a removed root.
const removed = [];
// `?rows=N` makes the page about N elements bigger, for the cost test.
const rows = Number(new URLSearchParams(location.search).get('rows') || 0);
for (let row = 0; row < rows / 3; row++) {
  const line = document.createElement('div');
  line.className = 'row';
  line.append(Object.assign(document.createElement('span'), { textContent: 'row ' + row }));
  line.append(document.createElement('a'));
  document.body.append(line);
}
window.fixture = {
  // Focuses the field for typing over CDP, as a user would type into it.
  focus: () => {
    field.focus();
    return field.getRootNode().activeElement === field;
  },
  plant: (value) => plant(field, value),
  // A closed root attached to a div that has been in the document since load: no mutation
  // record shows it, and the browser's DOM events report it only for a node already sent.
  late: (value) => plant(closedField(document.getElementById('late')), value),
  // A closed root under 70 levels of elements: deeper than one scan describes, and deeper than
  // the 128 levels of JSON a single pierced describe of the document could be parsed in.
  deep: (value) => {
    let at = document.getElementById('deep');
    for (let level = 0; level < 70; level++) {
      const next = document.createElement('div');
      at.append(next);
      at = next;
    }
    return plant(closedField(at), value);
  },
  // A closed root attached now, focused for typing over CDP, whose host leaves the document
  // once typed into: inside the field's own input listener for `delay` -1, else `delay` ms
  // later. No scan before a sweep can find it then.
  typedThenRemoved: (delay) => {
    const host = document.createElement('div');
    document.body.append(host);
    const typed = closedField(host);
    const remove = () => {
      host.remove();
      removed.push(host);
    };
    typed.addEventListener('input', () => (delay < 0 ? remove() : setTimeout(remove, delay)), {
      once: true,
    });
    typed.focus();
    return typed.getRootNode().activeElement === typed;
  },
  removedAll: () => removed.length > 0 && removed.every((host) => !host.isConnected),
  // A component's closed root that the page removes and forgets, watched only through a weak
  // reference here, so a test can see whether anything else keeps it alive.
  attachDropped: (value) => {
    const host = document.createElement('div');
    host.id = 'dropped';
    document.body.append(host);
    const dropped = closedField(host);
    window.droppedRoot = new WeakRef(dropped.getRootNode());
    return plant(dropped, value);
  },
  forgetDropped: () => {
    document.getElementById('dropped').remove();
    return true;
  },
  droppedAlive: () => window.droppedRoot.deref() !== undefined,
  // A component the page removes, keeps, and shows again later.
  attachKept: () => {
    kept = document.createElement('div');
    document.body.append(kept);
    keptField = closedField(kept);
    return true;
  },
  detachKept: () => {
    kept.remove();
    return true;
  },
  reattachKept: (value) => {
    document.body.append(kept);
    return plant(keptField, value);
  },
};
let kept = null;
let keptField = null;
</script></body></html>
