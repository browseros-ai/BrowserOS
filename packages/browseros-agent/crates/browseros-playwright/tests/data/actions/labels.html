<!doctype html><html><head><meta charset="utf-8"><title>Labels</title>
<style>body { margin: 0; font: 14px sans-serif } label, input, select { display: block; margin: 6px }</style></head>
<body>
<label id="login-label" for="login">Password</label>
<input id="login" type="password">
<label id="pin-label"><span id="pin-text">Account PIN</span> <input id="pin" type="password"></label>
<label id="codes-label" for="codes">Backup codes</label>
<select id="codes" multiple autocomplete="one-time-code">
  <option value="code-118204">First</option><option value="code-907316">Second</option>
</select>
</body></html>
