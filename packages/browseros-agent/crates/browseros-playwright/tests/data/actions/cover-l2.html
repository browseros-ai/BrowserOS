<!doctype html><html><head><meta charset="utf-8"><title>Covered L2</title></head>
<body style="margin:0">
<button id="inner" style="margin:40px">L2 button</button>
<script>
  window.__log = [];
  for (const type of ['mousedown', 'click'])
    document.addEventListener(type, (e) => window.__log.push(`${type} ${e.target.id}`), true);
</script>
</body></html>
