# Rust -> page calls: what neo-runtime sends to the glue table in neo-runtime-injected, and
# exactly what comes back. Written in Playwright's protocol dialect and loaded into the same
# flat namespace as spec/playwright/, so these names must not collide with Playwright's.
#
# Rules the translator enforces for this file (codegen/contract.rs):
# - Exactly one interface, `Injected`. Its `initializer` is the options of the page bundle's
#   bootstrap, and each command is one glue function `(injected, params, ...handles) => result`.
# - Every command is `internal: true`, because Playwright's generator requires a title on any
#   other command and a page call carries no metainfo. A command declares only `parameters`
#   and `returns`.
# - Every definition is reachable from `Injected`. No `binary` and no Playwright object
#   references: a page call crosses plain JSON plus handles (below).
# - A glue function returns every outcome neo-runtime acts on (nothing matched yet) as a value,
#   and throws for failures that end the Playwright call (a strict mode violation, an invalid
#   selector, an element of the wrong kind), as Playwright's page code does. A command without
#   `returns` resolves to `{}`, and its glue function returns `{}`.
#
# The comment directly above a key becomes the Rust and TypeScript docs of what it generates.
# Write it as one paragraph with no blank line before the key, and quote identifiers in
# backticks (clippy's `doc_markdown` checks the generated Rust).
#
# Two extensions to Playwright's dialect, accepted only in this file (codegen/dialect.rs):
# 1. `type: union` with `members`: a value that is exactly one of its members, told apart by
#    JSON kind (string, boolean or object), so the members' kinds must differ. The wire carries
#    the member's own JSON with no tag. Rust decodes it in one pass by kind; TypeScript writes
#    `A | B`.
# 2. Handles. A handle is a page object that stays in the page while Rust holds its CDP
#    `Runtime.RemoteObjectId`. `Element` is the built-in handle type (a DOM element, CDP subtype
#    `node`); a definition with `type: handle` names another page object, a plain JavaScript
#    object (no CDP subtype).
#    - A handle-typed parameter, at the top level of `parameters` only and never optional, does
#      not travel in the JSON params. It crosses as a `Runtime.callFunctionOn` argument
#      `{objectId}` after the call name and the params, in declaration order. Rust types it
#      `Handle<K>`; TypeScript passes it to the glue function positionally after `params`.
#    - A result that holds a handle (a top-level property typed with a handle, or with a union
#      that has one handle member) is called with `returnByValue: false` into the caller's object
#      group and read back with one `Runtime.getProperties`. Each of its other top-level
#      properties must be a primitive (string, int, float, boolean, string enum), each
#      optionally `?`: getProperties would hand back an object or an array as a page object too.
#      A result that holds no handle still crosses by value.
#    The translator lists every `type: handle` name in `InjectedHandleKinds` (TypeScript), which
#    the glue binds to Playwright's own page types at its one `satisfies` site.

Injected:
  type: interface

  # The options neo-runtime passes to the page bundle's bootstrap, which creates the glue object
  # in one world of one document. The bootstrap adds Neo's constants (`sdkLanguage`,
  # `browserName`, no custom engines) and calls `new InjectedScript(window, options)`.
  initializer:
    # Sequence number of the frame's current document. `ai` snapshots prefix refs with
    # `f<frameSeq>` when it is not zero, which is how an `aria-ref` names its frame.
    frameSeq: int
    # The attribute `getByTestId` matches: `data-testid` unless the script changes it.
    testIdAttributeName: string
    # Animation frames an element's box must hold still to count as stable.
    stableRafCount: int
    # Whether this is the utility world, where Neo resolves selectors.
    isUtilityWorld: boolean

  commands:

    # Reads `document.title`, for `Frame.title`. Needs no `InjectedScript`.
    title:
      internal: true
      returns:
        value: string

    # (G) The tools the document registered with `WebMCP`, as Playwright's `WebMCPScript.tools`
    # describes them in its utility world, for `Frame.webmcpTools`. Needs no `InjectedScript`.
    webmcpTools:
      internal: true
      returns:
        tools:
          type: array
          items: WebMCPToolDescription

    # (G) Calls the `WebMCP` tool `name` with `input`, as Playwright's `WebMCPScript.callTool` does
    # in its utility world, for `Frame.webmcpCallTool`. `input` and `result` are Playwright's
    # `SerializedValue`s, which the page parses and writes with Playwright's own serializers.
    webmcpCallTool:
      internal: true
      parameters:
        name: string
        input: json
      returns:
        result: json

    # Probes the first match for `Frame.waitForSelector`, without marking elements or waiting.
    # Rust owns the retry loop and deadline.
    selectorState:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        # Absent when nothing matches; hidden and detached waits succeed in that case.
        matched: SelectorMatch?

    # `selectorState` for a `Frame.waitForSelector` whose caller wants the element back, such as
    # `locator.evaluate`: the same probe, plus the first match in the caller's object group, which
    # neo-runtime adopts into the frame's main world once the wait is met.
    selectorElement:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        # The first match. Absent when nothing matches.
        element: Element?
        count: int
        visible: boolean
        # `InjectedScript.previewNode` of the first match, absent when nothing matches.
        preview: string?

    # `selectorElement` within `root` (`ElementHandle.$`, `$eval`): Playwright's scoped
    # `querySelectorAll(parsed, root)`, for an element handle adopted into this world.
    scopedSelectorElement:
      internal: true
      parameters:
        selector: string
        strict: boolean
        root: Element
      returns:
        element: Element?
        count: int
        visible: boolean
        preview: string?

    # Every match of one frame chunk, in document order, for `Frame.querySelectorAll` and
    # `evalOnSelectorAll` (Playwright's `queryAll` and `queryArrayInMainWorld`): one object whose
    # own properties `0`, `1`, … are the elements, which neo-runtime reads with
    # `Runtime.getProperties` and adopts into the main world.
    queryAll:
      internal: true
      parameters:
        selector: string
      returns:
        elements: ElementList

    # `queryAll` within `root`, for `ElementHandle.$$` and `$$eval`.
    scopedQueryAll:
      internal: true
      parameters:
        selector: string
        root: Element
      returns:
        elements: ElementList

    # `InjectedScript.previewNode` of each element of a `queryAll` list, in order: the previews of
    # the `ElementHandle`s `Frame.querySelectorAll` answers, read in one page call.
    listPreviews:
      internal: true
      parameters:
        list: ElementList
      returns:
        previews:
          type: array
          items: string

    # The document node of this world's frame, for neo-runtime's main-world door
    # (`main_world.rs`), which reads its `backendNodeId` with `DOM.describeNode` and resolves the
    # same node in the frame's main world. A `Document`, carried as the built-in `Element` handle
    # because CDP gives every DOM node the subtype `node`.
    document:
      internal: true
      returns:
        node: Element

    # `InjectedScript.previewNode` of a node adopted into this world, for an `ElementHandle`'s
    # preview (`dom.ts` `ElementHandle._initializePreview`).
    previewNode:
      internal: true
      parameters:
        node: Element
      returns:
        preview: string

    # Resolves one frame chunk and reads the first match's `textContent`, for
    # `Frame.textContent`. neo-runtime owns waiting: it polls this call with Playwright's backoff
    # until something matches or the call's deadline passes.
    textContent:
      internal: true
      parameters:
        # One frame chunk of the selector, with no `internal:control=enter-frame` parts. The
        # page parses it with `InjectedScript.parseSelector`.
        selector: string
        # Throw a strict mode violation when more than one element matches.
        strict: boolean
      returns:
        # Absent while nothing matches; neo-runtime keeps polling until the deadline.
        matched: TextMatch?

    # `frames.ts` `innerText`: resolve and mark the first match, refuse an element outside the
    # XHTML namespace, read its `innerText`.
    innerText:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        matched: TextMatch?

    # `frames.ts` `getAttribute`: resolve and mark the first match, read one attribute.
    getAttribute:
      internal: true
      parameters:
        selector: string
        strict: boolean
        name: string
      returns:
        matched: AttributeMatch?

    # Resolves one frame chunk without marking matches and reads visibility, for
    # `Frame.isVisible`. No match is `false`; neo-runtime never polls this call.
    isVisible:
      internal: true
      parameters:
        selector: string
        strict: boolean
        frameVisible: boolean
      returns:
        value: boolean

    # `frames.ts` `_elementState`: resolves and marks the first match, then reads one state with
    # `InjectedScript.elementState`, following labels, for `Frame.isChecked`, `Frame.isEnabled`,
    # `Frame.isDisabled` and `Frame.isEditable`. Throws, as Playwright's page code does, for a
    # state the element cannot have: `checked` on anything but a checkbox or radio control,
    # `editable` on an element that is not a text control and has no role allowing
    # `aria-readonly`.
    elementStateOnSelector:
      internal: true
      parameters:
        selector: string
        strict: boolean
        state: ReadableElementState
      returns:
        # Absent while nothing matches; neo-runtime keeps polling until the deadline.
        matched: ElementStateMatch?

    # `frames.ts` `innerHTML`: resolve and mark the first match, read its `innerHTML`.
    innerHTML:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        matched: TextMatch?

    # Resolves one frame chunk and snapshots its first match with
    # `InjectedScript.ariaSnapshotJSON`, for `Frame.ariaSnapshot`, which also records the tree
    # for `aria-ref` lookups in this world. neo-runtime stitches each iframe's document into its
    # `iframe` node and renders the YAML.
    ariaSnapshot:
      internal: true
      parameters:
        # One frame chunk; neo-runtime sends `body,frameset` when the caller gave no selector.
        selector: string
        # Playwright snapshots non-strictly without a selector and for iframe documents.
        strict: boolean
        mode: AriaSnapshotMode
        # Remaining depth for this frame; neo-runtime subtracts an iframe's depth for its
        # document.
        depth: int?
        # Include each node's client rect.
        boxes: boolean?
      returns:
        # Absent while nothing matches. With the caller's selector that ends the call; for
        # `body,frameset` neo-runtime keeps polling.
        snapshot: AriaFrameSnapshot?
        # The matched root, for the default locator snapshot's resolution log.
        preview: string?

    # Resolves one frame chunk that must match `<iframe>` or `<frame>` elements, for a selector
    # that enters a frame. Returns the first match; neo-runtime maps it to a frame with CDP
    # `DOM.describeNode` and resolves the next chunk there.
    frameOwner:
      internal: true
      parameters:
        # One frame chunk that must resolve to `<iframe>` or `<frame>` elements.
        selector: string
        # Throw a strict mode violation when more than one element matches.
        strict: boolean
      returns:
        # The first match, which stays in the page in the caller's object group. Absent when
        # nothing matched yet.
        element: Element?
        # Visibility of the first iframe owner, false when nothing matched.
        visible: boolean

    # Finds the `<iframe>` or `<frame>` whose aria ref is `ref`, for one hop of a main-rooted
    # path ref (`aria-ref=f7e2` enters the frame of the owner named `e7`). The ref is the one
    # Playwright's snapshots keep on the element (`_ariaRef`), so the hop does not depend on the
    # document's last snapshot: a later snapshot of another part of that document leaves the
    # path routable, as a Playwright frame-numbered ref stays. An owner `frameOwnerRef` named is
    # found even where no selector reaches (inside a closed shadow root).
    frameOwnerByRef:
      internal: true
      parameters:
        ref: string
      returns:
        # The owner, in the caller's object group. Absent when no owner has that ref.
        element: Element?
        # Visibility of the owner, false when none matched.
        visible: boolean

    # The aria ref of one iframe owner, for the path in front of a child frame's AI snapshot
    # refs: the ref its document's snapshots give it (kept on the element, or given now by
    # building the aria tree of the owner alone). The document's last snapshot is left as it
    # was, so no ref of the caller's own snapshots changes lifetime.
    frameOwnerRef:
      internal: true
      parameters:
        element: Element
      returns:
        # Absent when Playwright's AI snapshots give the owner no ref: it is not visible or
        # receives no pointer events.
        ref: string?

    # `frames.ts` `Frame._content`: the document's markup, its doctype first.
    documentContent:
      internal: true
      parameters:
        # Serialize open shadow roots too (`<template shadowrootmode>`).
        includeShadow: boolean
      returns:
        value: string

    # `frames.ts` `Frame.setContent`'s page function: `document.open()`, `write`, `close()`.
    # neo-runtime waits for the lifecycle events of the reopened document on the frame's session.
    writeContent:
      internal: true
      parameters:
        html: string

    # `frames.ts` `Frame.resolveSelector`: the first match of one frame chunk (not strict), and
    # `InjectedScript.generateSelectorSimple` for it.
    generateSelector:
      internal: true
      parameters:
        selector: string
      returns:
        # Absent when nothing matches; empty when no selector could be generated.
        generated: string?

    # `generateSelectorSimple` for one iframe owner, the frame hop in front of the element's.
    generateOwnerSelector:
      internal: true
      parameters:
        element: Element
      returns:
        generated: string

    # Names a selector the way Playwright's call log does, for a click's first log line
    # `waiting for <locator>`, and reports a selector the page cannot parse. Playwright computes
    # both in Node (`asLocator`, `Selectors.parseSelector`); Neo asks the injected script's own
    # copies, `InjectedScript.utils.asLocator` and `InjectedScript.parseSelector`.
    describeSelector:
      internal: true
      parameters:
        # The whole selector string the client sent.
        selector: string
      returns:
        # `asLocator('javascript', selector)`, which falls back to the raw selector when it does
        # not parse.
        locator: string
        # The parse error's message, with no `Error: ` prefix and no stack. Absent when the
        # selector parses.
        invalidSelector: string?

    # One resolution of Playwright's click (`frames.ts` `_retryWithProgressIfNotConnected`):
    # parses and queries the selector in the document, marks every match with
    # `markTargetElements`, rejects deprecated selectors, and throws Playwright's strict mode
    # violation when `strict` and more than one element matched. neo-runtime owns retrying.
    resolve:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        # The first match, which stays in the page in the caller's object group. Absent when
        # nothing matched; neo-runtime then polls again with Playwright's backoff.
        element: Element?
        # How many elements matched, for `locator resolved to N elements. Proceeding with the
        # first one: …` on a non-strict click.
        count: int
        # `InjectedScript.previewNode` of the first match, for `locator resolved to …`.
        preview: string?

    # `InjectedScript.checkElementStates`. It awaits about two animation frames for `stable`,
    # the one short in-page wait a click allows; neo-runtime keeps the deadline.
    checkElementStates:
      internal: true
      parameters:
        element: Element
        states:
          type: array
          items: ElementState
        # True when every iframe owner crossed by the selector is visible; true without hops.
        frameVisible: boolean
      returns:
        # Absent when every state holds.
        outcome: ElementStatesOutcome?

    # `element.scrollIntoView({block, inline, behavior: 'instant'})` on an element node, the
    # page-side scroll of Playwright's loop-B retries 1 to 3 (`dom.ts` `doScrollIntoView`),
    # exactly as Playwright runs it: no connectedness check, which the next geometry read
    # catches. Retry 0 scrolls with CDP `DOM.scrollIntoViewIfNeeded` instead.
    scrollIntoView:
      internal: true
      parameters:
        element: Element
        block: ScrollAlignment
        inline: ScrollAlignment

    # The main frame's `innerWidth` and `innerHeight`, which clip the content quads to the
    # viewport (`dom.ts` `_clickablePoint`).
    viewportSize:
      internal: true
      returns:
        width: int
        height: int

    # `InjectedScript.getElementBorderWidth`, for a click at `position` (`dom.ts` `_offsetPoint`).
    getElementBorderWidth:
      internal: true
      parameters:
        element: Element
      returns:
        left: float
        top: float

    # Playwright's iframe transform check and border/padding insets (`dom.ts`
    # `_checkFrameIsHitTarget`). Transformed ancestors use only the event interceptor.
    describeIFrameStyle:
      internal: true
      parameters:
        element: Element
      returns:
        style: FrameStyle

    # Checks the iframe owner in its parent document before arming in the child.
    expectHitTarget:
      internal: true
      parameters:
        element: Element
        point: Point
      returns:
        outcome: HitTargetOutcome

    # `InjectedScript.setupHitTargetInterceptor(element, action, hitPoint, blockAllEvents)`.
    # It retargets to the closest button or link, checks the hit point once, and arms the
    # injected script's single hit-target slot for the coming input of `action`.
    setupHitTargetInterceptor:
      internal: true
      parameters:
        element: Element
        # Which events the interceptor judges: Playwright's `actionType` (`dom.ts`).
        action: HitTargetAction
        # The click point; absent skips the preliminary hit check.
        hitPoint: Point?
        # Playwright's `trial`: block every intercepted event, hit or not.
        blockAllEvents: boolean
      returns:
        outcome: HitTargetSetup

    # Calls the armed interceptor's `stop()`, which disarms the slot and reports what the first
    # trusted mouse event hit (`done` when it hit the element or no event arrived).
    stopHitTargetInterceptor:
      internal: true
      parameters:
        interceptor: HitTargetInterceptor
      returns:
        outcome: HitTargetOutcome

    # `crDragDrop.ts` `DragManager.interceptDragCausedByMove`'s `setupDragListeners`, run in every
    # frame's utility world before a move that may start a drag: the next `mousemove` arms a
    # once-only `dragstart` listener, which `cleanupDrag` reads.
    setupDragListeners:
      internal: true
      returns:
        armed: boolean

    # `window.__cleanupDrag`: removes the listeners and answers whether the move started a drag
    # the page did not prevent; `false` where nothing was armed.
    cleanupDrag:
      internal: true
      returns:
        started: boolean

    # One page evaluation of `dom.ts` `_fill`, including its state checks unless forced.
    fill:
      internal: true
      parameters:
        element: Element
        value: string
        force: boolean
        frameVisible: boolean
      returns:
        outcome: FormFillOutcome

    # One page evaluation of `dom.ts` `_selectOption`; arrays cross by value, without handles.
    selectOptions:
      internal: true
      parameters:
        element: Element
        options:
          type: array
          items: FormSelectOption
        force: boolean
        frameVisible: boolean
      returns:
        # Present on success, including an empty selection.
        values:
          type: array?
          items: string
        # Present when no selection was made.
        outcome: FormSelectOutcome?

    # `selectOptions` with `ElementHandle` values: `dom.ts` `_selectOption` passes
    # `[...elements, ...values]`, and `InjectedScript.selectOptions` matches an element value by
    # node identity. `elements` are the handles' nodes adopted into this world, in order
    # (`elementListOf`, `elementListWith`).
    selectOptionsWithElements:
      internal: true
      parameters:
        element: Element
        elements: ElementList
        options:
          type: array
          items: FormSelectOption
        force: boolean
        frameVisible: boolean
      returns:
        values:
          type: array?
          items: string
        outcome: FormSelectOutcome?

    # A list of one element (`selectOptionsWithElements`'s `elements`): a handle argument is
    # passed by position, so a list of handles is built one page call per element.
    elementListOf:
      internal: true
      parameters:
        element: Element
      returns:
        list: ElementList

    # `list` with `element` after its elements, as a new list.
    elementListWith:
      internal: true
      parameters:
        list: ElementList
        element: Element
      returns:
        list: ElementList

    # Playwright's `ElementStateQueryResult` for a checkbox or radio button.
    elementState:
      internal: true
      parameters:
        element: Element
        state:
          type: enum
          literals:
          - checked
          - unchecked
      returns:
        matches: boolean
        received: string?
        isRadio: boolean?

    # `InjectedScript.focusNode`, before a key press.
    focusElement:
      internal: true
      parameters:
        element: Element
        resetSelectionIfNotFocused: boolean
      returns:
        outcome: FormFocusOutcome

    # `InjectedScript.blurNode`, for `Frame.blur`.
    blurElement:
      internal: true
      parameters:
        element: Element
      returns:
        outcome: FormFocusOutcome

    # `dom.ts` `selectText`'s page evaluation: unless `force`, `checkElementStates(['visible'])`,
    # then `InjectedScript.selectText`, which selects an input's or textarea's value, or the
    # element's contents, and focuses it.
    selectText:
      internal: true
      parameters:
        element: Element
        force: boolean
        frameVisible: boolean
      returns:
        outcome: SelectTextOutcome

    # `frames.ts` `dispatchEvent`: resolves and marks the first match, then
    # `InjectedScript.dispatchEvent(element, type, eventInit)`, in Neo's isolated world.
    dispatchEvent:
      internal: true
      parameters:
        selector: string
        strict: boolean
        type: string
        # The event's init dictionary as JSON text: plain values, which neo-runtime decodes from
        # the call's serialized argument.
        eventInit: string
      returns:
        # `InjectedScript.previewNode` of the element the event went to; absent while nothing
        # matches.
        preview: string?

    # `InjectedScript.setHighlights` for this document: each highlight is a frame chunk the page
    # parses, and its CSS. An empty list clears them; the overlay follows its elements on every
    # animation frame.
    setHighlights:
      internal: true
      parameters:
        highlights:
          type: array
          items: HighlightSpec

    # `InjectedScript.hideHighlight`: removes this document's overlay.
    hideHighlight:
      internal: true

    # `frames.ts` `inputValue`: resolve and mark the first match, then follow its label.
    inputValue:
      internal: true
      parameters:
        selector: string
        strict: boolean
      returns:
        matched: FormInputValueMatch?

    # `frameSelectors.ts` `queryCount`: count every match, without strictness or target marks.
    queryCount:
      internal: true
      parameters:
        selector: string
      returns:
        value: int

# `_fill` returns a string or the first missing state, without mutating when not ready.
FormFillOutcome:
  type: union
  members:
    status:
      type: enum
      literals:
      - needsinput
      - done
      - error:notconnected
    missing: MissingState

# `selectText`'s answer: done or detached, or the visibility it is missing.
SelectTextOutcome:
  type: union
  members:
    status:
      type: enum
      literals:
      - done
      - error:notconnected
    missing: MissingState

# One highlight of a document: a selector chunk of that document and the overlay's CSS.
HighlightSpec:
  type: object
  properties:
    selector: string
    cssStyle: string?

# The option selector fields of Playwright's `selectOptions` page helper.
FormSelectOption:
  type: object
  properties:
    valueOrLabel: string?
    value: string?
    label: string?
    index: int?

# Why `_selectOption` could not select yet. Success is the separate `values` array because
# this dialect discriminates unions by JSON kind and does not support array members.
FormSelectOutcome:
  type: union
  members:
    error:
      type: enum
      literals:
      - error:notconnected
      - error:optionsnotfound
      - error:optionnotenabled
    missing: MissingState

# The result of Playwright's `focusNode` helper.
FormFocusOutcome:
  type: enum
  literals:
  - done
  - error:notconnected

# The input's value and the original matched node's preview for the call log.
FormInputValueMatch:
  type: object
  properties:
    value: string
    preview: string

# The `{stop}` object `setupHitTargetInterceptor` arms: Playwright's
# `HitTargetInterceptionResult`, bound in the glue's `satisfies` clause.
HitTargetInterceptor:
  type: handle

# A null-prototype object holding a query's elements as its own properties `0`, `1`, …
ElementList:
  type: handle

# Unchanged `InjectedScript.describeIFrameStyle` result.
FrameStyle:
  type: union
  members:
    status: FrameStyleStatus
    insets: FrameInsets

FrameStyleStatus:
  type: enum
  literals:
  - error:notconnected
  - transformed

# The iframe content origin relative to its border box.
FrameInsets:
  type: object
  properties:
    left: float
    top: float

# Playwright's `ElementState` (`injectedScript.ts`), every value, so the glue's `missingState`
# result type-checks against Playwright's own union.
ElementState:
  type: enum
  literals:
  - visible
  - hidden
  - enabled
  - disabled
  - editable
  - checked
  - unchecked
  - indeterminate
  - stable
  - non-inert

# The element was detached from its document, or its document was replaced.
NotConnected:
  type: enum
  literals:
  - error:notconnected

# What `checkElementStates` reports when the element is not ready.
ElementStatesOutcome:
  type: union
  members:
    notConnected: NotConnected
    missing: MissingState

# The first state that does not hold, in Playwright's order, with `stable` first.
MissingState:
  type: object
  properties:
    missingState: ElementState

# The `block` and `inline` of `scrollIntoView`; Playwright cycles through `end`, `center` and
# `start`.
ScrollAlignment:
  type: enum
  literals:
  - start
  - center
  - end
  - nearest

# The input a hit-target interceptor judges, as `InjectedScript.setupHitTargetInterceptor` takes
# it: `hover` judges `mousemove`, `tap` the pointer and touch events, `mouse` the presses and
# clicks, and `drag` arms nothing.
HitTargetAction:
  type: enum
  literals:
  - hover
  - tap
  - mouse
  - drag

# Not armed, or armed. Not armed is a string: `error:notconnected`, or the `previewNode` of the
# element covering the point (`<div id="overlay"></div>`), exactly as Playwright's
# `setupHitTargetInterceptor` returns it; Playwright's `dom.ts` compares the same literal.
HitTargetSetup:
  type: union
  members:
    description: string
    armed: HitTargetInterceptor

# What `stop()` reports.
HitTargetOutcome:
  type: union
  members:
    done: HitTargetDone
    blocked: HitTargetBlocked

# The first trusted mouse event hit the element, or no event arrived.
HitTargetDone:
  type: enum
  literals:
  - done

# The first trusted mouse event hit another element. The interceptor blocked it and every later
# event of the action.
HitTargetBlocked:
  type: object
  properties:
    hitTargetDescription: string

# The first selector match's visibility and preview, with the total match count for the log.
SelectorMatch:
  type: object
  properties:
    count: int
    visible: boolean
    preview: string

# The states `frames.ts` `_elementState` reads, one per `Frame.is*` command that waits for a
# match.
ReadableElementState:
  type: enum
  literals:
  - checked
  - enabled
  - disabled
  - editable

# The first match's `ElementStateQueryResult` for one state, and its preview.
ElementStateMatch:
  type: object
  properties:
    # Whether the element is in the state asked for.
    matches: boolean
    # `error:notconnected` ends the call as Playwright's `throwElementIsNotAttached` does.
    received: string?
    preview: string

# The first matching element's text.
TextMatch:
  type: object
  properties:
    # `textContent` or `innerText` of the element, never `null` for an element.
    value: string
    # `InjectedScript.previewNode` of the element, for the call log line
    # `locator resolved to …`.
    preview: string

# The first matching element's attribute and preview.
AttributeMatch:
  type: object
  properties:
    # `element.getAttribute(name)`: absent when the element has no such attribute, '' when empty.
    value: string?
    preview: string

# The snapshot flavor: `ai` adds refs that `aria-ref=` selectors resolve.
AriaSnapshotMode:
  type: enum
  literals:
  - ai
  - default

# One document's tree, before neo-runtime stitches in its iframes.
AriaFrameSnapshot:
  type: object
  properties:
    # Playwright's `AriaSnapshotJSON`, unchanged.
    nodes:
      type: array
      items: AriaNode
    # The rendered `iframe` nodes in document order, with their depth in this tree. The glue
    # joins Playwright's `iframeRefs` list and `iframeDepths` record into this list.
    iframes:
      type: array
      items: AriaIframe

# An `iframe` node of a snapshot.
AriaIframe:
  type: object
  properties:
    # The node's `ref`, which an `aria-ref=` selector names.
    ref: string
    # The node's depth in its document's tree.
    depth: int

# Playwright's `AriaNodeJSON` (`packages/isomorphic/ariaSnapshot.ts`), field for field. Its
# literal `true` flags widen to `boolean`, which the glue's `satisfies` check accepts.
AriaNode:
  type: object
  properties:
    role: AriaRole
    name: string?
    checked: AriaTristate?
    disabled: boolean?
    expanded: boolean?
    active: boolean?
    invalid: AriaInvalid?
    level: int?
    pressed: AriaTristate?
    selected: boolean?
    ariaHidden: boolean?
    ref: string?
    cursor:
      type: enum?
      literals:
      - pointer
    box: AriaBox?
    url: string?
    placeholder: string?
    text: string?
    children:
      type: array?
      items: AriaChild

# The element's client rect, which Playwright rounds to whole pixels. Decoding these as integers
# relies on CDP writing an integral double as a JSON integer, `-0` included: serde rejects a
# literal `-0` for an integer.
AriaBox:
  type: object
  properties:
    x: int
    y: int
    width: int
    height: int

# A child of an aria node: another node, or a run of text.
AriaChild:
  type: union
  members:
    node: AriaNode
    text: string

# A checked or pressed state. Playwright sends only `true` or `'mixed'`.
AriaTristate:
  type: union
  members:
    flag: boolean
    mixed:
      type: enum
      literals:
      - mixed

# An invalid state. Playwright sends only `true`, `'grammar'` or `'spelling'`.
AriaInvalid:
  type: union
  members:
    flag: boolean
    kind:
      type: enum
      literals:
      - grammar
      - spelling

# Playwright's `AriaRole`, plus `iframe` and `text`.
AriaRole:
  type: enum
  literals:
  - alert
  - alertdialog
  - application
  - article
  - banner
  - blockquote
  - button
  - caption
  - cell
  - checkbox
  - code
  - columnheader
  - combobox
  - complementary
  - contentinfo
  - definition
  - deletion
  - dialog
  - directory
  - document
  - emphasis
  - feed
  - figure
  - form
  - generic
  - grid
  - gridcell
  - group
  - heading
  - img
  - insertion
  - link
  - list
  - listbox
  - listitem
  - log
  - main
  - mark
  - marquee
  - math
  - meter
  - menu
  - menubar
  - menuitem
  - menuitemcheckbox
  - menuitemradio
  - navigation
  - none
  - note
  - option
  - paragraph
  - presentation
  - progressbar
  - radio
  - radiogroup
  - region
  - row
  - rowgroup
  - rowheader
  - scrollbar
  - search
  - searchbox
  - separator
  - slider
  - spinbutton
  - status
  - strong
  - subscript
  - superscript
  - switch
  - tab
  - table
  - tablist
  - tabpanel
  - term
  - textbox
  - time
  - timer
  - toolbar
  - tooltip
  - tree
  - treegrid
  - treeitem
  - iframe
  - text

# (G) A `WebMCP` tool as Playwright's injected `WebMCPScript` describes it (`WebMCPToolDescription`).
WebMCPToolDescription:
  type: object
  properties:
    name: string
    description: string
    inputSchema: json?
    annotations:
      type: object?
      properties:
        readOnly: boolean?
        untrustedContent: boolean?
        consequential: boolean?
