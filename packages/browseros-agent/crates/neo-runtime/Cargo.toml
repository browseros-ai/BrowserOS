[package]
name = "neo-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs an agent's Playwright-style script in a QuickJS realm against one BrowserOS tab."

# browseros-cdp and neo-runtime-spec are the only first-party dependencies; see
# crates/NEO_STYLE.md. futures-util's `join_all` writes a click's pipelined mouse events in order.
# rand's OS-seeded `ThreadRng` backs the realm's `crypto.getRandomValues` and `randomUUID`.
[dependencies]
base64.workspace = true
browseros-cdp.workspace = true
futures-util.workspace = true
neo-runtime-spec.workspace = true
rand.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

# clap backs the `neo_run` example. tokio-tungstenite serves the fake browser in
# tests/support/fake_browser.rs; tempfile gives the end-to-end tests a throwaway profile.
# tokio's test-util lets unit tests pause time, so deadline races and click attempt counts are
# deterministic. regex and sha2 back tests/provenance.rs: it matches Playwright's definitions and
# message templates, and hashes the vendored files against their VENDOR.md.
[dev-dependencies]
clap.workspace = true
proc-macro2.workspace = true
regex.workspace = true
sha2.workspace = true
syn.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[[test]]
name = "amazon_cart_live"
path = "integration-tests/amazon_cart_live.rs"

[[test]]
name = "hacker_news_live"
path = "integration-tests/hacker_news_live.rs"

[lints.rust]
unsafe_code = "forbid"

# A crate's own table cannot be combined with `workspace = true`, so the workspace lints are
# restated first. The rest is Google Rust style: pedantic plus the lints mapped from its rules.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "warn"
enum_glob_use = "warn"
absolute_paths = "warn"
ref_option = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
clone_on_ref_ptr = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
missing_assert_message = "warn"
needless_for_each = "warn"
string_add = "warn"
mod_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_methods = "warn"
