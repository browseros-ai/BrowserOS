[package]
name = "browseros-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
browseros-cdp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
uuid.workspace = true
# Only behind the `ts-rs` feature below.
ts-rs = { workspace = true, optional = true }

[features]
# Derives ts-rs's `TS` on the ids that cross neo-playwright's op wire (`TabId`, `FrameId`,
# `TargetId`), which that crate prints in the prelude's generated TypeScript; the orphan rule
# keeps the derive here. Only neo-playwright turns it on, so the desktop app's build is unchanged.
ts-rs = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
