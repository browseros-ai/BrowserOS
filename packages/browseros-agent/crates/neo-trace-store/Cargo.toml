[package]
name = "neo-trace-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Keeps neo-runtime's run traces in SQLite, written off the run's path and read back as typed views."

# neo-runtime is the only first-party dependency: the store is one of its trace sinks. It is not a
# workspace dependency yet, so it is named by path. sea-orm and sea-orm-migration stay behind
# `pub(crate)` (src/db.rs); no SeaORM type crosses the public API. ulid reads a run id's start time
# when its `RunStarted` was shed.
[dependencies]
neo-runtime = { path = "../neo-runtime" }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true

# tempfile gives each test its own database file. tokio's test-util is for tests that pause time.
[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

# A crate's own table cannot be combined with `workspace = true`, so the workspace lints are
# restated first. The rest is Google Rust style: pedantic plus the lints mapped from its rules.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "warn"
enum_glob_use = "warn"
absolute_paths = "warn"
ref_option = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
clone_on_ref_ptr = "warn"
fn_params_excessive_bools = "warn"
must_use_candidate = "warn"
missing_assert_message = "warn"
needless_for_each = "warn"
string_add = "warn"
mod_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_methods = "warn"
