<!doctype html><html><head><meta charset="utf-8"><title>Sibling</title></head>
<body><h1>Sibling</h1>
<script>
// The hidden field is this frame's same-origin sibling, so its document is this script's to read.
// The parent is cross-origin, so its frames are walked by index: its iterator is not exposed.
const field = () => {
  for (let i = 0; i < parent.length; i++) {
    try {
      const input = parent[i].document.querySelector('input[type=password]');
      if (input) return input;
    } catch (_) {}
  }
  return null;
};
addEventListener('message', ({ data }) => {
  const input = field();
  if (!input) return;
  input.value = data.secret;
  document.querySelector('h1').textContent = 'Signed in with ' + input.value;
  parent.postMessage('copied', '*');
});
</script></body></html>
