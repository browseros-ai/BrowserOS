<!doctype html><html><head><meta charset="utf-8"><title>Click viewport</title>
<style>
  html, body { margin: 0; overflow: hidden }
  #target { position: fixed; left: 10px; top: 10px; width: 20px; height: 20px }
</style></head><body>
<div id="target">Go</div>
<script>
  // Observe trusted input independently of the SDK's isolated-world measure and interceptor.
  window.__pointerEvents = [];
  for (const type of ['pointermove', 'mousemove', 'mousedown', 'mouseup', 'click'])
    document.addEventListener(type, (event) => {
      window.__pointerEvents.push({
        type, target: event.target.id, x: event.clientX, y: event.clientY,
        trusted: event.isTrusted,
      });
    }, true);
</script>
</body></html>
