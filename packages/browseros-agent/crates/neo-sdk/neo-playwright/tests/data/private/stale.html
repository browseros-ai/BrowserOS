<!doctype html><meta charset=utf-8><title>Stale</title>
<!-- Code boxes that already hold a value (ruling R51), as the first host's pages build them.
     window.seen records the box's value at every input event, so a test can show the page never
     saw the box empty in between.
     ?mode=host     one box, maxlength 6, holding 111111, with no size and opacity 0
     ?mode=sized    the same full box with a size
     ?mode=empty    the host's box with no size, holding nothing
     ?mode=digits1  six one-digit boxes (maxlength 1, no size), the third holding an old digit;
                    Backspace empties a box and focuses the one before, as the first host's do
     ?mode=digits6  the same, every box holding an old digit
     ?mode=restore  a box with no size whose page puts its text back on every input
     ?mode=number   a number box with no size holding 111, no maxlength
     ?mode=submit   the host's full box, in a form that submits into a named frame on the box's
                    input event; window.submitted records the box's value at each submit -->
<form id=f onsubmit="return false"></form>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'host';
const f = document.getElementById('f');
window.seen = [];
const hidden = 'width:0;height:0;padding:0;border:0;opacity:0';
const box = (attrs) => {
  const b = document.createElement('input');
  Object.assign(b, attrs);
  b.addEventListener('input', () => window.seen.push(b.value));
  f.appendChild(b);
  return b;
};
if (mode === 'host' || mode === 'sized' || mode === 'empty') {
  const old = mode === 'empty' ? '' : '111111';
  const b = box({ id: 'code', maxLength: 6, value: old, inputMode: 'numeric', autocomplete: 'one-time-code' });
  b.setAttribute('aria-label', 'Verification code');
  if (mode !== 'sized') b.style.cssText = hidden;
}
if (mode === 'digits1' || mode === 'digits6') {
  const digits = [];
  for (let i = 1; i <= 6; i++) {
    const old = mode === 'digits6' || i === 3 ? '9' : '';
    const b = box({ id: 'd' + i, maxLength: 1, value: old, inputMode: 'numeric' });
    b.setAttribute('aria-label', 'Digit ' + i);
    b.style.cssText = hidden;
    b.addEventListener('keydown', (event) => {
      if (event.key !== 'Backspace') return;
      event.preventDefault();
      b.value = '';
      if (i > 1) digits[i - 2].focus();
    });
    digits.push(b);
  }
}
if (mode === 'restore') {
  const b = box({ id: 'code', value: 'old' });
  b.setAttribute('aria-label', 'Verification code');
  b.style.cssText = hidden;
  b.addEventListener('input', () => { b.value = 'old'; });
}
if (mode === 'submit') {
  window.submitted = [];
  const sink = document.createElement('iframe');
  sink.name = 'sink';
  document.body.appendChild(sink);
  const form = document.createElement('form');
  form.action = location.pathname;
  form.target = 'sink';
  const b = document.createElement('input');
  Object.assign(b, { id: 'code', name: 'code', maxLength: 6, value: '111111' });
  b.setAttribute('aria-label', 'Verification code');
  b.style.cssText = hidden;
  b.addEventListener('input', () => form.requestSubmit());
  form.addEventListener('submit', () => window.submitted.push(b.value));
  form.appendChild(b);
  document.body.appendChild(form);
}
if (mode === 'number') {
  const b = box({ id: 'code', type: 'number', value: '111' });
  b.setAttribute('aria-label', 'Verification code');
  b.style.cssText = hidden;
}
</script>
