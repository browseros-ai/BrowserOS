<!doctype html><meta charset=utf-8><title>Max length</title>
<style> body { margin: 24px; font: 15px sans-serif; } input { display: block; margin: 8px 0; } </style>
<!-- Three boxes for ruling R49's expect.maxLength: one with no maxlength, one with a limit of 6,
     and one with a limit of 0. -->
<input id=note aria-label="Note">
<input id=code aria-label="Code" maxlength=6>
<input id=zero aria-label="Zero" maxlength=0>
