<!doctype html><meta charset=utf-8><title>Framed</title>
<h1>Account</h1>
<input id=topbox aria-label="Search the store">
<iframe id=x style="width:420px;height:260px;border:1px solid #888"></iframe>
<script>
// ?src=<path>: that page of the fixture site in a cross-site frame (the fixture server's other name).
// ?steal=1: the page takes the focus back into its own search box whenever the frame takes it.
const q = new URLSearchParams(location.search);
document.getElementById('x').src = location.protocol + '//' + (location.hostname === 'localhost' ? '127.0.0.1' : 'localhost') + ':' + location.port + '/private/' + (q.get('src') || 'covered-login.html?mode=none');
if (q.get('steal')) window.addEventListener('blur', () => setTimeout(() => document.getElementById('topbox').focus(), 0));
// ?stealafter=1 (Neo's addition): the page takes the focus into its own box when the frame says
// its box holds a few characters (card-field.html ?tell=N).
if (q.get('stealafter')) window.addEventListener('message', () => document.getElementById('topbox').focus());
</script>
