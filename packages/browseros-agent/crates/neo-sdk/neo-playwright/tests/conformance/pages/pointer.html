<!doctype html><html><head><meta charset="utf-8"><title>Pointer</title><script src="events.js"></script></head>
<body>
<!-- hover and dblclick targets. #hover names the pointer events that reached it, in order, and
     the moment the pointer left it. -->
<p id="hover" style="padding:20px;width:200px">Not hovered</p>
<button id="double">Double</button>
<script>
  const hover = document.getElementById('hover')
  const seen = []
  for (const type of ['mouseover', 'mouseenter', 'mousemove', 'mouseleave'])
    hover.addEventListener(type, () => {
      if (seen.at(-1) !== type) seen.push(type)
      hover.textContent = seen.join(' ')
    })
</script>
</body></html>
