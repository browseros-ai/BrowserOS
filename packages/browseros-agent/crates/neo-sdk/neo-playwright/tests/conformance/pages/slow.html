<!doctype html><html><head><meta charset="utf-8"><title>Slow</title><script src="events.js"></script>
<!-- Load states held apart: a blocking script keeps the parser in `loading` for 600 ms after
     commit, and an image holds `load` back 800 ms after DOMContentLoaded. -->
<script src="blank.js?delay=600"></script></head>
<body><p>Slow</p><img alt="Slow image" src="child.html?delay=800"></body></html>
