<!doctype html><html><head><meta charset="utf-8"><title>Select</title><script src="events.js"></script></head>
<body>
<!-- <select> in its forms: single, multiple, option groups, a disabled option, and labels that
     differ from values. -->
<label>Color
<select id="color">
  <option value="r">Red</option>
  <option value="g" selected>Green</option>
  <option value="b" label="Blue label">Blue</option>
  <option value="x" disabled>Unavailable</option>
</select></label>
<label>Toppings
<select id="toppings" multiple>
  <optgroup label="Cheese"><option>Mozzarella</option><option>Cheddar</option></optgroup>
  <optgroup label="Meat"><option>Ham</option></optgroup>
</select></label>
<select id="unlabelled"><option>Only</option></select>
</body></html>
