- case: page-wait-for-selector-1.should-throw-on-waitfor
  path: /returned/L33
  kind: finding
  route: J4 prelude
  reason: Upstream's client rejects the undocumented waitFor option ('options.waitFor is not
    supported, did you mean options.state?'). Neo's waitForSelector ignores it and waits, so the
    test's error stays undefined and reading its message throws. frame.ts _waitForSelector
    checks only visibility.
  p: options.waitFor is not supported, did you mean options.state?
  n:
    threw:
      message: cannot read property 'message' of undefined
      name: TypeError
- case: page-wait-for-selector-2.should-have-correct-stack-trace-for-timeout
  path: /returned/L165
  kind: finding
  route: J4 prelude
  reason: error.stack in Neo is QuickJS's, frames only and no message line, so once tier 2 drops
    the runner's own frames nothing is left. Upstream's stack starts with the message, so a
    script that logs error.stack loses the message in Neo. The prelude's error classes could put
    the message first.
  p: "page.waitForSelector: Timeout <n>ms exceeded."
  n: ""
- case: page-wait-for-selector-2.should-throw-for-false-state-option
  path: /returned/L193
  kind: finding
  route: R5 reads, J4 prelude
  reason: Upstream's client checks state against attached, detached, visible and hidden before it
    sends anything. Neo leaves the check to the op's decode, so the message is serde's and lists
    Neo's internal element states too. Tier 1's captures entry for screenshot's type is the same
    gap.
  p: "page.waitForSelector: state: expected one of (attached|detached|visible|hidden)"
  n: "page.waitForSelector: state: invalid type: boolean `false`, expected string or map"
- case: page-wait-for-selector-2.should-throw-for-true-state-option
  path: /returned/L186
  kind: finding
  route: R5 reads, J4 prelude
  reason: Upstream's client checks state against attached, detached, visible and hidden before it
    sends anything. Neo leaves the check to the op's decode, so the message is serde's and lists
    Neo's internal element states too. Tier 1's captures entry for screenshot's type is the same
    gap.
  p: "page.waitForSelector: state: expected one of (attached|detached|visible|hidden)"
  n: "page.waitForSelector: state: invalid type: boolean `true`, expected string or map"
- case: page-wait-for-selector-2.should-throw-for-unknown-state-option
  path: /returned/L172
  kind: finding
  route: R5 reads, J4 prelude
  reason: Upstream's client checks state against attached, detached, visible and hidden before it
    sends anything. Neo leaves the check to the op's decode, so the message is serde's and lists
    Neo's internal element states too. Tier 1's captures entry for screenshot's type is the same
    gap.
  p: "page.waitForSelector: state: expected one of (attached|detached|visible|hidden)"
  n: "page.waitForSelector: state: unknown variant `foo`, expected one of `attached`, `detached`,
    `visible`, `hidden`, `stable`, `enabled`, `disabled`, `editable`"
- case: page-wait-for-selector-2.should-throw-for-visibility-option
  path: /returned/L179
  kind: finding
  route: J4 prelude
  reason: Upstream throws this check before its API wrapper names the call, so its message has no
    'page.waitForSelector:' prefix. Neo's clientError adds the prefix.
  p: options.visibility is not supported, did you mean options.state?
  n: "page.waitForSelector: options.visibility is not supported, did you mean options.state?"
- case: selectors-role.errors
  path: /returned/L526
  kind: finding
  route: J2 probe, R4 resolver
  reason: "Upstream's message names the error class: 'page.$: InvalidSelectorError: Error while
    parsing selector ...'. Neo's drops 'InvalidSelectorError: ' while it keeps 'Error: ' for the
    engine's plain errors (the other lines of this case match). The probe classifies the error
    as a selector error (probe/index.ts classify), and the name is lost on the way to the
    message."
  p: "page.$: InvalidSelectorError: Error while parsing selector `checkbox[checked~=true]` -
    cannot use ~= in attribute with non-string matching value - true"
  n: "page.$: Error while parsing selector `checkbox[checked~=true]` - cannot use ~= in attribute
    with non-string matching value - true"
