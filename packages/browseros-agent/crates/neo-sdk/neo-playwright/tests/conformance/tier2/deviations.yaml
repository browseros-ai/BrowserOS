- case: selectors-css.should-work-with-is
  path: /returned/L389
  kind: finding
  route: sdk-skeleton (crates/neo-sdk/neo-server bootstrap.js plain)
  reason: "claw-sdk's run bootstrap encodes an op's input with a recursive plain() on the
    run's 512 KiB QuickJS stack (crates/neo-sdk/neo-server/src/runtime/js/bootstrap.js), the depth limit
    m1-handoff's sdk-skeleton line 4 names for revive. The locator brand carries the parsed
    selector, and a :scope nested in :has() parses deep enough to overflow it in Runner N's
    debug build (measured: the op received {$neo: invalid, reason: 'the input could not be
    encoded: Maximum call stack size exceeded'}, which its decode refuses). The case's other
    selectors match. A release build's frames are smaller (unmeasured), and an iterative
    plain() would carry the input."
  p: 1
  n:
    threw:
      message: "page.$$eval: $neo: unknown field `$neo`, expected `target` or `script`"
      name: Error
