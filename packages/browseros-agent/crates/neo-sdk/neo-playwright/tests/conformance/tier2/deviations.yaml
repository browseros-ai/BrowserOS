- case: page-aria-snapshot-ai.should-not-remove-generic-nodes-with-title
  path: /returned/L869
  kind: decided
  reason: "Design D20 (Option 2, one rule on top of Playwright's snapshot) and
    snapshot/snapshot_rules.rs: no names on name-prohibited roles, so a generic named by its
    title over other content prints without the name, and every printed name is one
    getByRole(role, { name }) can find."
  p: '- generic "Element title" [ref=e1]: Element content'
  n: "- generic [ref=e1]: Element content"
- case: page-click-react.should-timeout-when-click-opens-alert
  path: /returned/L28
  kind: decided
  reason: "grounding.md (core seams): core's PageSignals accepts every alert() before any
    listener, a Playwright deviation to list. The alert never blocks the click's mouseup in Neo, so
    the click returns and the test's error stays undefined; the dialog event still reaches the
    script's waitForEvent. Upstream's click stays blocked under the open alert until its timeout."
  p: "page.click: Timeout <n>ms exceeded."
  n:
    threw:
      message: cannot read property 'message' of undefined
      name: TypeError
- case: page-click.should-click-in-a-transformed-iframe
  path: /returned
  kind: finding
  route: R8 pointer actions
  reason: "Upstream clicks through a CSS-transformed iframe by mapping the point through
    the frame's quads. Neo refuses input through an iframe with a transform on the way to the
    element (action/frame_projection.rs, Projection::Transformed), force included, with this
    message; build-design.md keeps D4's per-OOPIF session as the fallback for transformed frames,
    and it is not built yet."
  p:
    L1075: true
  n:
    threw:
      message: "locator.click: an iframe on the way to the element has a CSS transform, which Neo cannot place input through yet"
      name: Error
