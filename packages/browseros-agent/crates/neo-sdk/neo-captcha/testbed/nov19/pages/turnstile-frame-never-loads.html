<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Turnstile beside a frame that never loads</title></head>
<body>
<h1>Turnstile beside a frame that never loads</h1>
<form id="captcha-form" method="post" action="/submit/turnstile-frame-never-loads">
  <div id="widget" class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
  <button id="submit" type="submit">Submit</button>
</form>
<div id="slot"></div>
<script>
// Neo's frame scan once failed as a whole on one frame it could not read, and every page with
// such a frame read as scan_incomplete (Texas, Nov 19). Beside an always-passing Turnstile, this
// page keeps one cross-site frame whose address never answers, and replaces it every two seconds,
// so a scan can meet it detaching. It is added after the page's load, which it would otherwise
// hold back forever.
const fixtureState = window.__captchaFixture = { id: 'turnstile-frame-never-loads', family: 'turnstile', sitekey: '1x00000000000000000000AA', rendered: false, callbackFired: false, tokenLength: 0, errors: [] };
function mirror() { document.documentElement.dataset.captchaFixture = JSON.stringify(fixtureState); }
function markRendered() {
  // Turnstile can keep its iframe in a closed shadow root; observe its visible host.
  const frame = document.querySelector('#widget iframe, #widget > div');
  if (!frame) return;
  const rect = frame.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) { fixtureState.rendered = true; mirror(); observer.disconnect(); resizeObserver.disconnect(); }
}
function replaceStuckFrame() {
  const frame = document.createElement('iframe');
  frame.title = 'Never loads';
  frame.src = '{{FRAME_ORIGIN}}/never-loads';
  document.getElementById('slot').replaceChildren(frame);
}
const observer = new MutationObserver(markRendered);
const resizeObserver = new ResizeObserver(markRendered);
resizeObserver.observe(document.querySelector('#widget'));
observer.observe(document.querySelector('#widget'), { childList: true, subtree: true, attributes: true });
window.fixtureLoaded = function() {
  turnstile.render('#widget', {
    sitekey: fixtureState.sitekey,
    callback: token => { fixtureState.callbackFired = true; fixtureState.tokenLength = token.length; mirror(); },
    'error-callback': code => { fixtureState.tokenLength = 0; fixtureState.errors.push(String(code || 'widget-error')); mirror(); },
    'expired-callback': () => { fixtureState.tokenLength = 0; fixtureState.errors.push('expired'); mirror(); }
  });
  markRendered();
};
globalThis.addEventListener?.('load', () => { replaceStuckFrame(); setInterval(replaceStuckFrame, 2000); });
mirror();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=fixtureLoaded&amp;render=explicit" async defer onerror="fixtureState.errors.push('script-load-error'); mirror()"></script>
</body>
</html>
