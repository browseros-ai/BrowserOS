<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>hCaptcha test</title></head>
<body>
<h1>hCaptcha test</h1>
<form id="captcha-form" method="post" action="/submit/hcaptcha-test">
  <div id="widget" class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001"></div>
  <button id="submit" type="submit">Submit</button>
</form>
<script>
const fixtureState = window.__captchaFixture = { id: 'hcaptcha-test', family: 'hcaptcha', sitekey: '10000000-ffff-ffff-ffff-000000000001', rendered: false, callbackFired: false, tokenLength: 0, errors: [] };
function mirror() { document.documentElement.dataset.captchaFixture = JSON.stringify(fixtureState); }
function markRendered() {
  const frame = document.querySelector('#widget iframe');
  if (!frame) return;
  const rect = frame.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) { fixtureState.rendered = true; mirror(); observer.disconnect(); resizeObserver.disconnect(); }
}
const observer = new MutationObserver(markRendered);
const resizeObserver = new ResizeObserver(markRendered);
resizeObserver.observe(document.querySelector('#widget'));
observer.observe(document.querySelector('#widget'), { childList: true, subtree: true, attributes: true });
window.fixtureLoaded = function() {
  hcaptcha.render('widget', {
    sitekey: fixtureState.sitekey,
    callback: token => { fixtureState.callbackFired = true; fixtureState.tokenLength = token.length; mirror(); },
    'error-callback': code => { fixtureState.tokenLength = 0; fixtureState.errors.push(String(code || 'widget-error')); mirror(); },
    'expired-callback': () => { fixtureState.tokenLength = 0; fixtureState.errors.push('expired'); mirror(); }
  });
  markRendered();
};
mirror();
</script>
<script src="https://js.hcaptcha.com/1/api.js?onload=fixtureLoaded&amp;render=explicit" async defer onerror="fixtureState.errors.push('script-load-error'); mirror()"></script>
</body>
</html>
