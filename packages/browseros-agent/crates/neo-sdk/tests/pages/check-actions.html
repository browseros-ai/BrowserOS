<!doctype html>
<meta charset="utf-8">
<title>Checked state actions</title>
<input id="unchecked" type="checkbox">
<input id="checked" type="checkbox" checked>
<input id="checked-frame" type="checkbox" checked>
<input id="checked-locator" type="checkbox" checked>
<input id="radio" type="radio" name="group">
<input id="radio-checked" type="radio" name="group" checked>
<script>
// Two ARIA checkboxes whose own click handler toggles aria-checked, built here so the markup
// stays lint-clean: a non-semantic role=checkbox element is exactly what these cases exercise.
for (const [id, checked, label] of [['aria', 'false', 'ARIA checkbox'], ['aria-checked', 'true', 'ARIA checked']]) {
  const box = document.createElement('div')
  box.id = id
  box.setAttribute('role', 'checkbox')
  box.setAttribute('aria-checked', checked)
  box.textContent = label
  box.addEventListener('click', () => box.setAttribute('aria-checked', String(box.getAttribute('aria-checked') !== 'true')))
  document.currentScript.before(box)
}
</script>
<input id="prevent" type="checkbox" onclick="event.preventDefault()">
<div id="plain">Plain element</div>
<input id="trial" type="checkbox">
<input id="replaced" type="checkbox" onchange="const replacement=this.cloneNode(); replacement.checked=this.checked; this.replaceWith(replacement)">
<div style="position:relative;width:100px;height:40px">
  <input id="covered" type="checkbox">
  <div id="overlay" style="position:absolute;inset:0;z-index:2"></div>
</div>
<script>
window.__events = []
for (const type of ['click', 'input', 'change']) {
  document.addEventListener(type, event => {
    window.__events.push({ type, target: event.target.id, checked: event.target.checked ?? null })
  }, true)
}
window.__facts = () => ({
  checked: Object.fromEntries([...document.querySelectorAll('input')].map(e => [e.id, e.checked])),
  aria: document.querySelector('#aria').getAttribute('aria-checked'),
  ariaChecked: document.querySelector('#aria-checked').getAttribute('aria-checked'),
  events: window.__events,
})
</script>
