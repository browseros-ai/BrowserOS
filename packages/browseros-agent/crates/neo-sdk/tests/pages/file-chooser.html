<!doctype html><html lang="en"><head><meta charset="utf-8"><title>file chooser</title>
<script>
// fileChooser.test.mjs serves this page: a single-file input, a multiple one, and a same-origin
// frame holding an input of its own. Every case listens for the chooser before it clicks: a
// click nobody intercepts would open the browser's own dialog, in either engine.
</script></head><body>
<input type="file" id="single">
<input type="file" id="multiple" multiple>
<iframe id="frame" name="inner" srcdoc="<input type=file id=inner>"></iframe>
</body></html>
