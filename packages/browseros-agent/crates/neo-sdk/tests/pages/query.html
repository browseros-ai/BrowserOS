<!doctype html>
<!-- The selector-evaluation parity files' page (query, evalOnSelector, locator-evaluateHandle):
     a scope with its own matches and a match outside it, text, data attributes and a list, and
     `window.__facts()` for what a script changed. -->
<title>query</title>
<section id="greeting" data-test="gr" data-testid="grt">Hello <b>world</b></section>
<div id="outer">
  <div class="inner">in-1</div>
  <div class="inner">in-2</div>
  <span class="tag">t</span>
</div>
<div class="inner">out</div>
<ul id="list"><li>one</li><li>two</li><li>three</li></ul>
<div class="tweet"><div class="like">100</div><div class="retweets">10</div></div>
<script>
// BrowserOS neo's takeover bar is not the page's (frame-top.html explains); remove it on sight.
new MutationObserver(() => document.querySelector('browseros-neo-takeover')?.remove()).observe(
  document.documentElement,
  { childList: true, subtree: true },
)
window.__facts = () => ({
  title: document.title,
  touched: window.__touched ?? null,
  marks: [...document.querySelectorAll('[data-mark]')].map((e) => e.id || e.className),
})
</script>
