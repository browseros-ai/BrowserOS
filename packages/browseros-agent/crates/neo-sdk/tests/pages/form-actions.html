<!doctype html>
<meta charset="utf-8">
<title>Form actions</title>
<label for="text">Name</label><input id="text" value="seed">
<textarea id="area">seed</textarea>
<div id="editable" contenteditable>seed</div>
<input id="date" type="date">
<input id="number" type="number">
<input id="checkbox" type="checkbox">
<input id="disabled" disabled value="seed">
<input id="readonly" readonly value="seed">
<input class="duplicate"><input class="duplicate">
<div id="plain">Plain</div>
<select id="single"><option value="one">First</option><option value="two">Second</option></select>
<select id="multiple" multiple><option value="one">First</option><option value="two">Second</option><option value="three">Third</option></select>
<select id="disabled-option"><option value="one">First</option><option disabled value="two">Second</option></select>
<script>
window.__events = []
for (const type of ['focus', 'keydown', 'keypress', 'keyup', 'beforeinput', 'input', 'change', 'select']) {
  document.addEventListener(type, event => {
    window.__events.push({ type, target: event.target.id, key: event.key ?? null, data: event.data ?? null, inputType: event.inputType ?? null })
  }, true)
}
window.__facts = () => ({
  values: Object.fromEntries([...document.querySelectorAll('input,textarea,select')].filter(e => e.id).map(e => [e.id, e.value])),
  editable: document.querySelector('#editable').textContent,
  selected: [...document.querySelector('#multiple').selectedOptions].map(e => e.value),
  events: window.__events,
})
</script>
