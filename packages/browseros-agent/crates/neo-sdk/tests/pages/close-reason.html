<!doctype html><html lang="en"><head><meta charset="utf-8"><title>close reason</title>
<script>
// contextClose.test.mjs and pageCloseReason.test.mjs serve this page. #count counts its clicks
// in window.__clicks, so a test reads after a close that the tab kept its document; #hidden is
// never visible, so a click on it waits until its page or context closes; #arm shows #late
// 1.8 s later, and #late counts its clicks too, so a click left waiting for it shows whether it
// ran after a close. Nothing here logs.
window.__clicks = 0;
</script></head><body>
<button type="button" id="count" onclick="__clicks++">Count</button>
<button type="button" id="hidden" hidden>Hidden</button>
<button type="button" id="arm" onclick="setTimeout(() => { document.getElementById('late').hidden = false }, 1800)">Arm</button>
<button type="button" id="late" hidden onclick="__clicks++">Late</button>
</body></html>
