<!doctype html><html><head><meta charset="utf-8"><title>Covered L1</title><script src="events.js"></script>
<style>#overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.2); }</style></head>
<body style="position:relative;margin:0">
<!-- F9's L1: the L2 frame (child.html back on 127.0.0.1) under #overlay, which never goes. -->
<script>
  const l2 = document.createElement('iframe')
  l2.title = 'L2'
  l2.src = `http://127.0.0.1:${location.port}/child.html?name=L2`
  l2.style.cssText = 'width:500px;height:300px'
  document.body.append(l2)
</script>
<div id="overlay"></div>
</body></html>
