<title>Neo</title>

  #clipboard-status { position: fixed; top: 12px; right: 12px; z-index: 4; padding: 8px 12px;
    background: #222; color: #fff; border-radius: 6px; font: 14px system-ui, sans-serif; }
  #clipboard-status:empty { display: none; }
</style>
