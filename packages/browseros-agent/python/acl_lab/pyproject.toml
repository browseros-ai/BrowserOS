[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browseros-acl-lab"
version = "0.1.0"
description = "Python prototype harness for BrowserOS ACL matching"
requires-python = ">=3.11"
dependencies = ["nltk>=3.9.0", "sentence-transformers>=3.0.0"]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[project.scripts]
acl-lab = "acl_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["acl_lab*"]
