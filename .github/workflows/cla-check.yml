name: CLA Check

on:
  workflow_run:
    workflows: [CLA Trigger]
    types: [completed]
  issue_comment:
    types: [created]
  schedule:
    # Picks up open PRs whose head commit has no "cla" status yet.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check (leave empty to re-check all open PRs)
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    concurrency:
      group: cla-check-${{ github.event.issue.number || inputs.pr || github.event.workflow_run.head_sha || 'sweep' }}
      cancel-in-progress: false
    steps:
      - name: Checkout CLA script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Check CLA signatures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIGNATURES_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          script: |
            const run = require('./.github/scripts/cla.js')
            await run({ github, context, core, getOctokit })
