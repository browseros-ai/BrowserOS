name: ChatGPT Remote Gateway

on:
  pull_request:
    paths:
      - "infra/cloudflare/chatgpt-remote-gateway/**"
      - ".github/workflows/chatgpt-remote-gateway.yml"
      - "packages/browseros-agent/apps/claw-app/**"
      - "packages/browseros-agent/apps/claw-server/**"
      - "packages/browseros-agent/Cargo.toml"
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
    paths:
      - "infra/cloudflare/chatgpt-remote-gateway/**"
      - ".github/workflows/chatgpt-remote-gateway.yml"
      - "packages/browseros-agent/apps/claw-app/**"
      - "packages/browseros-agent/apps/claw-server/**"
      - "packages/browseros-agent/Cargo.toml"

permissions:
  contents: read

jobs:
  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare/chatgpt-remote-gateway/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/chatgpt-remote-gateway/worker/package.json
      - name: Show toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund --verbose
      - name: Pairing and OAuth protocol tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck -- --pretty false
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir=dist --log-level debug
