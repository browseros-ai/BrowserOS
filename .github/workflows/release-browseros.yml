name: "Release: BrowserOS (full)"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-browseros
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Resolve main release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      onboarding_version: ${{ steps.release.outputs.onboarding_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Resolve release source and version
        id: release
        working-directory: packages/browseros
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "::error::Full releases must be dispatched from $expected_ref"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          version="$(uv run python bos_build/scripts/bump_version.py --mode none)"
          onboarding_version="$(jq -er '.version' "$GITHUB_WORKSPACE/packages/browseros-agent/apps/app-onboard/package.json")"
          {
            echo "onboarding_version=$onboarding_version"
            echo "source_sha=$source_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  server:
    name: Release BrowserOS server
    needs: preflight
    uses: ./.github/workflows/release-server.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      ref: ${{ needs.preflight.outputs.source_sha }}
      publish_ota: true
    secrets: inherit

  extension:
    name: Release agent extension
    needs: [preflight, server]
    uses: ./.github/workflows/release-extensions.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      extension: agent
      branch: ${{ needs.preflight.outputs.source_sha }}
      publish_alpha_feed: true
    secrets: inherit

  components:
    name: Verify exact component releases
    needs: [preflight, server, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source and versions
        env:
          EXTENSION_SHA: ${{ needs.extension.outputs.release_sha }}
          EXTENSION_VERSION: ${{ needs.extension.outputs.version }}
          ONBOARDING_VERSION: ${{ needs.preflight.outputs.onboarding_version }}
          SERVER_SHA: ${{ needs.server.outputs.release_sha }}
          SERVER_VERSION: ${{ needs.server.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SERVER_SHA" = "$SOURCE_SHA"
          test "$EXTENSION_SHA" = "$SOURCE_SHA"
          [[ "$SERVER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXTENSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ONBOARDING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  linux:
    name: Linux x64
    needs: [preflight, server, extension, components]
    uses: ./.github/workflows/release-linux.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browseros
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  windows:
    name: Windows x64
    needs: [preflight, server, extension, components]
    uses: ./.github/workflows/release-windows.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browseros
      sign: true
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  macos:
    name: macOS universal
    needs: [preflight, server, extension, components]
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: read
    with:
      products: browseros
      arch: universal
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  finalize:
    name: Create browser draft
    needs: [preflight, server, extension, components, linux, windows, macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Create or refresh browser draft
        working-directory: packages/browseros
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          uv run browseros release github create \
            --version "$VERSION" \
            --product browseros \
            --platforms all \
            --macos-arch universal \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --target "$SOURCE_SHA"
