name: Diagnose OTA notarization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
      PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
      PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Compare implicit and explicit Keychain credential storage
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          values = [os.environ[name] for name in ('PROD_MACOS_NOTARIZATION_APPLE_ID', 'PROD_MACOS_NOTARIZATION_TEAM_ID', 'PROD_MACOS_NOTARIZATION_PWD', 'MACOS_KEYCHAIN_PASSWORD')]
          def run(label, command):
              result = subprocess.run(command, capture_output=True, text=True, timeout=90)
              output = result.stdout + result.stderr
              for secret in sorted(values, key=len, reverse=True):
                  if secret:
                      output = output.replace(secret, '<REDACTED>')
              print(f'{label}: exit={result.returncode}\n{output}', flush=True)
              return result.returncode
          keychain = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ota-diagnostic.keychain-db')
          for label, command in [
              ('create', ['security', 'create-keychain', '-p', values[3], keychain]),
              ('settings', ['security', 'set-keychain-settings', '-lut', '21600', keychain]),
              ('unlock', ['security', 'unlock-keychain', '-p', values[3], keychain]),
              ('search-list', ['security', 'list-keychains', '-d', 'user', '-s', keychain]),
              ('default', ['security', 'default-keychain', '-d', 'user', '-s', keychain]),
          ]:
              if run(label, command):
                  raise SystemExit(1)
          credentials = ['--apple-id', values[0], '--team-id', values[1], '--password', values[2]]
          run('implicit-store', ['xcrun', 'notarytool', 'store-credentials', 'ota-diag-implicit', *credentials])
          explicit = run('explicit-store', ['xcrun', 'notarytool', 'store-credentials', 'ota-diag-explicit', *credentials, '--keychain', keychain])
          if explicit == 0:
              explicit = run('explicit-history', ['xcrun', 'notarytool', 'history', '--keychain-profile', 'ota-diag-explicit', '--keychain', keychain])
          subprocess.run(['security', 'delete-keychain', keychain], capture_output=True)
          raise SystemExit(explicit)
          PYTHON
