name: Release Agent SDK

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/browseros-agent/packages/agent-sdk

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun ci
        working-directory: packages/browseros-agent

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          SDK_PATH="packages/browseros-agent/packages/agent-sdk"
          TAG="agent-sdk-v${{ steps.version.outputs.version }}"
          # Find the previous agent-sdk release tag
          PREV_TAG=$(git tag -l "agent-sdk-v*" --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            # Get commits that modified the agent-sdk directory since last release
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" -- "$SDK_PATH")
          else
            NOTES="Initial release"
          fi
          # Write to file to handle multiline
          echo "$NOTES" > /tmp/release-notes.md
        working-directory: ${{ github.workspace }}

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%d")
          CHANGELOG="packages/browseros-agent/packages/agent-sdk/CHANGELOG.md"
          NOTES=$(cat /tmp/release-notes.md)

          # Build new entry
          ENTRY="## v${VERSION} (${DATE})\n\n${NOTES}\n"

          # Insert after the header line
          sed -i "1 a\\
          \\
          ${ENTRY}" "$CHANGELOG"

          # Commit the changelog update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG"
          git commit -m "docs: update agent-sdk changelog for v${VERSION}"
          git push origin main
        working-directory: ${{ github.workspace }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="agent-sdk-v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "@browseros-ai/agent-sdk v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
        working-directory: ${{ github.workspace }}
