name: "Nightly: Reserve browser version"

on:
  workflow_call:
    inputs:
      trigger_sha:
        description: Main commit that triggered the nightly
        required: true
        type: string
    outputs:
      onboarding_version:
        description: Onboarding version at the reserved main commit
        value: ${{ jobs.reserve.outputs.onboarding_version }}
      source_sha:
        description: Main commit containing the reserved browser version
        value: ${{ jobs.reserve.outputs.source_sha }}
      version:
        description: Reserved browser version
        value: ${{ jobs.reserve.outputs.version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  reserve:
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-browser-version-reservation
      cancel-in-progress: false
      queue: max
    timeout-minutes: 20
    outputs:
      onboarding_version: ${{ steps.reserve.outputs.onboarding_version }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
      version: ${{ steps.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Reserve the next version on main
        id: reserve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error::Nightly version reservation requires main as the default branch"
            exit 1
          fi
          if [[ ! "$TRIGGER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::trigger_sha must be a full commit SHA"
            exit 1
          fi

          git config user.name "BrowserOS CI"
          git config user.email "ci@browseros.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin --no-tags --force \
              '+refs/heads/main:refs/remotes/origin/main'
            git merge-base --is-ancestor "$TRIGGER_SHA" origin/main
            branch="bot/nightly-browser-version-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            git checkout -B "$branch" origin/main
            version="$(uv run --directory packages/browseros python bos_build/scripts/bump_version.py --mode offset+build)"
            git add \
              packages/browseros/resources/BROWSEROS_VERSION \
              packages/browseros/bos_build/config/BROWSEROS_BUILD_OFFSET
            git commit -m "chore(release): reserve nightly v${version} [skip ci]"
            head_sha="$(git rev-parse HEAD)"
            if ! git push origin "$branch"; then
              echo "Reservation branch push failed on attempt $attempt"
              continue
            fi
            pr_url=""
            if ! pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(release): reserve nightly v${version}" \
              --body "Reserves browser version v${version} for nightly run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} from ${TRIGGER_SHA}.")"; then
              git push origin --delete "$branch" >/dev/null 2>&1 || true
              echo "Reservation PR creation failed on attempt $attempt"
              continue
            fi
            source_sha=""
            for merge_try in 1 2 3 4 5 6; do
              gh pr merge "$pr_url" \
                --repo "$GITHUB_REPOSITORY" \
                --squash \
                --auto \
                --delete-branch \
                --match-head-commit "$head_sha" \
                --subject "chore(release): reserve nightly v${version} [skip ci]" \
                --body "Automated nightly browser version reservation." || true
              state="$(gh pr view "$pr_url" \
                --repo "$GITHUB_REPOSITORY" \
                --json state \
                --jq '.state' 2>/dev/null || true)"
              if [ "$state" = "MERGED" ]; then
                source_sha="$(gh pr view "$pr_url" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json mergeCommit \
                  --jq '.mergeCommit.oid // ""')"
                break
              fi
              echo "Reservation PR merge attempt $merge_try is not ready"
              sleep 5
            done
            if [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              git fetch origin --no-tags --force \
                '+refs/heads/main:refs/remotes/origin/main'
              git merge-base --is-ancestor "$source_sha" origin/main
              git checkout --detach "$source_sha"
              merged_version="$(uv run --directory packages/browseros python bos_build/scripts/bump_version.py --mode none)"
              onboarding_version="$(jq -er '.version' packages/browseros-agent/apps/claw-onboard/package.json)"
              test "$merged_version" = "$version"
              [[ "$onboarding_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              {
                echo "onboarding_version=$onboarding_version"
                echo "source_sha=$source_sha"
                echo "version=$version"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh pr close "$pr_url" --repo "$GITHUB_REPOSITORY" --delete-branch || true
            echo "Reservation PR did not merge on attempt $attempt; retrying from current main"
          done

          echo "::error::Could not reserve a nightly version on main after five attempts"
          exit 1
