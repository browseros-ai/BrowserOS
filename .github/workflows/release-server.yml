name: "Release: BrowserOS Server"

on:
  push:
    tags:
      - "agent-server/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; allocated automatically when omitted"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to release; defaults to the repository default branch"
        required: false
        type: string
        default: ""
      publish_ota:
        description: "Publish the live alpha-channel server OTA release after finalization"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        description: "Build a prepared release or finalize an existing one"
        required: false
        type: string
        default: "build"
      defer_finalize:
        description: "Leave a successful build private for a later finalize call"
        required: false
        type: boolean
        default: false
      state_owner:
        description: "Tracked release-state owner: component or suite"
        required: false
        type: string
        default: "component"
      version:
        description: "Explicit release version; required for finalize mode"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to release; required for finalize mode"
        required: false
        type: string
        default: ""
      publish_ota:
        description: "Publish the live alpha-channel server OTA release after finalization"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "Prepared server version"
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: "Prepared server tag"
        value: ${{ jobs.prepare.outputs.tag }}
      release_sha:
        description: "Immutable source commit"
        value: ${{ jobs.prepare.outputs.release_sha }}
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      RELEASE_REFLECT_TOKEN:
        required: false
      # Compiled into the server as BROWSEROS_SENTRY_DSN. Without it the
      # server still ships and simply reports nothing to Sentry.
      SENTRY_DSN:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  # The toolchain test.yml lints and tests with, so a release compiles what CI checked.
  RUST_TOOLCHAIN: "1.98.0"

concurrency:
  group: release-server
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.event_name != 'push' || github.event.deleted != true
    concurrency:
      group: release-component-allocation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.lifecycle.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      reservation: ${{ steps.release.outputs.reservation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && (github.event.repository.default_branch || 'main') || (inputs.ref || github.event.repository.default_branch || 'main') }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Validate lifecycle inputs
        id: validate
        env:
          MODE: ${{ inputs.mode || 'build' }}
          REF: ${{ inputs.ref || '' }}
          STATE_OWNER: ${{ inputs.state_owner || 'component' }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "build" ] && [ "$MODE" != "finalize" ]; then
            echo "::error::mode must be build or finalize"
            exit 1
          fi
          case "$STATE_OWNER" in
            component|suite) ;;
            *)
              echo "::error::state_owner must be component or suite"
              exit 1
              ;;
          esac
          if [ "$MODE" = "finalize" ] && { [ -z "$VERSION" ] || [ -z "$REF" ]; }; then
            echo "::error::finalize mode requires explicit version and ref inputs"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release
        id: release
        working-directory: packages/browseros
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          uv run browseros release component resolve \
            --component server \
            --event-name "$EVENT_NAME" \
            --default-branch "$DEFAULT_BRANCH" \
            --ref-name "$REF_NAME" \
            --requested-version "$REQUESTED_VERSION" \
            --release-ref HEAD \
            --r2-allocations \
            --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Resolve effective lifecycle mode
        id: lifecycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.validate.outputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RESERVATION: ${{ steps.release.outputs.reservation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$RESERVATION" = "tag" ] && \
            [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = "false" ]; then
            MODE="finalize"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          changelog="${RUNNER_TEMP}/server-changelog.md"
          notes="${RUNNER_TEMP}/server-release-notes.md"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial BrowserOS Server release." > "$changelog"
          else
            git log "$PREVIOUS_TAG..$RELEASE_SHA" --pretty=format:"- %s (%h)" > "$changelog"
            if [ ! -s "$changelog" ]; then
              echo "No commits since $PREVIOUS_TAG." > "$changelog"
            fi
          fi
          node packages/browseros-agent/scripts/release/cap-release-changelog.mjs \
            --input "$changelog" \
            --output "$notes" \
            --max-entries 15 \
            --previous-tag "$PREVIOUS_TAG" \
            --release-tag "$RELEASE_TAG"
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: Reserve private draft
        if: ${{ steps.lifecycle.outputs.mode == 'build' && steps.release.outputs.reservation != 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          title="BrowserOS Server - v$VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)"
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            target="$(jq -r '.targetCommitish' <<< "$release")"
            if [ "$is_draft" != "true" ] || [ "$target" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG is not a reusable draft for $RELEASE_SHA"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes"
          fi

  # Each target compiles on a runner of its own OS: the local packager's
  # cross-compilers need a macOS host, and a native runner can also execute
  # the binary to check its version. build-publish then packages all five at
  # once, through the same packager a local build uses.
  build:
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the arm64 image. darwin-x64 cross-compiles,
          # and its version check runs the x86_64 binary under Rosetta 2, which
          # GitHub installs on its arm64 macOS images.
          - target: darwin-arm64
            rust_target: aarch64-apple-darwin
            cargo_command: build
            cargo_target: aarch64-apple-darwin
            runner: macos-26
            binary_ext: ""
          - target: darwin-x64
            rust_target: x86_64-apple-darwin
            cargo_command: build
            cargo_target: x86_64-apple-darwin
            runner: macos-26
            binary_ext: ""
          # Linux links against glibc 2.17 through zig, the floor the local
          # packager uses (rust-compiler.ts LINUX_GLIBC_VERSION). A native link
          # on ubuntu-24.04 would require glibc 2.39, and the server would not
          # start on Ubuntu 22.04 or Debian 12. Zigbuild drops the .2.17
          # suffix from the output path: target/<rust_target>/release/.
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            cargo_command: zigbuild
            cargo_target: aarch64-unknown-linux-gnu.2.17
            runner: ubuntu-24.04-arm
            binary_ext: ""
          - target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            cargo_command: zigbuild
            cargo_target: x86_64-unknown-linux-gnu.2.17
            runner: ubuntu-latest
            binary_ext: ""
          # Windows ships with the other four. Dropping this entry also means
          # changing finalize (it verifies five assets), the OTA feed
          # (bos_build/release/ota/common.py publishes five platforms) and
          # release-browseros.yml (it hands this version to the Windows lane).
          - target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            cargo_command: build
            cargo_target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_ext: ".exe"
    env:
      BINARY_EXT: ${{ matrix.binary_ext }}
      BROWSEROS_TARGET: ${{ matrix.target }}
      CARGO_COMMAND: ${{ matrix.cargo_command }}
      CARGO_TARGET: ${{ matrix.cargo_target }}
      RUST_TARGET: ${{ matrix.rust_target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          rustc --version
          cargo --version

      # A Python of the job's own: the runner image's system Python refuses
      # pip installs (PEP 668).
      - uses: actions/setup-python@v6
        if: matrix.cargo_command == 'zigbuild'
        with:
          python-version: "3.13"

      - name: Install zig linker
        if: matrix.cargo_command == 'zigbuild'
        run: |
          set -euo pipefail
          # cargo-zigbuild finds this zig through `python3 -m ziglang`.
          python3 -m pip install ziglang==0.14.1
          python3 -m ziglang version
          cargo install --locked cargo-zigbuild --version 0.23.0
          cargo zigbuild --version

      - name: Stamp release version
        shell: bash
        working-directory: packages/browseros
        run: uv run browseros release component stamp --component server --version "$VERSION"

      - name: Build BrowserOS server
        shell: bash
        working-directory: packages/browseros-agent
        env:
          # Read at compile time by option_env! in crates/browseros-server/src/app/report.rs.
          BROWSEROS_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${BROWSEROS_SENTRY_DSN:-}" ]; then
            echo "::warning::SENTRY_DSN is not set; this server build will not report to Sentry"
          fi
          # The requested source ref can predate a package rename. Resolve the
          # package from that checkout's release descriptor.
          server_package="$(uv run --directory ../browseros python -c 'from bos_build.release.components import component_by_id; print(component_by_id("server").package_name)')"
          # rustc links macOS binaries for its per-arch default minimum, but the
          # cc crate compiles the C dependencies for the runner's Xcode SDK
          # version when this is unset. Pin it to rustc's defaults so the
          # shipped minimum macOS stays fixed across runner images.
          case "$RUST_TARGET" in
            aarch64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
            x86_64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=10.12 ;;
          esac
          cargo "$CARGO_COMMAND" --release --locked --target "$CARGO_TARGET" \
            -p "$server_package" \
            --bin browseros_server

      - name: Verify stamped binary version
        shell: bash
        working-directory: packages/browseros-agent
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/browseros_server$BINARY_EXT"
          actual="$("$binary" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Expected $VERSION from $binary, got: $actual" >&2
            exit 1
          fi

      - name: Stage binary for packaging
        shell: bash
        working-directory: packages/browseros-agent
        run: |
          set -euo pipefail
          # build-publish reads <target>/browseros_server[.exe] through
          # BROWSEROS_SERVER_PREBUILT_DIR (scripts/build/server/prebuilt.ts).
          mkdir -p "dist/prebuilt/$BROWSEROS_TARGET"
          cp "target/$RUST_TARGET/release/browseros_server$BINARY_EXT" "dist/prebuilt/$BROWSEROS_TARGET/"

      - name: Upload target binary
        uses: actions/upload-artifact@v7
        with:
          name: browseros-server-binary-${{ matrix.target }}
          path: packages/browseros-agent/dist/prebuilt
          if-no-files-found: error

  build-publish:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOG_LEVEL: info
      NODE_ENV: production
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Preflight required secrets
        run: |
          set -euo pipefail
          required=(R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: packages/browseros-agent/package.json

      - name: Install browseros-agent dependencies
        working-directory: packages/browseros-agent
        run: bun ci

      - name: Stamp release version for artifacts
        working-directory: packages/browseros
        run: uv run browseros release component stamp --component server --version "$VERSION"

      - name: Download target binaries
        uses: actions/download-artifact@v8
        with:
          pattern: browseros-server-binary-*
          merge-multiple: true
          path: packages/browseros-agent/dist/prebuilt

      # The packager stages these binaries with Bun from the R2 manifest, writes
      # the artifact metadata finalize checks, and uploads immutably. It skips
      # Cargo entirely in prebuilt mode.
      - name: Build and upload immutable server resources
        working-directory: packages/browseros-agent
        env:
          BROWSEROS_SERVER_PREBUILT_DIR: ${{ github.workspace }}/packages/browseros-agent/dist/prebuilt
        run: bun scripts/build/server.ts --target=all --upload --versioned-only

      - name: Attach zips to private draft
        working-directory: packages/browseros-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist/prod/server -maxdepth 1 -name 'browseros-server-resources-*.zip' | sort)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "::error::Expected 5 server resource zips, found ${#assets[@]}"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "BrowserOS Server - v$VERSION"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  finalize:
    needs:
      - prepare
      - build-publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.prepare.outputs.mode == 'finalize' || (needs.prepare.outputs.mode == 'build' && inputs.defer_finalize != true && needs.build-publish.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RESERVATION: ${{ needs.prepare.outputs.reservation }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)"
          asset_count="$(jq '[.assets[] | select(.name | test("^browseros-server-resources-(darwin-arm64|darwin-x64|linux-arm64|linux-x64|windows-x64)\\.zip$"))] | length' <<< "$release")"
          if [ "$asset_count" -ne 5 ]; then
            echo "::error::Expected 5 draft assets, found $asset_count"
            exit 1
          fi
          if [ "$RESERVATION" != "tag" ]; then
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            target="$(jq -r '.targetCommitish' <<< "$release")"
            if [ "$is_draft" != "true" ] || [ "$target" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG is not the prepared draft for $RELEASE_SHA"
              exit 1
            fi
          fi
          artifact_dir="$(mktemp -d)"
          mkdir -p "$artifact_dir/draft"
          targets=(darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64)
          for target in "${targets[@]}"; do
            name="browseros-server-resources-${target}.zip"
            key="artifacts/server/${VERSION}/${name}"
            metadata="$(aws s3api head-object --endpoint-url "$R2_ENDPOINT" --region auto --bucket "$R2_BUCKET" --key "$key" --query Metadata --output json)"
            if ! jq -e \
              --arg component "artifacts/server" \
              --arg release_sha "$RELEASE_SHA" \
              --arg target "$target" \
              --arg version "$VERSION" \
              '.["release-sha"] == $release_sha and .component == $component and .target == $target and .version == $version and ((.sha256 // "") | test("^[0-9a-f]{64}$"))' \
              <<< "$metadata" >/dev/null; then
              echo "::error::Invalid immutable R2 binding for $key"
              exit 1
            fi
            canonical="$artifact_dir/r2-${name}"
            aws s3api get-object --endpoint-url "$R2_ENDPOINT" --region auto --bucket "$R2_BUCKET" --key "$key" "$canonical" >/dev/null
            canonical_sha="$(sha256sum "$canonical" | cut -d ' ' -f1)"
            if [ "$canonical_sha" != "$(jq -r '.sha256' <<< "$metadata")" ]; then
              echo "::error::Canonical R2 checksum does not match its binding for $key"
              exit 1
            fi
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$artifact_dir/draft"
            draft_sha="$(sha256sum "$artifact_dir/draft/$name" | cut -d ' ' -f1)"
            if [ "$draft_sha" != "$canonical_sha" ]; then
              echo "::error::Draft asset does not match canonical R2 object: $name"
              exit 1
            fi
          done

      - name: Create annotated release tag
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
              echo "::error::$RELEASE_TAG must be annotated"
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG points at a different source"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "BrowserOS Server - v$VERSION" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Copy versioned objects to latest
        env:
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          targets=(darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64)
          for target in "${targets[@]}"; do
            name="browseros-server-resources-${target}.zip"
            source="artifacts/server/${VERSION}/${name}"
            destination="artifacts/server/latest/${name}"

            # The workflow-level concurrency group serializes suite and
            # standalone finalizers across this entire compare/copy seam.
            source_head="$(aws s3api head-object --endpoint-url "$R2_ENDPOINT" --region auto --bucket "$R2_BUCKET" --key "$source" --output json)"
            if ! jq -e \
              --arg component "artifacts/server" \
              --arg release_sha "$RELEASE_SHA" \
              --arg target "$target" \
              --arg version "$VERSION" \
              '.Metadata["release-sha"] == $release_sha and .Metadata.component == $component and .Metadata.target == $target and .Metadata.version == $version and ((.Metadata.sha256 // "") | test("^[0-9a-f]{64}$")) and (.ContentLength > 0)' \
              <<< "$source_head" >/dev/null; then
              echo "::error::Invalid immutable R2 binding for $source"
              exit 1
            fi
            source_checksum="$(jq -r '.Metadata.sha256' <<< "$source_head")"
            source_size="$(jq -r '.ContentLength' <<< "$source_head")"

            destination_head_file="$(mktemp)"
            destination_error_file="$(mktemp)"
            if aws s3api head-object \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto \
              --bucket "$R2_BUCKET" \
              --key "$destination" \
              --output json >"$destination_head_file" 2>"$destination_error_file"; then
              destination_head="$(cat "$destination_head_file")"
            elif grep -Eq '(404|Not Found|NoSuchKey)' "$destination_error_file"; then
              destination_head=""
            else
              cat "$destination_error_file" >&2
              echo "::error::Could not inspect $destination"
              exit 1
            fi

            if [ -n "$destination_head" ]; then
              if ! jq -e \
                --arg component "artifacts/server" \
                --arg target "$target" \
                '.Metadata.component == $component and .Metadata.target == $target and ((.Metadata.version // "") | test("^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$")) and ((.Metadata["release-sha"] // "") | test("^[0-9a-f]{40}$")) and ((.Metadata.sha256 // "") | test("^[0-9a-f]{64}$")) and (.ContentLength > 0)' \
                <<< "$destination_head" >/dev/null; then
                echo "::error::Latest R2 alias has an invalid binding: $destination"
                exit 1
              fi
              current_version="$(jq -r '.Metadata.version' <<< "$destination_head")"
              if [ "$current_version" = "$VERSION" ]; then
                if ! jq -e \
                  --arg release_sha "$RELEASE_SHA" \
                  --arg checksum "$source_checksum" \
                  --argjson size "$source_size" \
                  '.Metadata["release-sha"] == $release_sha and .Metadata.sha256 == $checksum and .ContentLength == $size' \
                  <<< "$destination_head" >/dev/null; then
                  echo "::error::Latest R2 alias conflicts at version $VERSION: $destination"
                  exit 1
                fi
                echo "$destination already matches version, source, and checksum"
                continue
              fi
              newest_version="$(printf '%s\n%s\n' "$VERSION" "$current_version" | sort -V | tail -n 1)"
              if [ "$newest_version" = "$current_version" ]; then
                echo "$destination is already newer at $current_version; leaving it unchanged"
                continue
              fi
            fi

            aws s3api copy-object \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto \
              --bucket "$R2_BUCKET" \
              --copy-source "$R2_BUCKET/$source" \
              --metadata-directive COPY \
              --key "$destination" >/dev/null
            copied_head="$(aws s3api head-object --endpoint-url "$R2_ENDPOINT" --region auto --bucket "$R2_BUCKET" --key "$destination" --output json)"
            if ! jq -e \
              --arg component "artifacts/server" \
              --arg release_sha "$RELEASE_SHA" \
              --arg checksum "$source_checksum" \
              --arg target "$target" \
              --arg version "$VERSION" \
              --argjson size "$source_size" \
              '.Metadata["release-sha"] == $release_sha and .Metadata.component == $component and .Metadata.target == $target and .Metadata.version == $version and .Metadata.sha256 == $checksum and .ContentLength == $size' \
              <<< "$copied_head" >/dev/null; then
              echo "::error::Latest R2 binding was not preserved for $destination"
              exit 1
            fi
          done

      - name: Publish private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  publish-ota:
    needs:
      - prepare
      - finalize
    if: ${{ needs.finalize.result == 'success' && github.event_name != 'push' && inputs.publish_ota == true }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-server-ota.yml
    with:
      product: browseros
      version: ${{ needs.prepare.outputs.version }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      snapshot_path: updates/server/appcast-server.alpha.xml
    secrets: inherit

  reflect-version:
    needs:
      - prepare
      - finalize
      - publish-ota
    if: ${{ always() && inputs.state_owner != 'suite' && needs.finalize.result == 'success' && (needs.publish-ota.result == 'success' || needs.publish-ota.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    # Source versions have one writer: the repository named by
    # RELEASE_REFLECT_REPO, else this one. BrowserOS-internal releases from a
    # one-way mirror of the public repository, so it names public main (with a
    # RELEASE_REFLECT_TOKEN that can push there) and receives the bump on its
    # next upstream sync. Bumping the mirror itself would leave public behind.
    env:
      GH_REPO: ${{ vars.RELEASE_REFLECT_REPO || github.repository }}
    steps:
      - name: Resolve version source
        id: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REFLECT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GH_REPO" --jq .default_branch)"
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ env.GH_REPO }}
          ref: ${{ steps.source.outputs.default_branch }}
          token: ${{ secrets.RELEASE_REFLECT_TOKEN || github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Reflect version on main via PR
        env:
          DEFAULT_BRANCH: ${{ steps.source.outputs.default_branch }}
          GH_TOKEN: ${{ secrets.RELEASE_REFLECT_TOKEN || github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore-bump-server-v${VERSION}"
          git fetch origin "$DEFAULT_BRANCH" --no-tags
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          # The release component descriptor is the one place the server's
          # crate path lives; the stamp below writes these same two files.
          spec_paths="$(uv run --directory packages/browseros python -c 'from bos_build.release.components import component_by_id; spec = component_by_id("server"); print(spec.manifest_path.as_posix()); print(spec.lockfile_path.as_posix())')"
          { read -r cargo_toml && read -r lock; } <<< "$spec_paths"
          current="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$cargo_toml")"
          if [ "$current" != "$VERSION" ]; then
            newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
            if [ "$newest" = "$current" ]; then
              echo "Server source is already newer than released version $VERSION"
              exit 0
            fi
          fi
          uv run --directory packages/browseros browseros release component stamp \
            --component server \
            --version "$VERSION"
          if git diff --quiet -- "$cargo_toml" "$lock"; then exit 0; fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            pr_url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
            if [ -z "$pr_url" ]; then
              pr_url="$(gh pr create --title "chore: bump server version to ${VERSION}" --body "Reflects the published agent-server/v${VERSION} resources." --base "$DEFAULT_BRANCH" --head "$branch")"
            fi
            head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
            packages/browseros-agent/scripts/release/merge-release-pr.sh "$pr_url" "$head_sha"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$cargo_toml" "$lock"
          git commit -m "chore: bump server version to ${VERSION}"
          head_sha="$(git rev-parse HEAD)"
          git push origin "$branch"
          pr_url="$(gh pr create --title "chore: bump server version to ${VERSION}" --body "Reflects the published agent-server/v${VERSION} resources." --base "$DEFAULT_BRANCH" --head "$branch")"
          packages/browseros-agent/scripts/release/merge-release-pr.sh "$pr_url" "$head_sha"
