name: "Release: Neo Docker image"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      latest:
        type: boolean
        default: false

permissions: {}

jobs:
  permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check existing Neo package push permission
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/ghcr-token.json"
          if ! curl --silent --show-error --fail-with-body \
            --user "$GHCR_USERNAME:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:browseros-ai/neo:pull,push' \
            --output "$response"; then
            jq -r '.errors[]? | "\(.code): \(.message)"' "$response"
            exit 1
          fi
          echo 'GHCR accepted pull,push scope for the workflow token.'
