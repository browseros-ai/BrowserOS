name: "Release: Neo Docker image"

# This temporary promotion branch names the already tested multi-platform index
# from run 41765099241. It uses the repository's existing package write access;
# no image layers, version tags, provider secrets, or main-branch files change.
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      latest:
        type: boolean
        default: true
      push:
        type: boolean
        default: true
      verify_paid:
        type: boolean
        default: false

permissions: {}
concurrency:
  group: release-docker
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      SELECTED_VERSION: ${{ inputs.version }}
      SELECTED_LATEST: ${{ inputs.latest }}
      SELECTED_PUSH: ${{ inputs.push }}
      SELECTED_PAID: ${{ inputs.verify_paid }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified index and verify both architectures
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          assert os.environ['SELECTED_VERSION'] == '0.52.1.2'
          assert os.environ['SELECTED_LATEST'] == 'true'
          assert os.environ['SELECTED_PUSH'] == 'true'
          assert os.environ['SELECTED_PAID'] == 'false'
          expected = 'sha256:dc004fe28e9a84050a98a84e9abca418e92a8b9056e8a02571741ce4af4d5856'
          image = 'ghcr.io/browseros-ai/neo'
          version = image + ':0.52.1.2'
          latest = image + ':latest'
          source = image + '@' + expected

          def inspect(reference, template):
              result = subprocess.check_output([
                  'docker', 'buildx', 'imagetools', 'inspect', reference,
                  '--format', template,
              ], text=True)
              return json.loads(result)

          verified = inspect(version, '{{json .Manifest}}')
          assert verified['digest'] == expected, 'Version tag changed since acceptance'
          before = inspect(latest, '{{json .Manifest}}')['digest']
          print('Previous latest: ' + before, flush=True)
          # Pin the immutable index, preserving both native manifests and their
          # attestations. A tag read at publication time cannot select the source.
          subprocess.run([
              'docker', 'buildx', 'imagetools', 'create', '--prefer-index=false',
              '--tag', latest, source,
          ], check=True)
          promoted = inspect(latest, '{{json .Manifest}}')
          assert promoted['digest'] == expected
          assert promoted['manifests'] == verified['manifests']
          assert inspect(version, '{{json .Manifest}}')['digest'] == expected
          configs = inspect(latest, '{{json .Image}}')
          for platform in ('linux/amd64', 'linux/arm64'):
              labels = configs[platform]['config']['Labels']
              assert labels['org.opencontainers.image.version'] == '0.52.1.2-ee2c294'
              assert labels['org.opencontainers.image.revision'] == 'ee2c2945124136d6a1b8ecec447e0bf12014d7ba'
              assert labels['com.browseros.claw-server.version'] == '0.0.93'
          print('Verified latest: ' + expected, flush=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Promoted `ghcr.io/browseros-ai/neo:latest` to verified Neo 0.52.1.2.\n\n'
              + '`' + expected + '`\n\n'
              + 'linux/amd64 and linux/arm64 verified; version tag preserved.\n'
          )
          PYTHON
