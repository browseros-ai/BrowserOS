name: "Release: Neo Docker image"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      latest:
        type: boolean
        default: false

permissions: {}

jobs:
  permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check existing Neo package push permission
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/ghcr-token.json"
          if ! curl --silent --show-error --fail-with-body \
            --user "$GHCR_USERNAME:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:browseros-ai/neo:pull,push' \
            --output "$response"; then
            jq -r '.errors[]? | "\(.code): \(.message)"' "$response"
            exit 1
          fi
          token="$(jq -er '.token // .access_token' "$response")"
          echo "::add-mask::$token"
          headers="$RUNNER_TEMP/ghcr-upload.headers"
          if ! curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $token" \
            --request POST \
            --dump-header "$headers" \
            --output "$response" \
            'https://ghcr.io/v2/browseros-ai/neo/blobs/uploads/'; then
            jq -r '.errors[]? | "\(.code): \(.message)"' "$response"
            exit 1
          fi
          location="$(awk 'tolower($1) == "location:" {sub(/\r$/, "", $2); print $2}' "$headers")"
          case "$location" in
            /v2/*) location="https://ghcr.io$location" ;;
            https://ghcr.io/v2/*) ;;
            *) echo 'Unexpected upload location'; exit 1 ;;
          esac
          cleanup_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            --request DELETE "$location")"
          case "$cleanup_status" in
            204|404) ;;
            405) echo 'GHCR does not implement upload cancellation; the empty upload will expire.' ;;
            *) echo "Unexpected upload cleanup status: $cleanup_status"; exit 1 ;;
          esac
          echo 'GHCR accepted a blob upload using the workflow token; no image version published.' 
