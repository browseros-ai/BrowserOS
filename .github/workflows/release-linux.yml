name: "Release: Linux Browser"

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Product set to build"
        type: choice
        default: browseros
        options:
          - browseros
          - browserclaw
          - all
      arch:
        description: "Linux artifact set (arm64 cross-compiles on the x64 runner)"
        type: choice
        default: x64
        options:
          - x64
          - arm64
          - all
      upload_to_r2:
        description: "Upload release metadata/artifacts to R2"
        type: boolean
        default: true
      server_version:
        description: "Exact server resource version (required with arch=all)"
        type: string
        default: ""
      extension_version:
        description: "Exact extension resource version (required with arch=all)"
        type: string
        default: ""
      onboarding_version:
        description: "Exact onboarding resource version (required with arch=all)"
        type: string
        default: ""
  workflow_call:
    inputs:
      arch:
        description: "Linux artifact set: x64, arm64, or all"
        required: false
        type: string
        default: x64
      products:
        description: "Product set to build: browseros, browserclaw, or all"
        required: false
        type: string
        default: browseros
      upload_to_r2:
        description: "Upload release metadata/artifacts to R2"
        required: false
        type: boolean
        default: true
      resource_mode:
        description: "Resource provider: published or source"
        required: false
        type: string
        default: published
      candidate_sha:
        description: "Exact source candidate SHA"
        required: false
        type: string
        default: ""
      prepared_resources_artifact:
        description: "Prepared common-resource artifact"
        required: false
        type: string
        default: ""
      ref:
        description: "Published-mode checkout ref"
        required: false
        type: string
        default: ""
      server_version:
        description: "Exact published product server version"
        required: false
        type: string
        default: ""
      extension_version:
        description: "Exact published product extension version"
        required: false
        type: string
        default: ""
      onboarding_version:
        description: "Exact published onboarding resource version"
        required: false
        type: string
        default: ""
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET:
        required: false
      BROWSEROS_CONFIG_URL:
        required: false
      POSTHOG_API_KEY:
        required: false
      SENTRY_DSN:
        required: false
      CLAW_POSTHOG_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: release-linux
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve product matrix
        id: plan
        env:
          ARCH: ${{ inputs.arch || 'x64' }}
          PRODUCTS: ${{ inputs.products || 'browseros' }}
          RESOURCE_MODE: ${{ inputs.resource_mode || 'published' }}
          SERVER_VERSION: ${{ inputs.server_version || '' }}
          EXTENSION_VERSION: ${{ inputs.extension_version || '' }}
          ONBOARDING_VERSION: ${{ inputs.onboarding_version || '' }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            x64|arm64) architectures="$(jq -cn --arg arch "$ARCH" '[$arch]')" ;;
            all) architectures='["x64","arm64"]' ;;
            *)
              echo "::error::arch must be x64, arm64, or all"
              exit 1
              ;;
          esac
          case "$RESOURCE_MODE" in
            published) ;;
            source)
              if [ "$ARCH" != x64 ]; then
                echo "::error::Linux source mode supports only x64; arm64 requires published resources"
                exit 1
              fi
              ;;
            *)
              echo "::error::resource_mode must be published or source"
              exit 1
              ;;
          esac
          if [ "$PRODUCTS" = "all" ] && [ "$RESOURCE_MODE" = "source" ]; then
            echo "::error::source mode builds one candidate product per lane"
            exit 1
          fi
          # Two serial builds can resolve mutable latest aliases hours apart.
          # Freeze all product resources before expanding a multi-arch matrix.
          if [ "$ARCH" = all ]; then
            semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            extension_pattern='^[0-9]+(\.[0-9]+){0,3}$'
            if [ "$PRODUCTS" = all ] || \
              ! [[ "$SERVER_VERSION" =~ $semver_pattern && \
                   "$ONBOARDING_VERSION" =~ $semver_pattern && \
                   "$EXTENSION_VERSION" =~ $extension_pattern ]]; then
              echo "::error::arch=all requires one product and numeric server_version, extension_version, and onboarding_version; use the full product release or supply exact release versions"
              exit 1
            fi
          fi
          case "$PRODUCTS" in
            all)
              matrix='[{"product":"browseros"},{"product":"browserclaw"}]'
              ;;
            browseros|browserclaw)
              matrix="$(jq -cn --arg product "$PRODUCTS" '[{product:$product}]')"
              ;;
            *)
              echo "::error::products must be one of: browseros, browserclaw, all"
              exit 1
              ;;
          esac
          matrix="$(jq -cn --argjson products "$matrix" --argjson architectures "$architectures" \
            '[$products[] as $product | $architectures[] as $arch | $product + {arch:$arch}]')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # WarpBuild provisions runners on demand via webhook; when none arrive
  # (org runner-group policy, bad label, account issue) the build jobs sit
  # queued until GitHub discards them 24h later, holding the release-linux
  # concurrency group all day. Fail fast instead - see the troubleshooting
  # section of packages/browseros/bos_build/docs/warpbuild-ci.md.
  queue-watchdog:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Fail fast when no runner picks up the builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCURRENCY_GROUP: release-linux
          RUNNER_LABEL: warp-custom-browseros-ubuntu-2204-x64-32x
          JOB_FILTER: >-
            [.jobs[]
            | select(any(.labels[]?; . == $runner_label))
            | {name, status}]
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 20 * 60 ))
          failures=0
          while :; do
            if response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")" \
              && jobs="$(jq -c --arg runner_label "$RUNNER_LABEL" "$JOB_FILTER" <<<"$response")"; then
              failures=0
            else
              failures=$(( failures + 1 ))
              if [ "$failures" -ge 3 ]; then
                echo "::error::queue-watchdog could not list this run's jobs (3 consecutive failures); builds are unwatched this run."
                exit 1
              fi
              sleep 120
              continue
            fi
            total="$(jq 'length' <<<"$jobs")"
            queued="$(jq '[.[] | select(.status == "queued")] | length' <<<"$jobs")"
            in_progress="$(jq '[.[] | select(.status == "in_progress")] | length' <<<"$jobs")"
            # The matrix is serialized to own release.json. Later entries
            # intentionally queue behind the first multi-hour build, so this
            # watchdog only establishes that the shared runner can start work.
            started="$(jq '[.[] | select(.status == "in_progress" or .status == "completed")] | length' <<<"$jobs")"
            if [ "$started" -gt 0 ]; then
              echo "Linux build runner picked up work; later matrix entries run serially."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              doc="packages/browseros/bos_build/docs/warpbuild-ci.md"
              if [ "$total" -eq 0 ]; then
                echo "::error::queue-watchdog matched no build jobs - did the lane's runner label change? Fix the filter; not cancelling."
                exit 1
              fi
              stuck="$(jq -r '[.[] | select(.status == "queued") | .name] | join(", ")' <<<"$jobs")"
              # Cancel only when nothing is live: a queued job is then the
              # only thing keeping the run (and concurrency group) pinned.
              if [ "$queued" -gt 0 ] && [ "$in_progress" -eq 0 ]; then
                echo "::error::No build job is running and these never left the queue: $stuck. Check the runner-group public-repo setting, runner labels, and the WarpBuild dashboard - see $doc. Cancelling the run to free the $CONCURRENCY_GROUP concurrency group."
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
              else
                echo "::error::Still queued after 20 min: $stuck. In-progress builds keep running - see $doc."
              fi
              exit 1
            fi
            sleep 120
          done

  build:
    needs: plan
    strategy:
      fail-fast: false
      # Both architectures merge the same product/version/linux/release.json.
      # Keep its read/merge/write under one owner, including architecture retries.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.product }} linux-${{ matrix.arch }})
    uses: ./.github/workflows/build-browseros.yml
    with:
      platform: linux
      arch: ${{ matrix.arch }}
      product: ${{ matrix.product }}
      runner: warp-custom-browseros-ubuntu-2204-x64-32x
      timeout-minutes: 660
      profile: release-ci
      sign: false
      upload: ${{ inputs.upload_to_r2 }}
      resource-mode: ${{ inputs.resource_mode || 'published' }}
      candidate-sha: ${{ inputs.candidate_sha || '' }}
      prepared-resources-artifact: ${{ inputs.prepared_resources_artifact || '' }}
      ref: ${{ inputs.ref || '' }}
      server-version: ${{ inputs.server_version || '' }}
      extension-version: ${{ inputs.extension_version || '' }}
      onboarding-version: ${{ inputs.onboarding_version || '' }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BROWSEROS_CONFIG_URL: ${{ secrets.BROWSEROS_CONFIG_URL }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      CLAW_POSTHOG_KEY: ${{ secrets.CLAW_POSTHOG_KEY }}
