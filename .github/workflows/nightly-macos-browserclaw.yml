name: "Nightly: BrowserOS neo (macOS arm64)"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  # Retain the historical family lock during cutover so saved family reruns
  # cannot overlap a product transaction. Each graph owns only its product.
  group: release-suite
  cancel-in-progress: false
  queue: max

jobs:
  transaction:
    name: Freeze and reserve BrowserOS neo transaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Product and standalone allocators must observe one serialized component
      # namespace between discovery and their durable reservation write.
      group: release-component-allocation
      cancel-in-progress: false
      queue: max
    outputs:
      state_ref: ${{ steps.transaction.outputs.state_ref }}
      source_sha: ${{ steps.transaction.outputs.source_sha }}
      reservation_sha: ${{ steps.transaction.outputs.reservation_sha }}
      browser_version: ${{ steps.transaction.outputs.browser_version }}
      claw_server_version: ${{ steps.transaction.outputs.claw_server_version }}
      browserclaw_version: ${{ steps.transaction.outputs.browserclaw_version }}
      onboarding_version: ${{ steps.transaction.outputs.onboarding_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Reconcile product transaction
        id: transaction
        working-directory: packages/browseros
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error::Nightlies require main to be the repository default branch"
            exit 1
          fi
          if [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "::error::Nightlies must run from refs/heads/main"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          uv run browseros release suite reconcile \
            --mode nightly \
            --product browserclaw \
            --source-sha "$source_sha" \
            --default-branch "$DEFAULT_BRANCH" \
            --dispatch-ref "$DEFAULT_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-suite.json"
          if [ "$(jq -r '.state' "$RUNNER_TEMP/release-suite.json")" != "open" ]; then
            echo "::error::Only an open transaction can start builds. Recover post-build publication with Re-run failed jobs on its original workflow run."
            exit 1
          fi

  prepare-claw-server:
    name: Prepare exact BrowserOS neo server
    needs: transaction
    uses: ./.github/workflows/release-claw-server.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      mode: build
      defer_finalize: true
      state_owner: suite
      version: ${{ needs.transaction.outputs.claw_server_version }}
      ref: ${{ needs.transaction.outputs.source_sha }}
      publish_ota: false
    secrets: inherit

  prepare-browserclaw:
    name: Prepare exact BrowserOS neo extension
    needs: transaction
    uses: ./.github/workflows/release-extensions.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      extension: browserclaw
      branch: ${{ needs.transaction.outputs.source_sha }}
      mode: build
      defer_finalize: true
      state_owner: suite
      version: ${{ needs.transaction.outputs.browserclaw_version }}
      publish_alpha_feed: false
    secrets: inherit

  verify-components:
    name: Verify exact prepared BrowserOS neo components
    needs: [transaction, prepare-claw-server, prepare-browserclaw]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source and version identities
        env:
          SOURCE_SHA: ${{ needs.transaction.outputs.source_sha }}
          SERVER_SHA: ${{ needs.prepare-claw-server.outputs.release_sha }}
          SERVER_VERSION: ${{ needs.prepare-claw-server.outputs.version }}
          EXTENSION_SHA: ${{ needs.prepare-browserclaw.outputs.release_sha }}
          EXTENSION_VERSION: ${{ needs.prepare-browserclaw.outputs.version }}
        run: |
          set -euo pipefail
          test "$SERVER_SHA" = "$SOURCE_SHA"
          test "$EXTENSION_SHA" = "$SOURCE_SHA"
          test "$SERVER_VERSION" = "${{ needs.transaction.outputs.claw_server_version }}"
          test "$EXTENSION_VERSION" = "${{ needs.transaction.outputs.browserclaw_version }}"

  build-browserclaw:
    name: Build signed BrowserOS neo nightly
    needs: [transaction, verify-components]
    uses: ./.github/workflows/reusable-build-macos-nightly.yml
    permissions:
      contents: read
    with:
      product: browserclaw
      state_ref: ${{ needs.transaction.outputs.state_ref }}
      source_sha: ${{ needs.transaction.outputs.source_sha }}
      reservation_sha: ${{ needs.transaction.outputs.reservation_sha }}
      browser_version: ${{ needs.transaction.outputs.browser_version }}
      server_version: ${{ needs.transaction.outputs.claw_server_version }}
      extension_version: ${{ needs.transaction.outputs.browserclaw_version }}
      onboarding_version: ${{ needs.transaction.outputs.onboarding_version }}
    secrets: inherit

  finalize-claw-server:
    name: Finalize exact BrowserOS neo server
    needs: [transaction, build-browserclaw]
    uses: ./.github/workflows/release-claw-server.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      mode: finalize
      state_owner: suite
      version: ${{ needs.transaction.outputs.claw_server_version }}
      ref: ${{ needs.transaction.outputs.source_sha }}
      publish_ota: false
    secrets: inherit

  finalize-browserclaw:
    name: Finalize exact BrowserOS neo extension
    needs: [transaction, build-browserclaw]
    uses: ./.github/workflows/release-extensions.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      extension: browserclaw
      branch: ${{ needs.transaction.outputs.source_sha }}
      mode: finalize
      state_owner: suite
      version: ${{ needs.transaction.outputs.browserclaw_version }}
      publish_alpha_feed: false
    secrets: inherit

  claw-server-ota:
    name: Assemble BrowserOS neo server alpha snapshot
    needs: [transaction, finalize-claw-server]
    uses: ./.github/workflows/publish-server-ota.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      product: browserclaw
      version: ${{ needs.transaction.outputs.claw_server_version }}
      release_sha: ${{ needs.transaction.outputs.source_sha }}
      snapshot_path: updates/server/appcast-claw-server.alpha.xml
      state_owner: suite
    secrets: inherit

  publish:
    name: Merge and publish BrowserOS neo nightly
    needs: [transaction, build-browserclaw, finalize-claw-server, finalize-browserclaw, claw-server-ota]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # This is the shared read-modify-write boundary. Keep current-main feed
      # resolution, durable state merge, and R2 writes in this one locked job.
      group: release-feed-snapshots
      cancel-in-progress: false
      queue: max
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.transaction.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.transaction.outputs.source_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Recover product transaction
        id: recovery
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/release-suite.json"
          uv run browseros release suite inspect \
            --mode nightly \
            --product browserclaw \
            --source-sha "$SOURCE_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --dispatch-ref "$DEFAULT_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$record"
          state="$(jq -r '.state' "$record")"
          case "$state" in open|merged) ;; *) exit 1 ;; esac
          test "$(jq -r '.reservation_sha' "$record")" = "${{ needs.transaction.outputs.reservation_sha }}"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-browserclaw.outputs.artifact_name }}
          path: ${{ runner.temp }}/nightly-browserclaw

      - uses: actions/download-artifact@v7
        if: steps.recovery.outputs.state == 'open'
        with:
          name: server-ota-snapshot-browserclaw
          path: ${{ runner.temp }}/server-ota-browserclaw

      - name: Compose snapshots from current main
        id: baseline
        if: steps.recovery.outputs.state == 'open'
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --no-tags
          BASE_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git merge-base --is-ancestor "$SOURCE_SHA" "$BASE_SHA"
          # Keep HEAD at the frozen source for reconcile's provenance check.
          # Only these snapshots enter the product overlay; shared extension
          # bytes start at current main so failed sibling uploads remain durable.
          git restore --source="$BASE_SHA" --worktree -- \
            updates/extensions/bundled-manifest.xml \
            updates/extensions/extensions.alpha.json \
            updates/extensions/update-manifest.alpha.xml \
            updates/server/appcast-claw-server.alpha.xml
          snapshot="$(find "$RUNNER_TEMP/server-ota-browserclaw" -type f -name 'appcast-claw-server.alpha.xml' -print -quit)"
          test -n "$snapshot"
          cp "$snapshot" updates/server/appcast-claw-server.alpha.xml
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Render shared extension feeds with the selected product pin
        if: steps.recovery.outputs.state == 'open'
        working-directory: packages/browseros
        env:
          EXTENSION_VERSION: ${{ needs.transaction.outputs.browserclaw_version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          uv run browseros release extensions \
            --channel alpha \
            --baseline-root "$GITHUB_WORKSPACE/updates" \
            --set "browserclaw=$EXTENSION_VERSION"

      - name: Reconcile and merge product state
        if: steps.recovery.outputs.state == 'open'
        working-directory: packages/browseros
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/release-suite.json"
          gate="$RUNNER_TEMP/release-suite-gate.json"
          uv run browseros release suite reconcile \
            --mode nightly \
            --product browserclaw \
            --source-sha "$SOURCE_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --dispatch-ref "$DEFAULT_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --state-base-sha "$BASE_SHA" \
            --state-root "$GITHUB_WORKSPACE" \
            --output "$record"
          jq '{
            schema: "browseros-release-suite-gate-v1",
            passed: true,
            transaction_id,
            source_sha,
            state_sha,
            browser_version,
            component_versions,
            state_checksums,
            products: ["browserclaw"]
          }' "$record" > "$gate"
          uv run browseros release suite merge \
            --record "$record" \
            --gate "$gate" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify merged transaction and restore current committed feeds
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/release-suite.json"
          test "$(jq -r '.state' "$record")" = "merged"
          merge_sha="$(jq -r '.merge_sha' "$record")"
          [[ "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          uv run browseros release suite inspect \
            --mode nightly \
            --product browserclaw \
            --source-sha "$SOURCE_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --dispatch-ref "$DEFAULT_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$record"
          test "$(jq -r '.state' "$record")" = "merged"
          test "$(jq -r '.merge_sha' "$record")" = "$merge_sha"
          cd "$GITHUB_WORKSPACE"
          git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --no-tags
          current_main="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git merge-base --is-ancestor "$merge_sha" "$current_main"
          # Publication recovery can run after a sibling committed newer shared
          # feeds. Publish current committed bytes, never the old merge snapshot.
          git restore --source="$current_main" --worktree -- \
            updates/extensions/bundled-manifest.xml \
            updates/extensions/extensions.alpha.json \
            updates/extensions/update-manifest.alpha.xml \
            updates/server/appcast-claw-server.alpha.xml

      - name: Publish immutable signed browser artifact
        working-directory: packages/browseros
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          uv run browseros release suite publish-browser-artifact \
            --record "$RUNNER_TEMP/release-suite.json" \
            --product browserclaw \
            --artifact-root "$RUNNER_TEMP/nightly-browserclaw"

      - name: Publish current committed product feeds
        working-directory: packages/browseros
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          uv run browseros release feeds publish-local \
            server/appcast-claw-server.alpha.xml \
            extensions/update-manifest.alpha.xml \
            extensions/extensions.alpha.json \
            extensions/bundled-manifest.xml \
            --publish

      - name: Reconcile product rolling nightly release
        working-directory: packages/browseros
        env:
          VERSION: ${{ needs.transaction.outputs.browser_version }}
        run: |
          set -euo pipefail
          # Immutable bytes and committed feeds precede the retryable rolling
          # release saga. A newer product tag is preserved by its source checks.
          uv run browseros release suite reconcile-rolling-release \
            --tag nightly-browserclaw \
            --title "BrowserOS neo Nightly (signed macOS arm64)" \
            --source-sha "$SOURCE_SHA" \
            --browser-version "$VERSION" \
            --artifact-root "$RUNNER_TEMP/nightly-browserclaw" \
            --repo "$GITHUB_REPOSITORY"

  notify-failure:
    name: Notify BrowserOS neo nightly failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs:
      - transaction
      - prepare-claw-server
      - prepare-browserclaw
      - verify-components
      - build-browserclaw
      - finalize-claw-server
      - finalize-browserclaw
      - claw-server-ota
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Slack failure ping
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          payload="$(jq -cn --arg url "$RUN_URL" '{text: (":x: BrowserOS neo nightly failed — " + $url)}')"
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
