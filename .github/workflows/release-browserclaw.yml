name: "Release: BrowserOS neo (full)"

# Defaults reproduce the full release: every native lane, Linux x64 and arm64,
# macOS universal, and public component releases with alpha OTA/feeds. Narrower
# dispatches select lanes and keep components private; preflight validates every
# input once and later jobs read only its outputs.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Browser platforms to build and attach to the draft"
        type: choice
        default: all
        options:
          - all
          - macos
          - linux
          - windows
      macos_arch:
        description: "macOS artifact set (universal also yields arm64 and x64 DMGs)"
        type: choice
        default: universal
        options:
          - universal
          - arm64
      linux_arch:
        description: "Linux artifact set (arm64 uses the x64 build runner)"
        type: choice
        default: all
        options:
          - all
          - x64
          - arm64
      publication:
        description: "alpha: publish components, alpha OTA/feeds. draft-only: private component drafts, no tags/aliases/feeds/Slack"
        type: choice
        default: alpha
        options:
          - alpha
          - draft-only

permissions: {}

concurrency:
  group: release-browserclaw
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Resolve main release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_linux: ${{ steps.selection.outputs.build_linux }}
      build_macos: ${{ steps.selection.outputs.build_macos }}
      build_windows: ${{ steps.selection.outputs.build_windows }}
      macos_arch: ${{ steps.selection.outputs.macos_arch }}
      linux_arch: ${{ steps.selection.outputs.linux_arch }}
      onboarding_version: ${{ steps.release.outputs.onboarding_version }}
      platforms: ${{ steps.selection.outputs.platforms }}
      publication: ${{ steps.selection.outputs.publication }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Runs before any allocation or build so a malformed request publishes
      # nothing. Values arrive through env and are re-emitted only after an
      # exact match, so no dispatch text is ever expanded into a script.
      - name: Validate release selection
        id: selection
        env:
          MACOS_ARCH: ${{ inputs.macos_arch }}
          LINUX_ARCH: ${{ inputs.linux_arch }}
          PLATFORMS: ${{ inputs.platforms }}
          PUBLICATION: ${{ inputs.publication }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            all) build_linux=true build_windows=true build_macos=true ;;
            linux) build_linux=true build_windows=false build_macos=false ;;
            windows) build_linux=false build_windows=true build_macos=false ;;
            macos) build_linux=false build_windows=false build_macos=true ;;
            *)
              echo "::error::platforms must be all, macos, linux, or windows"
              exit 1
              ;;
          esac
          case "$MACOS_ARCH" in
            universal|arm64) ;;
            *)
              echo "::error::macos_arch must be universal or arm64"
              exit 1
              ;;
          esac
          if [ "$build_macos" != true ] && [ "$MACOS_ARCH" != universal ]; then
            echo "::error::macos_arch=$MACOS_ARCH requires platforms to include macos"
            exit 1
          fi
          case "$LINUX_ARCH" in
            x64|arm64|all) ;;
            *)
              echo "::error::linux_arch must be x64, arm64, or all"
              exit 1
              ;;
          esac
          # The default all is harmless when Linux is skipped. Keep accepting
          # x64 for existing callers that supplied the previous default.
          if [ "$build_linux" != true ] && [ "$LINUX_ARCH" = arm64 ]; then
            echo "::error::linux_arch=$LINUX_ARCH requires platforms to include linux"
            exit 1
          fi
          case "$PUBLICATION" in
            alpha|draft-only) ;;
            *)
              echo "::error::publication must be alpha or draft-only"
              exit 1
              ;;
          esac
          {
            echo "build_linux=$build_linux"
            echo "build_macos=$build_macos"
            echo "build_windows=$build_windows"
            echo "macos_arch=$MACOS_ARCH"
            echo "linux_arch=$LINUX_ARCH"
            echo "platforms=$PLATFORMS"
            echo "publication=$PUBLICATION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Resolve release source and version
        id: release
        working-directory: packages/browseros
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "::error::Full releases must be dispatched from $expected_ref"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          version="$(uv run python bos_build/scripts/bump_version.py --mode none)"
          onboarding_version="$(jq -er '.version' "$GITHUB_WORKSPACE/packages/browseros-agent/apps/claw-onboard/package.json")"
          {
            echo "onboarding_version=$onboarding_version"
            echo "source_sha=$source_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # draft-only stops each component after its immutable versioned R2 objects
  # and private draft exist. Deferring finalize also skips the reusable
  # workflows' tag push, server `latest` alias copy, public release, OTA/feed
  # publication and version-reflection PR, all of which hang off finalize.
  # The versions they output still pin the browser lanes to those objects.
  server:
    name: Release BrowserOS neo server
    needs: preflight
    uses: ./.github/workflows/release-claw-server.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      ref: ${{ needs.preflight.outputs.source_sha }}
      defer_finalize: ${{ needs.preflight.outputs.publication == 'draft-only' }}
      publish_ota: ${{ needs.preflight.outputs.publication == 'alpha' }}
    secrets: inherit

  extension:
    name: Release BrowserOS neo extension
    needs: [preflight, server]
    uses: ./.github/workflows/release-extensions.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      extension: browserclaw
      branch: ${{ needs.preflight.outputs.source_sha }}
      defer_finalize: ${{ needs.preflight.outputs.publication == 'draft-only' }}
      publish_alpha_feed: ${{ needs.preflight.outputs.publication == 'alpha' }}
    secrets: inherit

  components:
    name: Verify exact component releases
    needs: [preflight, server, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source and versions
        env:
          EXTENSION_SHA: ${{ needs.extension.outputs.release_sha }}
          EXTENSION_VERSION: ${{ needs.extension.outputs.version }}
          ONBOARDING_VERSION: ${{ needs.preflight.outputs.onboarding_version }}
          SERVER_SHA: ${{ needs.server.outputs.release_sha }}
          SERVER_VERSION: ${{ needs.server.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SERVER_SHA" = "$SOURCE_SHA"
          test "$EXTENSION_SHA" = "$SOURCE_SHA"
          [[ "$SERVER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXTENSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ONBOARDING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  # Native lanes run only when preflight selected them. A job-level `if`
  # without a status function keeps the implicit success() over `needs`, so
  # a selected lane still requires preflight and both exact components.
  linux:
    name: Linux ${{ inputs.linux_arch }}
    needs: [preflight, server, extension, components]
    if: needs.preflight.outputs.build_linux == 'true'
    uses: ./.github/workflows/release-linux.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browserclaw
      arch: ${{ needs.preflight.outputs.linux_arch }}
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  windows:
    name: Windows x64
    needs: [preflight, server, extension, components]
    if: needs.preflight.outputs.build_windows == 'true'
    uses: ./.github/workflows/release-windows.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browserclaw
      sign: true
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  macos:
    name: macOS ${{ inputs.macos_arch }}
    needs: [preflight, server, extension, components]
    if: needs.preflight.outputs.build_macos == 'true'
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: read
    with:
      products: browserclaw
      arch: ${{ needs.preflight.outputs.macos_arch }}
      # draft-only test builds must not reach Slack, including the lane's
      # failure ping and any webhook the persistent builder's .env provides.
      notify: ${{ needs.preflight.outputs.publication == 'alpha' }}
      upload_to_r2: true
      resource_mode: published
      ref: ${{ needs.preflight.outputs.source_sha }}
      server_version: ${{ needs.server.outputs.version }}
      extension_version: ${{ needs.extension.outputs.version }}
      onboarding_version: ${{ needs.preflight.outputs.onboarding_version }}
    secrets: inherit

  # Finalize must tolerate intentionally skipped lanes, so it replaces the
  # implicit success() with !cancelled() and states every dependency itself:
  # preflight and both components must succeed, each selected lane must
  # succeed, and each unselected lane must be skipped. A failed or cancelled
  # selected lane, or an unselected lane that ran anyway, leaves no draft.
  finalize:
    name: Create browser draft
    needs: [preflight, server, extension, components, linux, windows, macos]
    if: >-
      ${{
        !cancelled()
        && needs.preflight.result == 'success'
        && needs.server.result == 'success'
        && needs.extension.result == 'success'
        && needs.components.result == 'success'
        && needs.linux.result == (needs.preflight.outputs.build_linux == 'true' && 'success' || 'skipped')
        && needs.windows.result == (needs.preflight.outputs.build_windows == 'true' && 'success' || 'skipped')
        && needs.macos.result == (needs.preflight.outputs.build_macos == 'true' && 'success' || 'skipped')
      }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      # The finalizer selects only receipts for the chosen platforms and
      # macOS artifact set, bound to this source SHA and run ID.
      - name: Create or refresh browser draft
        working-directory: packages/browseros
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_ARCH: ${{ needs.preflight.outputs.macos_arch }}
          LINUX_ARCH: ${{ needs.preflight.outputs.linux_arch }}
          PLATFORMS: ${{ needs.preflight.outputs.platforms }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          uv run browseros release github create \
            --version "$VERSION" \
            --product browserclaw \
            --platforms "$PLATFORMS" \
            --macos-arch "$MACOS_ARCH" \
            --linux-arch "$LINUX_ARCH" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --target "$SOURCE_SHA"
