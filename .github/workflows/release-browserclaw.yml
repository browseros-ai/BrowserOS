name: "Release: BrowserOS neo (full)"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-browserclaw
  cancel-in-progress: false

jobs:
  candidate:
    name: Prepare immutable candidate
    concurrency:
      group: release-component-allocation
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser_version: ${{ steps.candidate.outputs.browser_version }}
      candidate_artifact: release-candidate-browserclaw-${{ steps.candidate.outputs.candidate_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      common_artifact: release-resources-browserclaw-${{ steps.candidate.outputs.candidate_sha }}
      gate_artifact: release-gate-browserclaw-${{ steps.candidate.outputs.candidate_sha }}
      parent_sha: ${{ steps.candidate.outputs.parent_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Create or recover candidate
        id: candidate
        working-directory: packages/browseros
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv run browseros release candidate ensure \
            --product browserclaw \
            --parent-sha "$GITHUB_SHA" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --dispatch-ref "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-candidate/candidate.json" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate record
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-browserclaw-${{ steps.candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/release-candidate/candidate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  common:
    name: Prepare common resources
    needs: candidate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.candidate_sha }}

      - name: Verify exact candidate checkout
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: astral-sh/setup-uv@v8.3.2

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Download candidate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Recover prepared common resources
        id: recover
        env:
          ARTIFACT_NAME: ${{ needs.candidate.outputs.common_artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/prepared-resources"
          rm -rf "$output"
          mkdir -p "$output"
          run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false) | .workflow_run.id][0] // empty')"
          recovered=false
          if [ -n "$run_id" ] && gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$output"; then
            recovered=true
          fi
          if [ "$recovered" != "true" ]; then
            rm -rf "$output"
            mkdir -p "$output"
          fi
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"

      - name: Prepare or validate common resources
        working-directory: packages/browseros
        env:
          BROWSERCLAW_KEY: ${{ secrets.BROWSERCLAW_KEY }}
          NODE_ENV: production
          VITE_CLAW_POSTHOG_HOST: ${{ secrets.VITE_CLAW_POSTHOG_HOST }}
          VITE_CLAW_POSTHOG_KEY: ${{ secrets.VITE_CLAW_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          uv run browseros release resources prepare \
            --candidate "$RUNNER_TEMP/candidate/candidate.json" \
            --output "$RUNNER_TEMP/prepared-resources"

      - name: Upload prepared common resources
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.common_artifact }}
          path: ${{ runner.temp }}/prepared-resources
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  linux:
    name: Linux x64
    needs: [candidate, common]
    uses: ./.github/workflows/release-linux.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browserclaw
      upload_to_r2: true
      resource_mode: source
      candidate_sha: ${{ needs.candidate.outputs.candidate_sha }}
      prepared_resources_artifact: ${{ needs.candidate.outputs.common_artifact }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLAW_POSTHOG_KEY: ${{ secrets.CLAW_POSTHOG_KEY }}

  windows:
    name: Windows x64
    needs: [candidate, common]
    uses: ./.github/workflows/release-windows.yml
    permissions:
      actions: write
      contents: read
    with:
      products: browserclaw
      sign: true
      upload_to_r2: true
      resource_mode: source
      candidate_sha: ${{ needs.candidate.outputs.candidate_sha }}
      prepared_resources_artifact: ${{ needs.candidate.outputs.common_artifact }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLAW_POSTHOG_KEY: ${{ secrets.CLAW_POSTHOG_KEY }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  macos:
    name: macOS universal
    needs: [candidate, common]
    uses: ./.github/workflows/release-macos.yml
    permissions:
      actions: read
      contents: read
    with:
      products: browserclaw
      arch: universal
      upload_to_r2: true
      resource_mode: source
      candidate_sha: ${{ needs.candidate.outputs.candidate_sha }}
      prepared_resources_artifact: ${{ needs.candidate.outputs.common_artifact }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLAW_POSTHOG_KEY: ${{ secrets.CLAW_POSTHOG_KEY }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
      PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
      PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  gate:
    name: Gate native lanes
    needs: [candidate, linux, windows, macos]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Download candidate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Download lane manifests
        uses: actions/download-artifact@v8
        with:
          pattern: lane-browserclaw-*
          path: ${{ runner.temp }}/lanes

      - name: Validate complete native matrix
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          mapfile -t lanes < <(find "$RUNNER_TEMP/lanes" -type f -name '*.json' | sort)
          if [ "${#lanes[@]}" -ne 3 ]; then
            echo "::error::Expected three lane manifests, found ${#lanes[@]}"
            exit 1
          fi
          args=()
          for lane in "${lanes[@]}"; do
            args+=(--lane "$lane")
          done
          uv run browseros release browser gate \
            "${args[@]}" \
            --output "$RUNNER_TEMP/release-gate/gate.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload gate record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.gate_artifact }}
          path: ${{ runner.temp }}/release-gate/gate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  merge:
    name: Merge candidate
    needs: [candidate, gate]
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      state: ${{ steps.merge.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.candidate_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Download candidate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Download gate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.gate_artifact }}
          path: ${{ runner.temp }}/gate

      - name: Merge exact candidate
        id: merge
        working-directory: packages/browseros
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run browseros release candidate merge \
            --record "$RUNNER_TEMP/candidate/candidate.json" \
            --gate "$RUNNER_TEMP/gate/gate.json" \
            --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload merged candidate record
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate/candidate.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  finalize:
    name: Finalize browser draft
    needs: [candidate, gate, merge]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Download merged candidate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Download gate record
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.candidate.outputs.gate_artifact }}
          path: ${{ runner.temp }}/gate

      - name: Create or refresh browser draft
        working-directory: packages/browseros
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          uv run browseros release browser finalize \
            --candidate "$RUNNER_TEMP/candidate/candidate.json" \
            --gate "$RUNNER_TEMP/gate/gate.json" \
            --repo "$GITHUB_REPOSITORY" \
            --preview-dir "$RUNNER_TEMP/finalization/previews" \
            --output "$RUNNER_TEMP/finalization/finalization.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload finalization previews
        uses: actions/upload-artifact@v7
        with:
          name: release-finalization-browserclaw-${{ needs.candidate.outputs.candidate_sha }}
          path: ${{ runner.temp }}/finalization
          if-no-files-found: error
          overwrite: true
          retention-days: 30
